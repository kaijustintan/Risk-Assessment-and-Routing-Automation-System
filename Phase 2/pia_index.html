// ✅ VALIDATION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
/*
  Function Name: validateEmail
  LAYMAN: Checks an email looks real — one @, a domain with a dot, a sensible TLD, no double
    dots. Used before accepting drafter/head/stakeholder emails.
  TECHNICAL: Trim + regex (/^[^\s@]+@[^\s@]+\.[^\s@]+$/) plus structural checks on the domain
    parts and TLD length, and a no-consecutive-dots rule.
  PARAMS: email — candidate string.
  RETURNS: boolean.
  EXAMPLE
    validateEmail('jane@corp.com')  -> true
    validateEmail('jane@corp')      -> false
*/
function validateEmail(email) {
  // Comprehensive email validation: checks @ symbol, domain format, and rejects invalid patterns
  if (!email || typeof email !== 'string') return false;
  const trimmed = email.trim();
  if (!trimmed) return false;
  // RFC 5322 simplified pattern with domain requirement
  const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!pattern.test(trimmed)) return false;
  // Extract domain and validate it has proper structure (at least one dot after @)
  const parts = trimmed.split('@');
  if (parts.length !== 2) return false;
  const domain = parts[1];
  // Domain must have at least one dot and a valid TLD (at least 2 chars after last dot)
  const domainParts = domain.split('.');
  if (domainParts.length < 2) return false;
  const tld = domainParts[domainParts.length - 1];
  if (tld.length < 2) return false;
  // No consecutive dots in domain
  if (domain.includes('..')) return false;
  return true;
}
/* isValidEmail — alias of validateEmail (kept for call-site readability). */
function isValidEmail(email) { return validateEmail(email); }

/*
  Function Name: validatePIA1
  LAYMAN: Checks the Program Info form is complete and sensible before letting the user
    advance: required fields present, emails well-formed, phones present, and the program
    date is today-or-future and within 10 years. Shows all problems in one toast.
  TECHNICAL: Accumulates an errors[] array across required-field, email-format, phone, and
    date-range checks (date parsed as local time to avoid UTC shift). Surfaces them via
    showError joined by ' · '.
  PARAMS: (none — reads state.pia1).
  RETURNS: boolean — true if valid.
*/
function validatePIA1() {
  const errors = [];
  if (!state.pia1.dept) errors.push('Department is required');
  if (!state.pia1.program) errors.push('Program name is required');
  if (state.pia1.program && state.pia1.program.length > 200) errors.push('Program name exceeds 200 characters');
  if (!state.pia1.date) errors.push('Program date is required');
  if (state.pia1.date) {
    // Parse date string (YYYY-MM-DD) as local time to avoid UTC timezone shift
    const parts = state.pia1.date.split('-').map(Number);
    if (parts.length !== 3 || isNaN(parts[0]) || isNaN(parts[1]) || isNaN(parts[2])) {
      errors.push('Program date is invalid');
    } else {
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const maxDate = new Date(today.getFullYear() + 10, today.getMonth(), today.getDate());
      if (d < today) errors.push('Program date must be today or a future date');
      else if (d > maxDate) errors.push('Program date must be within the next 10 years');
    }
  }
  if (!state.pia1.drafter) errors.push('Drafter name is required');
  if (!state.pia1.drafterEmail || !validateEmail(state.pia1.drafterEmail)) errors.push('Valid drafter email is required');
  // Validate ALL email fields in PIA 1
  if (state.pia1.deptHeadEmail && !validateEmail(state.pia1.deptHeadEmail)) errors.push('Invalid department head email');
  if (state.pia1.immediateHeadEmail && !validateEmail(state.pia1.immediateHeadEmail)) errors.push('Invalid immediate head email');
  if (state.pia1.divHeadEmail && !validateEmail(state.pia1.divHeadEmail)) errors.push('Invalid division head email');
  // Trunk line / phone fields are required
  if (!state.pia1.drafterPhone) errors.push('Drafter trunk line / phone is required');
  if (!state.pia1.immediateHeadPhone) errors.push('Immediate head trunk line / phone is required');
  if (!state.pia1.deptHeadPhone) errors.push('Department head trunk line / phone is required');
  if (!state.pia1.divHeadPhone) errors.push('Division head trunk line / phone is required');
  if (!state.pia1.description) errors.push('Program description is required');
  if (!state.pia1.purpose) errors.push('Purpose is required');
  if (errors.length) { showError(errors.join(' · ')); return false; }
  return true;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 🔗 BACKEND INTEGRATION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
/*
  Function Name: submitToBackend
  LAYMAN: Actually sends the whole assembled application to the server.
  TECHNICAL: Copies hasNDADPA into pia1, then apiSubmitApplication({...all piaN, flags,
    linkedReqId...}) with onSubmitSuccess/onSubmitError handlers.
  PARAMS: (none)  RETURNS: undefined (async).
*/
function submitToBackend() {
  showLoading('Submitting application…');
  state.pia1.hasNDADPA = state.hasNDADPA; // Ensure it persists to the backend for the reviewer screen
  google.script.run
    .withSuccessHandler(onSubmitSuccess)
    .withFailureHandler(onSubmitError)
    .apiSubmitApplication({ appId:state.appId, baseSessionId:state.baseSessionId, isEditing:state.isEditing, pia1:state.pia1, pia2:state.pia2, pia2CustomOthers:state.pia2CustomOthers, pia3:state.pia3, pia4:state.pia4, pia5:state.pia5, isFlagged:state.isFlagged, linkedReqId: state.parentID });
}

/*
  Function Name: onSubmitSuccess
  LAYMAN: Runs when the server accepts the submission. Records the new Application ID, marks
    the app as finished (no more autosave), tells the server to retire the draft, and shows
    the receipt screen.
  TECHNICAL: Clears the safety timeout. On result.success: sets submittedAt/status/appId,
    isIncomplete=false, draftStatus='completed', resets approvers, fires
    apiMarkDraftComplete, persists, then show('confirmation'). On !success: re-enables and
    shows the error.
  PARAMS: result — { success, appId, timestamp, errors?/error? }.  RETURNS: undefined.
*/
function onSubmitSuccess(result) {
  clearTimeout(window._submitTimeoutId);
  if (result.success) {
    state.submittedAt = result.timestamp;
    state.status = 'Pending';
    state.appId = result.appId;  // appId only set AFTER submission
    // Keep sessionId/baseSessionId as is for draft tracking
    state.revision = 0;
    state.isIncomplete = false;  // Mark as complete - no more draft saves needed
    state.draftStatus = 'completed';
    state.isEditing = false;
    state.approvalStep = 0;
    state.approvers.forEach(a => { a.decision = null; a.comment = ''; });
    
    // Mark draft as completed on server if it exists
    const cleanupId = state.baseSessionId || state.sessionId;
    if (state.draftId || cleanupId) {
      google.script.run
        .withSuccessHandler(r => {})
        .withFailureHandler(e => {})
        .apiMarkDraftComplete(state.draftId || '', cleanupId || state.appId);
    }
    
    persistState();
    setTimeout(() => { show('confirmation'); renderConfirmation(); hideLoading(); showSuccess('Application submitted successfully!'); state.isSubmitting = false; }, 600);
  } else {
    state.isSubmitting = false;
    hideLoading();
    showError('Submission failed: ' + (result.errors?.join(', ') || result.error));
  }
}

/*
  Function Name: onSubmitError
  LAYMAN: Runs when submission fails. Unlocks the button, returns the user to the summary,
    and shows the actual error (never a fake success).
  TECHNICAL: Clears the safety timeout, hides loading, resets isSubmitting, re-enables the
    button, sets currentScreen='summary', persists, re-renders summary, and toasts the error.
  PARAMS: error — the failure (Error or string).  RETURNS: undefined.
*/
function onSubmitError(error) {
  clearTimeout(window._submitTimeoutId);
  hideLoading();
  state.isSubmitting = false;
  const btn = document.getElementById('btn-submit-application');
  if (btn) btn.disabled = false;
  state.currentScreen = 'summary';
  persistState();
  show('summary'); renderSummary();
  // CRITICAL FIX: Show actual error instead of fake success
  const errorMsg = String(error || 'Unknown error occurred during submission');
  showError('Submission failed: ' + errorMsg);
}

/*
  Function Name: loadUserEmail
  LAYMAN: Figures out who the user is. If we already know a valid email, just render;
    otherwise ask the server, and if that fails, pop the manual-email modal.
  TECHNICAL: Short-circuits on a valid state.userEmail. Else apiGetUserEmail(): on a valid
    result store it + persist + render; on miss/failure call promptForUserEmail().
  PARAMS: (none)  RETURNS: undefined (async).
*/
function loadUserEmail() {
  if (state.userEmail && isValidEmail(state.userEmail)) {
    renderCurrentScreen();
    return;
  }
  google.script.run
    .withSuccessHandler(result => {
      if (result && result.email && isValidEmail(result.email)) {
        state.userEmail = result.email; persistState();
        renderCurrentScreen();
      } else { promptForUserEmail(); }
    })
    .withFailureHandler(() => { promptForUserEmail(); })
    .apiGetUserEmail();
}

/*
  Function Name: promptForUserEmail
  LAYMAN: A modal shown only when we couldn't auto-detect the user's email. They can type one
    (validated) or choose "Use anonymous", which assigns a random anon id. Then we render.
  TECHNICAL: Builds #user-email-modal (idempotent). Save: validate -> set userEmail, persist,
    close, renderCurrentScreen. Skip: generate 'anon-<uuid>' id, persist, close, render.
    Enter key submits.
  PARAMS: (none)  RETURNS: undefined.
*/
function promptForUserEmail() {
  if (document.getElementById('user-email-modal')) return;
  const overlay = document.createElement('div');
  overlay.id = 'user-email-modal';
  overlay.className = 'modal-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-labelledby', 'modal-title');
  overlay.innerHTML = `
    <div class="modal-box">
      <h3 id="modal-title">Confirm your email</h3>
      <p>We couldn't automatically detect your email. Please enter the address you want associated with this submission.</p>
      <div class="field" style="margin-bottom:12px"><label for="user-email-input">Email address <span aria-hidden="true" style="color:var(--danger-text)">*</span></label>
        <input id="user-email-input" type="email" placeholder="name@domain.example" autocomplete="email" aria-required="true" />
      </div>
      <div class="btn-row">
        <button id="user-email-skip" class="btn">Use anonymous</button>
        <button id="user-email-save" class="btn btn-primary">Save email</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const input = document.getElementById('user-email-input');
  input.focus();
  input.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('user-email-save').click(); });
  document.getElementById('user-email-save').addEventListener('click', () => {
    const val = input.value.trim();
    if (!isValidEmail(val)) { showError('Please enter a valid email address.'); return; }
    state.userEmail = val; persistState(); overlay.remove();
    renderCurrentScreen();
  });
  document.getElementById('user-email-skip').addEventListener('click', () => {
    const anonId = 'anon-' + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2, 15));
    state.userEmail = anonId; persistState(); overlay.remove();
    renderCurrentScreen();
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 🚀 INIT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
/*
  BOOT: DOMContentLoaded handler
  LAYMAN: The app's startup. Sets up one shared listener for all form changes (so we don't
    attach thousands of individual ones), reads the DCS request id the server injected into
    the page, shows the link-verification screen, and resolves the user's email.
  TECHNICAL: Clears any stale loader; registers a single delegated 'change' listener that
    debounce-saves on PIA input changes and mirrors p2-custom-* edits into pia2CustomOthers;
    reads parentID from the server scriptlet (see note below); seeds state and boots the dcs
    screen; then loadUserEmail().
  NOTE: the `const parentId = ...` line near the bottom of the script is a GAS server-side
  template tag (a printing scriptlet), not plain JS — it is rendered server-side before the
  page is sent. Do not "fix" it, and never write the scriptlet delimiters inside a comment
  (the template engine parses them even in comments).
*/
document.addEventListener('DOMContentLoaded', () => {
  hideLoading(); // Clear any stuck loading overlay on init
  
  // ─── EVENT DELEGATION: Handle form changes efficiently ─────
  // Instead of individual listeners on 1000s of inputs, use single delegated listener
  document.addEventListener('change', (e) => {
    if (e.target.matches('input[id^="p2-"], input[id^="p3-int-"], input[id^="p3-ext-"], input[id^="p4-"], input[name^="q5-"], input[id^="p2-custom-"]')) {
      // Batch state updates and use debounced persist
      debouncedPersistState();
    }
    if (e.target.matches('input[id^="p2-custom-"]')) {
      // Custom fields: update state directly
      const match = e.target.id.match(/p2-custom-(name|value)-(\d+)/);
      if (match) {
        const [, field, idx] = match;
        if (!Array.isArray(state.pia2CustomOthers)) state.pia2CustomOthers = [];
        if (!state.pia2CustomOthers[idx]) state.pia2CustomOthers[idx] = { name: '', value: '' };
        state.pia2CustomOthers[idx][field] = e.target.value;
      }
    }
  });
  
  // Use the parentID passed from the server-side template to avoid client-side URL parsing issues.
  const parentId = <?!= parentID ? JSON.stringify(parentID) : 'null' ?>;

  // Store parentID in state and show the guide/linking screen.
  // This screen will handle the verification and allow the user to proceed.
  state.parentID = parentId;
  state.currentScreen = 'dcs';
  show('dcs');
  renderDCSCheck();
  
  loadUserEmail();
});
</script>
</body>
