};

/*
  Function Name: syncPIA1State
  LAYMAN: Reads every PIA1 input box back into state.pia1 (department, program, the head
    names/emails/phones, description, etc.). Called before navigating away or saving.
  TECHNICAL: Iterates PIA1_FIELD_CONFIG, reads each cached element, sanitizeText's the value
    to its configured max, and writes it into state.pia1[key].
  PARAMS: (none)  RETURNS: undefined (mutates state.pia1).
*/
function syncPIA1State() {
  // OPTIMIZATION: Use cached element getter for better performance
  Object.keys(PIA1_FIELD_CONFIG).forEach(k => {
    const config = PIA1_FIELD_CONFIG[k];
    const el = getCachedElement(config.id);
    if(el) state.pia1[k] = sanitizeText(el.value || '', config.max);
  });
}

/*
  Function Name: normalizeStakeholders
  LAYMAN: Makes sure a stakeholder list is always an array of {name, email} objects with at
    least one (blank) row, so the render code never trips on legacy string-only entries.
  TECHNICAL: Coerces strings to {name,email}, fills missing fields, and returns a single
    empty row for empty/non-array input.
  PARAMS: arr — array of strings or {name,email} objects (or anything).
  RETURNS: array of {name,email} (never empty).
*/
function normalizeStakeholders(arr) {
  if (!Array.isArray(arr) || arr.length === 0) return [{name: '', email: ''}];
  return arr.map(item => {
    if (typeof item === 'string') return { name: item, email: '' };
    return { name: item.name || '', email: item.email || '' };
  });
}

/*
  Function Name: syncPIA3State
  LAYMAN: Reads the internal/external stakeholder rows (each a name + email) and the two
    description boxes back into state.pia3.
  TECHNICAL: A local gather() walks p3-int-* / p3-ext-* inputs by index, sanitizes, and keeps
    rows that have a name or email (falling back to one empty row). Also syncs the int/ext
    description textareas. Mutates state.pia3.
  PARAMS: keepEmptyRows — when true, preserve blank rows (used by the add/remove handlers so
    their length guards see the real displayed rows). Omit for the nav-away save (collapses blanks).
  RETURNS: undefined.
*/
function syncPIA3State(keepEmptyRows) {
  const gather = (prefix, targetArray) => {
    const arr = [];
    const max = Math.max(targetArray.length, document.querySelectorAll(`input[id^="${prefix}-name-"]`).length);
    for (let i = 0; i < max; i++) {
      const nameEl = document.getElementById(`${prefix}-name-${i}`);
      const emailEl = document.getElementById(`${prefix}-email-${i}`);
      if (nameEl || emailEl) {
        const n = sanitizeText(nameEl?.value || '', 180);
        const e = sanitizeText(emailEl?.value || '', 180);
        // keepEmptyRows: keep every displayed row (incl. blanks) so the add/remove handlers'
        // length guards operate on the real rows; default drops blanks for the nav-away save.
        if (keepEmptyRows || n || e) arr.push({ name: n, email: e });
      }
    }
    if (keepEmptyRows) return arr;
    return arr.length ? arr : [{name: '', email: ''}];
  };
  state.pia3.intStakeholders = gather('p3-int', state.pia3.intStakeholders || []);
  state.pia3.extStakeholders = gather('p3-ext', state.pia3.extStakeholders || []);
  
  const intDescEl = getCachedElement('p3-int-desc');
  if (intDescEl) state.pia3.intDescription = sanitizeText(intDescEl.value, 4000);
  
  const extDescEl = getCachedElement('p3-ext-desc');
  if (extDescEl) state.pia3.extDescription = sanitizeText(extDescEl.value, 4000);
}
/*
  Function Name: syncPIA4State
  LAYMAN: Reads the five information-flow boxes (Collect/Use/Retain/Disclose/Dispose) back
    into state.pia4.
  TECHNICAL: Iterates the five keys, reads p4-<key>, sanitizeText(2500), writes state.pia4.
  PARAMS: (none)  RETURNS: undefined.
*/
function syncPIA4State() {
  // OPTIMIZATION: Batch element access
  ['collect','use','retain','disclose','dispose'].forEach(k => {
    const el = getCachedElement('p4-'+k);
    if(el) state.pia4[k] = sanitizeText(el.value||'', 2500);
  });
}
/*
  Function Name: syncPIA5State
  LAYMAN: Reads the checklist radio answers (YES/NO/N/A per question) back into state.pia5.
  TECHNICAL: For each question reads the :checked q5-<i> radio, sanitizeChoice's it, writes
    state.pia5[i].
  PARAMS: (none)  RETURNS: undefined.
*/
function syncPIA5State() {
  pia5Questions.forEach((q, i) => {
    const el = document.querySelector(`input[name="q5-${i}"]:checked`);
    if(el) state.pia5[i] = sanitizeChoice(el.value||'', ['YES','NO','N/A']);
  });
}

/*
  Function Name: getModeBadge
  LAYMAN: Returns the little amber "Revision Mode" badge HTML when the user is editing a
    returned application; empty string otherwise.
  TECHNICAL: Branches on state.isEditing.
  PARAMS: (none)  RETURNS: HTML string ('' when not editing).
*/
function getModeBadge() {
  if (state.isEditing) {
    return `<span class="step-badge badge-revision" style="margin-bottom:0; background:var(--warn); color:var(--warn-text); border-color:rgba(180,109,20,0.2);">Revision Mode</span>`;
  }
  return '';
}

// OPTIMIZATION: Pre-compute constant SVG icon for flags
const FLAG_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
const flagIconCache = new Map();

/*
  Function Name: getFlagMessage
  LAYMAN: Looks up the approver's note for a specific field (e.g. 'PIA 2 - Health'), if one
    was left during review. Empty string if none.
  TECHNICAL: Reads state.approverFlags[fieldKey].
  PARAMS: fieldKey — the canonical flag key for the field.
  RETURNS: the note string, or ''.
*/
function getFlagMessage(fieldKey) {
  if (!state.approverFlags) return '';
  return state.approverFlags[fieldKey] || '';
}

/*
  Function Name: getFlagClass
  LAYMAN: Returns 'has-flag' (a highlight CSS class) if the field was flagged, else ''.
  TECHNICAL: Boolean-maps getFlagMessage(fieldKey).
  PARAMS: fieldKey.  RETURNS: 'has-flag' | ''.
*/
function getFlagClass(fieldKey) {
  return getFlagMessage(fieldKey) ? 'has-flag' : '';
}

/*
  Function Name: getFlagIconHtml
  LAYMAN: Builds the little flag icon + hover-tooltip that shows the approver's note next to
    a flagged field. Returns nothing for unflagged fields.
  TECHNICAL: Memoized per fieldKey in flagIconCache. Escapes the note, embeds the constant
    FLAG_SVG, caches and returns the markup ('' cached for unflagged keys).
  PARAMS: fieldKey.  RETURNS: HTML string ('' when not flagged).
*/
function getFlagIconHtml(fieldKey) {
  // OPTIMIZATION: Cache flag icon HTML to avoid recalculating
  if (flagIconCache.has(fieldKey)) {
    return flagIconCache.get(fieldKey);
  }
  
  const flagMsg = getFlagMessage(fieldKey);
  if (!flagMsg) {
    flagIconCache.set(fieldKey, '');
    return '';
  }
  
  const escapedMsg = escapeHtmlMemo(flagMsg);
  const html = `
    <div class="flag-icon-tooltip" tabindex="0" aria-label="Approver note: ${escapedMsg}">
      ${FLAG_SVG}
      <div class="flag-tooltip-content">
        <strong>Approver Note:</strong> ${escapedMsg}
      </div>
    </div>
  `;
  flagIconCache.set(fieldKey, html);
  return html;
}

/*
  Function Name: createNewApplicationSession
  LAYMAN: Starts a fresh PIA from scratch — asks the server for a new session id, marks the
    app as an in-progress draft, and drops the user on Step 2 (the compliance checklist).
  TECHNICAL: Calls apiGenerateNewSessionId(). On success sets sessionId/baseSessionId,
    draftStatus='incomplete', isIncomplete=true, clears editing/resume flags, then
    show('pia5') + renderPIA5Survey() + persistState(). Surfaces errors via toast.
  PARAMS: (none)  RETURNS: undefined (async).
*/
function createNewApplicationSession() {
  google.script.run
    .withSuccessHandler(result => {
      hideLoading();
      if (result && result.sessionId) {
        state.appId = '';  // Keep empty until first submission
        state.sessionId = result.sessionId;
        state.baseSessionId = result.sessionId;  // Use for draft identification
        state.draftStatus = 'incomplete';
        state.isIncomplete = true;
        state.isEditing = false;
        state.isLoadingExistingDraft = false;
        show('pia5');
        renderPIA5Survey();
        persistState();
      } else {
        showError('Failed to create session: ' + (result?.error || 'Unknown error'));
      }
    })
    .withFailureHandler(err => {
      hideLoading();
      showError('Error starting application: ' + (err?.message || err));
    })
    .apiGenerateNewSessionId();
}

/*
  Function Name: goBack
  LAYMAN: The "← Back" navigation. It first saves whatever you typed on the current step,
    then moves you to the target screen. In Revision Mode it won't let you back into the
    intro/guide screen.
  TECHNICAL: Calls the matching syncPIAxState() for the current screen, persistState(), then
    show(screen)+renderCurrentScreen(). Early-returns to block guide while editing.
  PARAMS: screen — the screen name to go back to.
  RETURNS: undefined.
*/
function goBack(screen) {
  if (state.isEditing && screen === 'guide') return;
  if (state.currentScreen === 'pia1') syncPIA1State();
  else if (state.currentScreen === 'pia2') syncPIA2State();
  else if (state.currentScreen === 'pia3') syncPIA3State();
  else if (state.currentScreen === 'pia4') syncPIA4State();
  else if (state.currentScreen === 'pia5') syncPIA5State();
  persistState();
  show(screen);
  renderCurrentScreen();
}

/*
  Function Name: renderCurrentScreen
  LAYMAN: Re-draws whatever screen we're currently on by calling its render function. Used
    after restoring a draft or resolving the user's email.
  TECHNICAL: switch on state.currentScreen dispatching to the matching render*().
  PARAMS: (none)  RETURNS: undefined.
*/
function renderCurrentScreen() {
  switch (state.currentScreen) {
    case 'dcs': renderDCSCheck(); break;
    case 'guide': renderGuide(); break;
    case 'pia1': renderPIA1(); break;
    case 'pia2': renderPIA2(); break;
    case 'pia3': renderPIA3(); break;
    case 'pia4': renderPIA4(); break;
    case 'pia5': renderPIA5Survey(); break;
    case 'summary': renderSummary(); break;
    case 'processing': renderProcessingScreen(); break;
    case 'certificate': renderCertificate(); break;
    case 'confirmation': renderConfirmation(); break;
    default: break; // No default screen
  }
}

// ─── Sidebar tracker ──────────────────────────────────
/*
  Function Name: renderSidebarTracker
  LAYMAN: Builds the left-hand "Application Progress" sidebar listing the 7 steps, marking
    completed ones with a check and highlighting the active one.
  TECHNICAL: Returns an <aside> HTML string. Steps before activeStep get .done (check SVG),
    the active step gets .active; labels are escaped.
  PARAMS: activeStep — 1-based step number currently in view.
  RETURNS: HTML string for the sidebar.
*/
function renderSidebarTracker(activeStep) {
  const steps = [
    { num: 1, section: null, label: 'Instructions & Compliance Agreement' },
    { num: 2, section: null, label: 'Privacy Compliance Checklist' },
    { num: 3, section: 1, label: 'Program / Process Information' },
    { num: 4, section: 2, label: 'PII Inventory' },
    { num: 5, section: 3, label: 'Stakeholder Identification' },
    { num: 6, section: 4, label: 'Information Flow' },
    { num: 7, section: null, label: 'Application Summary' }
  ];

  let html = `<aside class="form-sidebar"><div class="form-sidebar-title">Application Progress</div><div class="sidebar-steps">`;
  steps.forEach(step => {
    let cls = '';
    let numHtml = step.num;
    if (step.num < activeStep) {
      cls = 'done';
      numHtml = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
    } else if (step.num === activeStep) {
      cls = 'active';
    }

    let stepTextHtml = '';
    if (step.section !== null) {
      stepTextHtml = `Section ${step.section} <span style="font-weight:${step.num === activeStep ? '700' : '400'};">${escapeHtml(step.label)}</span>`;
    } else {
      stepTextHtml = `<span style="font-size:15px; font-weight:${step.num === activeStep ? '700' : '500'}; margin-top:0; padding-top:2px;">${escapeHtml(step.label)}</span>`;
    }

    html += `
      <div class="sidebar-step ${cls}">
        <div class="sidebar-step-num">${numHtml}</div>
        <div class="sidebar-step-text">${stepTextHtml}</div>
      </div>
    `;
  });
  html += `</div></aside>`;
  return html;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 📖 GUIDE / DCS LINKING
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
/*
  Function Name: renderApprovalTimeline
  LAYMAN: Draws the vertical "Approval History" timeline on the requestor's first screen: every
    round of review (including past returned rounds), each approver's decision, date and comment,
    and who is currently pending. Dati puro isolated comments lang ang nakikita ng requestor;
    ngayon buong kwento na, isang list.
  TECHNICAL: Consumes apiGetApprovalHistory rounds. Built with plain STRING CONCATENATION (this
    file is template-served; backtick helpers corrupt at GAS serve time, CLAUDE.md section 8).
    Wires the previously-dormant .timeline CSS component (.timeline-item/.timeline-dot variants).
  PARAMS:
  - rounds — array of { round, isCurrent, decisions[] }.
  RETURNS: HTML string ('' when rounds is empty).
*/
function renderApprovalTimeline(rounds) {
  if (!rounds || !rounds.length) return '';
  var html = '<div class="card"><div class="card-title">Approval History</div>';
  for (var i = 0; i < rounds.length; i++) {
    var r = rounds[i];
    var headerLabel = 'Round ' + r.round + (r.isCurrent ? ' (Current)' : ' (returned and revised)');
    html += '<div style="font-size:11px;font-weight:700;color:' + (r.isCurrent ? 'var(--navy-text)' : 'var(--text3)') +
      ';text-transform:uppercase;letter-spacing:0.05em;margin:12px 0 10px;border-bottom:1px solid var(--border);padding-bottom:4px;">' +
      escapeHtml(headerLabel) + '</div>';
    html += '<div class="timeline">';
    var ds = r.decisions || [];
    for (var j = 0; j < ds.length; j++) {
      var d = ds[j];
      var st = String(d.status || d.decision || '').toLowerCase();
      var dotCls = 'timeline-dot';
      var label = '';
      if (st.indexOf('approved') !== -1) { dotCls += ' done'; label = 'Approved'; }
      else if (st.indexOf('pending') !== -1 || st === '') { dotCls += ' active'; label = 'Pending review'; }
      else if (st.indexOf('return') !== -1 || st.indexOf('reject') !== -1) { dotCls += ' returned'; label = 'Returned to Requestor'; }
      else if (st.indexOf('deny') !== -1 || st.indexOf('denied') !== -1) { dotCls += ' rejected'; label = 'Denied'; }
      else if (st.indexOf('escalat') !== -1) { dotCls += ' escalated'; label = 'Escalated to Division Head'; }
      else { label = String(d.status || d.decision || ''); }
      var name = escapeHtml(d.approverName || d.approverEmail || 'Approver');
      var role = escapeHtml(d.role || 'Approver');
      var dateStr = d.decisionDate ? escapeHtml(String(d.decisionDate)) : '';
      var routing = String(d.routing || '').trim().toUpperCase();
      var routingLabel = routing === 'DCOPS' ? 'DCOPS' : routing === 'TECHSERVE' ? 'TechServe' : routing === 'BOTH' ? 'DCOPS + TechServe' : '';
      var comment = (d.comments && String(d.comments).trim() !== '' &&
        String(d.comments).trim() !== 'Approved via secure access review link.' &&
        String(d.comments).trim() !== 'No additional comments provided.') ? escapeHtml(String(d.comments)) : '';
      html += '<div class="timeline-item">' +
        '<div class="' + dotCls + '" aria-hidden="true"></div>' +
        '<div class="timeline-title">' + name + ' <span style="font-weight:400;color:var(--text3);font-size:11px;">(' + role + ')</span></div>' +
        '<div class="timeline-sub"><span class="status-badge ' + getStatusBadgeClass(label) + '">' + escapeHtml(label) + '</span>' +
          (dateStr ? ' &middot; ' + dateStr : '') +
          (routingLabel ? ' &middot; Routing: ' + escapeHtml(routingLabel) : '') + '</div>' +
        (comment ? '<div class="timeline-comment">"' + comment + '"</div>' : '') +
        '</div>';
    }
    html += '</div>';
  }
  return html + '</div>';
}

/*
  Function Name: loadApprovalHistory
  LAYMAN: Quietly fetches the approval history for your submitted application and, when it
    arrives, shows the timeline card. Kung mag-fail ang fetch, walang sira: hindi lang lalabas
    ang timeline (nananatili ang existing feedback blocks).
  TECHNICAL: google.script.run apiGetApprovalHistory(sessionId) into #approval-history-container.
    Failure handler is a silent no-op by design (the comments blob remains the fallback).
  PARAMS:
  - sessionId — the requestor's own PIA session id.
  RETURNS: undefined (async).
*/
function loadApprovalHistory(sessionId) {
  try {
    if (!sessionId || typeof google === 'undefined') return;
    google.script.run
      .withSuccessHandler(function (res) {
        try {
          var el = document.getElementById('approval-history-container');
          if (el && res && res.success && res.rounds && res.rounds.length) {
            el.innerHTML = renderApprovalTimeline(res.rounds);
          }
        } catch (e) {}
      })
      .withFailureHandler(function () { /* silent: comments blob remains the fallback */ })
      .apiGetApprovalHistory(sessionId);
  } catch (e) {}
}

/*
  Function Name: renderDCSCheck
  LAYMAN: The first screen. It verifies the DCS link you arrived with and figures out what
    you're allowed to do: start a brand-new PIA, resume an unfinished draft, revise a
    returned one, or — if your DCS was returned and not yet fixed — block you and tell you to
    update the DCS first. It also stops you if a PIA was already submitted for this request.
  TECHNICAL: Renders a status card + spinner, then calls apiGetDCSContext(parentID). The
    success handler branches on the result and rewires the proceed button accordingly:
      1) already-submitted (not rejected/returned) -> show "already submitted", Close.
      2) existing draft -> "Resume Draft" (asyncRestoreDraft), unless it's a revision whose
         DCS is still Returned/RejectedDCS with DCS flags -> block ("Update DCS first").
      3) rejected/returned submission, no draft yet -> "Revise PIA Form" (same DCS gate).
      4) otherwise NEW -> pre-populate state.pia1 from the DCS context and "Continue".
    Stores fresh approverFlags and dcsData onto state; sets window.isDCSVerified/dcsAction/
    dcsSessionId/isRevisionDraft used by renderGuide's proceed handler.
  PARAMS: (none — reads state.parentID).  RETURNS: undefined (async).
*/
function renderDCSCheck() {
  const userEmail = state.userEmail || '(anonymous)';
  const parentId = state.parentID;
  const el = document.getElementById('screen-dcs');

  window.isDCSVerified = false;
  window.dcsAction = null;
  window.dcsSessionId = null;
  
  el.innerHTML = `
    <div class="page-header" style="margin-top: 1rem;">
      <span class="step-badge">Security Check</span>
      <h1>Link Verification</h1>
      <p>Verifying your request link.</p>
    </div>
    <div class="card-grid-container">
      <div class="card" style="background: var(--navy-tint); border-color: var(--navy-border);">
        <div class="card-title" style="color: var(--navy-text);">Your account</div>
        <div style="font-size:13px; color:var(--navy-text);">
          <strong>Email:</strong>
          <code style="background:rgba(255,255,255,0.6); padding:2px 8px; border-radius:4px; font-family:var(--font-mono); font-size:12.5px;">${escapeHtml(userEmail)}</code>
        </div>
        <div style="font-size:12px; color:var(--navy-text); margin-top:6px; opacity:0.75;">All submissions will be logged and attributed to this email address.</div>
      </div>
      
      <div class="card" id="dcs-link-status">
        <div class="card-title">Your Status</div>
        <div class="processing-screen" style="padding: 1rem 0; text-align: left; flex-direction: row; justify-content: flex-start; gap: 12px;">
          <div class="spinner" style="width: 22px; height: 22px; margin: 0;"></div>
          <div>
            <h2 style="font-size: 14px; margin: 0;">Verifying DCS Request ID...</h2>
            <p style="font-size: 13px; margin: 0; color: var(--text3);">${escapeHtml(parentId)}</p>
          </div>
        </div>
      </div>
    </div>

    <div id="dcs-alert-container"></div>

    <div id="approval-history-container"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="proceed-to-guide-btn" disabled aria-label="Proceed">Verifying Link...</button>
    </div>
  `;

  google.script.run
    .withSuccessHandler(result => {
      const statusEl = document.getElementById('dcs-link-status');
      const alertEl = document.getElementById('dcs-alert-container');
      const proceedBtn = document.getElementById('proceed-to-guide-btn');

      if (result && result.success) {
        state.dcsData = result.context;
        state.dcsData.reqId = parentId;
        // Store approver comments for use later
        state.dcsData._approverComments = result.approverComments || '';
        // Store agency metadata if present
        if (result.context && result.context.metadataAgency) {
          state.dcsData.metadataAgency = result.context.metadataAgency;
        }
        
        // Capture fresh approver flags from DCS context
        let freshFlags = {};
        if (typeof result.approverFlags === 'string') {
          try { freshFlags = JSON.parse(result.approverFlags); } catch(e) {}
        } else if (result.approverFlags) {
          freshFlags = result.approverFlags;
        }
        state.approverFlags = freshFlags;
        persistState();

        statusEl.innerHTML = `
          <div class="card-title">Your Status</div>
          <div class="pia-status-row" style="border-bottom: 1px dashed var(--border);">
            <div class="pia-status-label">DCS ID</div>
            <div class="pia-status-value">
              <span class="status-badge chip-identity">${escapeHtml(parentId)}</span>
            </div>
          </div>
          <div class="pia-status-row" style="border-bottom: none;">
            <div class="pia-status-label">Session ID</div>
            <div class="pia-status-value">
              <span class="status-badge ${result.existingSubmissionId || result.existingDraftSessionId ? 'chip-identity' : 'status-draft'}">${result.existingSubmissionId ? escapeHtml(result.existingSubmissionId) : (result.existingDraftSessionId ? escapeHtml(result.existingDraftSessionId) : 'Not Started')}</span>
            </div>
          </div>
        `;

        // Round-4: any existing submission gets the full grouped-by-round Approval History
        // timeline (fetched async; on failure the feedback blocks below remain the fallback).
        if (result.existingSubmissionId) loadApprovalHistory(result.existingSubmissionId);
        
        // 1. If it's already submitted and NOT rejected/returned -> Stop here
        if (result.existingSubmissionId && result.existingSubmissionStatus !== 'Rejected' && result.existingSubmissionStatus !== 'Returned') {
          alertEl.innerHTML = `
            <div class="alert alert-info">
              <strong>Application Already Submitted.</strong> A Privacy Impact Assessment (<strong>${escapeHtml(result.existingSubmissionId)}</strong>) for this request has already been completed.
            </div>
          `;
          proceedBtn.textContent = "Close Window";
          proceedBtn.disabled = false;
          proceedBtn.onclick = () => window.top.close();
          showSuccess('Application already submitted.');
          return;
        }

        const showApproverComment = result.approverComments
          ? `<div style="margin-top:12px; padding:10px 12px; background:var(--bg2); border-radius:var(--radius); border-left:3px solid var(--warn-text); font-size:13px; color:var(--text2);"><strong style="color:var(--warn-text);">Approver Feedback:</strong><br>${escapeHtml(result.approverComments)}</div>`
          : '';

        // 2. If there's an existing draft
        if (result.existingDraftSessionId) {
          const isRevision = result.existingSubmissionId && (result.existingSubmissionStatus === 'Rejected' || result.existingSubmissionStatus === 'Returned');
          
          // Check if DCS has been updated — if DCS status is still 'Returned', the user must update DCS first
          const dcsStatus = (result.context && result.context.status || '').toLowerCase();
          let hasDCSFlags = false;
          try {
            const flagsObj = result.approverFlags || {};
            const flagKeys = Object.keys(flagsObj);
            hasDCSFlags = flagKeys.length === 0 || flagKeys.some(key => key.startsWith('DCS - '));
          } catch(e) {}
          
          const isDcsUpdated = (dcsStatus !== 'returned' && dcsStatus !== 'rejecteddcs') || !hasDCSFlags;

          if (isRevision && !isDcsUpdated) {
            alertEl.innerHTML = `
              <div class="alert alert-warn">
                <strong>DCS Update Required.</strong> Your application (<strong>${escapeHtml(result.existingSubmissionId)}</strong>) was returned. You must first update your DCS request before you can resume your PIA revision draft.
              </div>
              ${showApproverComment}
              <div style="margin-top:12px; padding:10px 12px; background:var(--bg2); border-radius:var(--radius); font-size:13px; color:var(--text2);">
                <strong>Next Step:</strong> Please go to the DCS system, update your request, and then use the new DCS link to access this PIA.
              </div>
            `;
            window.isDCSVerified = false;
            proceedBtn.textContent = "Update DCS Request First";
            proceedBtn.disabled = true;
            showError('DCS update required before resuming draft.');
            return;
          }

          window.isRevisionDraft = isRevision;
          alertEl.innerHTML = `
            <div class="alert alert-${isRevision ? 'warn' : 'info'}" style="margin-bottom: 0;">
              <strong>${isRevision ? 'Revision Draft Found' : 'Draft Found'}.</strong> You have an unfinished ${isRevision ? 'revision ' : ''}draft for this request.
            </div>
            ${isRevision ? showApproverComment : ''}
          `;
          window.isDCSVerified = true;
          window.dcsAction = 'resume';
          window.dcsSessionId = result.existingDraftSessionId;
          proceedBtn.textContent = "Resume Draft →";
          proceedBtn.onclick = () => {
            showLoading('Resuming draft...');
            asyncRestoreDraft(window.dcsSessionId);
          };
          proceedBtn.disabled = false;
          showSuccess('Draft context found.');
          return;
        }

        // 3. If there is a rejected submission but NO draft yet
        if (result.existingSubmissionId && (result.existingSubmissionStatus === 'Rejected' || result.existingSubmissionStatus === 'Returned')) {
          window.isRevisionDraft = true;
          window.dcsSessionId = result.existingSubmissionId;
          
          // Check if DCS has been updated — if DCS status is still 'Returned', the user must update DCS first
          const dcsStatus = (result.context && result.context.status || '').toLowerCase();
          let hasDCSFlags = false;
          try {
            const flagsObj = result.approverFlags || {};
            const flagKeys = Object.keys(flagsObj);
            hasDCSFlags = flagKeys.length === 0 || flagKeys.some(key => key.startsWith('DCS - '));
          } catch(e) {}
          
          const isDcsUpdated = (dcsStatus !== 'returned' && dcsStatus !== 'rejecteddcs') || !hasDCSFlags;

          if (!isDcsUpdated) {
            // DCS has NOT been updated — block PIA revision and tell user to update DCS first
            alertEl.innerHTML = `
              <div class="alert alert-warn">
                <strong>DCS Update Required.</strong> Your application (<strong>${escapeHtml(result.existingSubmissionId)}</strong>) was returned. You must first update your DCS request before you can revise this PIA form.
              </div>
              ${showApproverComment}
              <div style="margin-top:12px; padding:10px 12px; background:var(--bg2); border-radius:var(--radius); font-size:13px; color:var(--text2);">
                <strong>Next Step:</strong> Please go to the DCS system, update your request, and then use the new DCS link to access this PIA for revision.
              </div>
            `;
            window.isDCSVerified = false;
            proceedBtn.textContent = "Update DCS Request First";
            proceedBtn.disabled = true;
            showError('DCS update required before PIA revision.');
            return;
          }

          alertEl.innerHTML = `
            <div class="alert alert-warn">
              <strong>Revision Ready.</strong> Your application (<strong>${escapeHtml(result.existingSubmissionId)}</strong>) was returned. Your DCS request has been updated. Please review the feedback below and revise this PIA form.
            </div>
            ${showApproverComment}
          `;
          window.isDCSVerified = true;
          window.dcsAction = 'edit';
          proceedBtn.textContent = "Revise PIA Form →";
          proceedBtn.disabled = false;
          proceedBtn.onclick = () => { show('guide'); renderGuide(); };
          showSuccess('Application ready for revision.');
          return;
        }

        // Pre-populate state with verified context for NEW applications
        state.pia1.dept = result.context.department || '';
        state.pia1.program = result.context.program || '';
        state.pia1.scope = result.context.scope || '';
        state.pia1.immediateHeadEmail = result.context.immediateHeadEmail || '';
        state.pia1.deptHeadEmail = result.context.deptHeadEmail || '';
        state.pia1.divHeadEmail = result.context.divHeadEmail || '';
        
        // Autofill HeadNames from DCS
        state.pia1.immediateHead = result.context.immHeadName || '';
        state.pia1.deptHead = result.context.deptHeadName || '';
        state.pia1.divHead = result.context.divHeadName || '';
        
        state.pia1.drafterEmail = state.userEmail || '';
        state.pia1.drafter = result.context.drafterName || '';

        alertEl.innerHTML = `
          <div class="alert alert-success">
            <strong>Link Successful.</strong> Ready to begin a new Privacy Impact Assessment for Request <strong>${escapeHtml(parentId)}</strong>.
          </div>
        `;
        
        window.isDCSVerified = true;
        window.dcsAction = 'new';
        proceedBtn.textContent = "Continue to Instructions →";
        proceedBtn.onclick = () => { show('guide'); renderGuide(); };
        proceedBtn.disabled = false;
        showSuccess('DCS context linked successfully.');

      } else {
        statusEl.innerHTML = `
          <div class="card-title">Your Status</div>
          <div class="alert alert-danger" style="margin: 1rem 0 0 0; display: block;">
            <strong>Link Failed.</strong> Could not verify context for DCS Request <strong>${escapeHtml(parentId)}</strong>.
            <br><small>${escapeHtml(result.error || 'Context not found or unauthorized.')}</small>
          </div>
        `;
        proceedBtn.textContent = "Verification Failed";
        showError('Error linking DCS: ' + (result.error || 'Context not found or unauthorized.'));
      }
    })
    .withFailureHandler(err => {
      const statusEl = document.getElementById('dcs-link-status');
      statusEl.innerHTML = `
        <div class="card-title">Your Status</div>
        <div class="alert alert-danger" style="margin: 1rem 0 0 0;">
          <strong>Server Error.</strong> An unexpected error occurred while trying to link your DCS request. Please try again later.
          <br><small>${escapeHtml(err.message)}</small>
        </div>
      `;
      const proceedBtn = document.getElementById('proceed-to-guide-btn');
      if (proceedBtn) proceedBtn.textContent = "Verification Failed";
      showError('Server Error: ' + err.message);
    })
    .apiGetDCSContext(parentId);
}

/*
  Function Name: renderGuide
  LAYMAN: Step 1 — the instructions + consent screen. The "Proceed" button stays disabled
    until the user ticks the agreement box. What happens on Proceed depends on the action set
    by renderDCSCheck: a new application mints a session; a revision loads the prior data.
  TECHNICAL: Renders the guide markup, then defines window.checkProceedReadiness (gates the
    button on the checkbox) and window.handleGuideProceed: for dcsAction==='new' it calls
    createNewApplicationSession(); for 'edit' it apiGetApplicationData(window.dcsSessionId),
    merges the returned piaN into state (spread-merge to keep DCS pre-fill), normalizes the
    pia2 fields/customOthers shape, sets Revision Mode, then jumps to pia5.
  PARAMS: (none)  RETURNS: undefined.
*/
function renderGuide() {
  const el = document.getElementById('screen-guide');

  el.innerHTML = `
    <div class="form-layout">
      ${renderSidebarTracker(1)}
      <div class="page-content">
        <div class="page-header">
          <span class="step-badge">Step 1 of 7</span>
          <h1>Instructions &amp; Compliance Agreement</h1>
          <p>Please read the following carefully before proceeding with your PIA submission.</p>
        </div>
        <div class="card">
          <div class="card-title">What is a Privacy Impact Assessment?</div>
          <p style="font-size:13px; color:var(--text2); line-height:1.75;">A Privacy Impact Assessment (PIA) is a systematic process for evaluating the potential effects that a program or process may have on the privacy of individuals. It identifies privacy risks and recommends measures to mitigate or eliminate those risks before they occur.</p>
        </div>
        <div class="card">
          <div class="card-title">Compliance requirements</div>
          <ul style="font-size:13px; color:var(--text2); line-height:2.1; padding-left:1.25rem; list-style:disc outside;">
            <li>All answers must be complete, accurate, and truthful.</li>
            <li>Submission is <strong>final</strong> — you cannot edit after confirming.</li>
            <li>Rejected applications may be revised and resubmitted.</li>
            <li>Denied applications are permanently locked for audit.</li>
            <li>Responses are stored and subject to internal review.</li>
            <li>Your identity will be logged via your Google account session.</li>
          </ul>
        </div>
        <div class="alert alert-info" role="note">
          ${window.dcsAction === 'edit' 
            ? 'You are entering Revision Mode. Please update the necessary fields according to the reviewer\'s feedback.'
            : 'Your Application ID will be assigned automatically when you submit the application.'}
        </div>
        <label class="consent-wrap" for="agree-check">
          <input type="checkbox" id="agree-check" onchange="checkProceedReadiness()" aria-describedby="consent-desc">
          <span id="consent-desc">I have read and understood the instructions. I agree to submit accurate information and accept that my submission will be subject to the organization's data privacy compliance review process.</span>
        </label>
        <div class="btn-row spread">
          <button class="btn" onclick="show('dcs'); renderDCSCheck()">← Back</button>
          <button class="btn btn-primary" id="proceed-to-survey-btn" disabled onclick="handleGuideProceed()" aria-label="Proceed to compliance survey">Proceed to Survey →</button>
        </div>
      </div>
    </div>
  `;

  window.checkProceedReadiness = () => {
    const checked = document.getElementById('agree-check')?.checked;
    const btn = document.getElementById('proceed-to-survey-btn');
    if (btn) btn.disabled = !checked;
  };

  window.handleGuideProceed = () => {
    if (window.dcsAction === 'new') {
      showLoading('Starting new application...');
      createNewApplicationSession();
    } else if (window.dcsAction === 'edit') {
      showLoading('Loading application for revision...');
      google.script.run
        .withSuccessHandler(res => {
          hideLoading();
          if (state.isSubmitting) return;
          if (res) {
            state.parentID = res.linkedReqId || state.parentID;
            state.appId = res.sessionId;
            state.sessionId = res.sessionId;
            state.baseSessionId = res.sessionId;
            state.isEditing = true;
            state.isIncomplete = true;
            state.draftStatus = 'editing';
            state.status = 'Draft';
            state.isFlagged = res.isFlagged || false;
            
            // IMPORTANT: Merge server data into existing state rather than replacing entirely.
            // This preserves DCS-pre-populated fields (program, scope, etc.) that the
            // server-side pia1 snapshot may not contain.
            if (res.pia1 && typeof res.pia1 === 'object') {
              state.pia1 = { ...state.pia1, ...res.pia1 };
            }
            if (res.pia3 && typeof res.pia3 === 'object') {
              state.pia3 = { ...state.pia3, ...res.pia3 };
            }
            if (res.pia4 && typeof res.pia4 === 'object') {
              state.pia4 = { ...state.pia4, ...res.pia4 };
            }
            if (res.pia5 && typeof res.pia5 === 'object') {
              state.pia5 = { ...state.pia5, ...res.pia5 };
            }
            
            let freshFlags = res.approverFlags || {};
            if (typeof freshFlags === 'string') {
              try { freshFlags = JSON.parse(freshFlags); } catch(e) { freshFlags = {}; }
            }
            state.approverFlags = freshFlags;
            
            if (res.pia2 && res.pia2.customOthers) {
              state.pia2CustomOthers = res.pia2.customOthers;
              state.pia2 = res.pia2.fields || res.pia2;
            } else if (res.pia2 && res.pia2.fields) {
              state.pia2CustomOthers = res.pia2.customOthers || [];
              state.pia2 = res.pia2.fields;
            } else {
              state.pia2CustomOthers = [];
              state.pia2 = res.pia2 || {};
            }
            persistState();
            show('pia5');
            renderPIA5Survey();
          } else {
            showError('Failed to load application data.');
          }
        })
        .withFailureHandler(err => {
          hideLoading();
          showError('Error loading application: ' + (err.message || err));
        })
        .apiGetApplicationData(window.dcsSessionId);
    }
  };
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 📋 PIA 1 – PROGRAM INFORMATION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
/*
  Function Name: renderPIA1
  LAYMAN: Step 3 — the Program/Process Information form (department, program name, the
    drafter and the head contacts, description, purpose, etc.). It also quietly auto-fills
    blanks from the DCS context (program, scope, accountable persons -> end users) so the
    user doesn't retype what Phase 1 already captured.
  TECHNICAL: First GUARDS that all pia5 answers exist (bounces back to pia5 if not).
    Derives end-user/accountable defaults and DCS fallbacks into state.pia1, escapes the
    values, then writes the form HTML into #screen-pia1.
  PARAMS: (none)  RETURNS: undefined.
*/
function renderPIA1() {
  // GUARD: Verify all PIA5 questions are answered before showing PIA1
  // This prevents draft restoration or navigation bypass from skipping PIA5 validation
  const allPia5Answered = pia5Questions.every((_, i) =>
    ['YES', 'NO', 'N/A'].includes(state.pia5[i])
  );
  if (!allPia5Answered) {
    showError('Please answer ALL questions in the Privacy Compliance Checklist before proceeding to Program Info.');
    show('pia5');
    renderPIA5Survey();
    return;
  }

  const accountablePersons = [];
  if (state.dcsData && state.dcsData.accountable) {
    for (let i = 1; i <= 5; i++) {
      const name = state.dcsData.accountable[`accountableName${i}`];
      if (name) {
        accountablePersons.push(name);
      }
    }
  }
  
  if (!state.pia1.endUser && accountablePersons.length > 0) {
    state.pia1.endUser = accountablePersons.join(', ');
  }

  // Safety fallback: if any pia1 fields are empty, try to fill from DCS context data
  if (state.dcsData && typeof state.dcsData === 'object') {
    if (!state.pia1.program && (state.dcsData.program || state.dcsData.programName)) {
      state.pia1.program = state.dcsData.program || state.dcsData.programName || '';
    }
    if (!state.pia1.scope && state.dcsData.scope) {
      state.pia1.scope = state.dcsData.scope || '';
    }
    if (!state.pia1.description && state.dcsData.description) {
      state.pia1.description = state.dcsData.description || '';
    }
    if (!state.pia1.purpose && state.dcsData.purpose) {
      state.pia1.purpose = state.dcsData.purpose || '';
    }
  }

  const s = Object.fromEntries(Object.entries(state.pia1).map(([k,v]) => [k, escapeHtml(sanitizeText(v, 4000))]));
  document.getElementById('screen-pia1').innerHTML = `
    <div class="form-layout">
      ${renderSidebarTracker(3)}
      <div class="page-content">
        <div class="page-header">
          <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px;">
            <span class="step-badge" style="margin-bottom:0;">PIA Section 1</span>
            ${getModeBadge()}
          </div>
          <h1>Program / Process Information</h1>
          <p>Provide basic identification and contact information for this assessment.</p>
        </div>
        <div class="card">
          <div class="card-title">Program details</div>
          <div class="field-row">
            <div class="field"><label for="p1-dept">Department <span aria-hidden="true" style="color:var(--danger-text)">*</span>${infoTip('The organizational unit responsible for this program or process.')}</label><input id="p1-dept" value="${s.dept}" placeholder="e.g. Human Resources" aria-required="true" autocomplete="organization" oninput="state.pia1.dept=sanitizeText(this.value,150); persistState();" readonly /></div>

/*
  Function Name: savePIA1
  LAYMAN: "Next" on Step 3 — reads the form, validates it, and if it passes, saves and moves
    to the PII inventory.
  TECHNICAL: syncPIA1State() -> validatePIA1() (returns on failure) -> persistState() ->
    show('pia2')+renderPIA2().
  PARAMS: (none)  RETURNS: undefined.
*/
function savePIA1() {
  syncPIA1State();
  if (!validatePIA1()) return;
  persistState();
  show('pia2'); renderPIA2();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 📋 PIA 2 – PII INVENTORY
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
/*
  Function Name: syncPIA2State
  LAYMAN: Reads the PII inventory radios (YES/NO per category) and the custom "Others" rows
    back into state.pia2 / state.pia2CustomOthers.
  TECHNICAL: Iterates pii2Fields reading the :checked piiN radio (sanitizeChoice YES/NO),
    then walks pia2CustomOthers reading each custom name input and custom-piiN radio.
  PARAMS: (none)  RETURNS: undefined.
*/
function syncPIA2State() {
  // OPTIMIZATION: Batch selector operations
  pii2Fields.forEach((f, i) => {
    const val = document.querySelector(`input[name="pii${i}"]:checked`)?.value;
    if (val) state.pia2[i] = sanitizeChoice(val, ['YES','NO']);
  });
  if (Array.isArray(state.pia2CustomOthers)) {
    state.pia2CustomOthers.forEach((e, idx) => {
      const nameInput = getCachedElement(`custom-other-${idx}`);
      if (nameInput) e.name = nameInput.value;
      const valEl = document.querySelector(`input[name="custom-pii${idx}"]:checked`);
      if (valEl) e.value = sanitizeChoice(valEl.value, ['YES','NO']);
    });
  }
}

/*
  Function Name: renderPIA2
  LAYMAN: Step 4 — the PII inventory table. One YES/NO row per personal-data category. If the
    user answers YES to "Others" (the last row), an extra section appears where they can name
    and rate their own custom PII categories.
  TECHNICAL: Builds the standard rows from pii2Fields (index 20 'Others' re-renders on change
    to toggle the custom section; others write state.pia2 inline). When Others===YES, renders
    pia2CustomOthers as editable add/remove rows. Writes everything into #screen-pia2 and
    wires flag highlights via getFlagClass/getFlagIconHtml.
  PARAMS: (none)  RETURNS: undefined.
*/
function renderPIA2() {
  const rows = pii2Fields.map((f, i) => {
    const yes = state.pia2[i] === 'YES', no = state.pia2[i] === 'NO';
    const isOthersRow = i === 20; // 'Others' is at index 20
    const changeHandler = i === 20 ? ' onchange="syncPIA2State(); renderPIA2(); persistState();"' : ` onchange="state.pia2[${i}]=this.value; persistState();"`;
    const requiredAttr = isOthersRow ? '' : 'required'; // Only make required if not the 'Others' row
    return `<tr>
      <td class="${getFlagClass('PIA 2 - ' + f)}" style="position:relative; padding-right:36px;">
        ${f}
        ${getFlagIconHtml('PIA 2 - ' + f)}
      </td>
      <td class="center"><input type="radio" name="pii${i}" value="YES" ${yes?'checked':''} ${changeHandler} aria-label="${f} Yes" ${requiredAttr} /></td>
      <td class="center"><input type="radio" name="pii${i}" value="NO"  ${no ?'checked':''} ${changeHandler} aria-label="${f} No" ${requiredAttr} /></td>
    </tr>`;
  }).join('');

  const othersChecked = state.pia2[20] === 'YES';
  let customSection = '';
  if (othersChecked) {
    const customRows = (Array.isArray(state.pia2CustomOthers) ? state.pia2CustomOthers : []).map((entry, idx) => {
      const fn = sanitizeText(entry.name || '', 100);
      return `<tr>
        <td class="${getFlagClass('PIA 2 - Custom Field ' + (idx+1))}" style="position:relative; padding-right:36px;">
          <input type="text" id="custom-other-${idx}" value="${fn}" placeholder="Custom field name" oninput="state.pia2CustomOthers[${idx}].name=this.value; persistState();" maxlength="100" aria-label="Custom PII field ${idx+1}" style="width:100%;padding:6px 10px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;background:var(--bg);color:var(--text);font-family:var(--font);outline:none;" required />
          ${getFlagIconHtml('PIA 2 - Custom Field ' + (idx+1))}
        </td>
        <td class="center"><input type="radio" name="custom-pii${idx}" value="YES" ${entry.value==='YES'?'checked':''} onchange="state.pia2CustomOthers[${idx}].value='YES'; persistState();" aria-label="Custom field ${idx+1} Yes" required /></td>
        <td class="center"><input type="radio" name="custom-pii${idx}" value="NO"  ${entry.value==='NO' ?'checked':''} onchange="state.pia2CustomOthers[${idx}].value='NO'; persistState();"  aria-label="Custom field ${idx+1} No" /></td>
        <td class="center"><button class="btn btn-remove btn-sm" type="button" onclick="removeCustomOthersField(${idx})" aria-label="Remove custom field ${idx+1}">Remove</button></td>
      </tr>`;
    }).join('');
    customSection = `
      <div style="margin-top:1.25rem;">
        <div class="card-title">Custom PII categories</div>
        <table class="check-table" style="margin-bottom:0.75rem">
          <thead><tr><th>Field name</th><th class="center" style="width:70px">YES</th><th class="center" style="width:70px">NO</th><th class="center" style="width:80px">Action</th></tr></thead>
          <tbody>${customRows}</tbody>
        </table>
        <button class="btn btn-sm" onclick="addCustomOthersField()">+ Add category</button>
      </div>`;
  }

  document.getElementById('screen-pia2').innerHTML = `
    <div class="form-layout">
      ${renderSidebarTracker(4)}
      <div class="page-content">
        <div class="page-header">
          <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px;">
            <span class="step-badge" style="margin-bottom:0;">PIA Section 2</span>
            ${getModeBadge()}
          </div>
          <h1>PII Inventory</h1>
          <p>Indicate which types of personally identifiable information your program collects.</p>
        </div>
        <div class="alert alert-info" role="note">Select <strong>YES</strong> for each type of personal data your program collects. Select <strong>NO</strong> if not collected.</div>
        <div class="card" style="padding:0.75rem 0.75rem; position:relative;">
          <table class="check-table">
            <thead><tr><th>Personal information type${infoTip('Personally Identifiable Information (PII) refers to any data that could potentially identify a specific individual. Select YES for each type your program collects or processes.')}</th><th class="center" style="width:70px">YES</th><th class="center" style="width:70px">NO</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          ${customSection}
        </div>
        <div class="btn-row spread">
          <button class="btn" onclick="goBack('pia1')">← Back</button>
          <button class="btn btn-primary" onclick="savePIA2()">Next: Stakeholders →</button>
        </div>
      </div>
    </div>
  `;
}

/*
  Function Name: savePIA2
  LAYMAN: "Next" on Step 4. Makes sure every standard category has a YES/NO, that any custom
    "Others" rows are named and answered, and that at least 3 categories are YES, then moves
    on to Stakeholders. Also sets the "low-data" flag when very few PII types are collected.
  TECHNICAL: syncPIA2State(); validates indices 0..19 are set; validates custom rows when
    Others===YES; counts YES (standard + custom) and sets state.isFlagged = yesCount<=2;
    requires yesCount>=3; clears customOthers when Others!==YES; persists; advances to pia3.
  PARAMS: (none)  RETURNS: undefined (returns early on validation failure).
*/
function savePIA2() {
  syncPIA2State();

  // Validate standard PII fields (excluding 'Others' at index 20)
  for (let i = 0; i < pii2Fields.length - 1; i++) { // Loop from 0 to 19
    if (!state.pia2[i]) {
      showError(`Please make a selection for "${pii2Fields[i]}".`);
      return;
    }
  }

  const othersChecked = state.pia2[20] === 'YES';
  if (othersChecked && (!Array.isArray(state.pia2CustomOthers) || state.pia2CustomOthers.length === 0)) {
    showError(`You selected "YES" for "Others", but no custom PII categories have been added.`);
    return;
  }
  if (othersChecked && Array.isArray(state.pia2CustomOthers)) {
    for (let i = 0; i < state.pia2CustomOthers.length; i++) {
      const custom = state.pia2CustomOthers[i];
      if (!custom.name) {
        showError(`Please provide a name for custom PII category #${i + 1}.`);
        return;
      }
      if (!custom.value) {
        showError(`Please select YES or NO for "${custom.name}".`);
        return;
      }
    }
  }

  let yesCount = 0;
  pii2Fields.forEach((f, i) => { if (state.pia2[i] === 'YES') yesCount++; });
  if (othersChecked && Array.isArray(state.pia2CustomOthers)) {
    state.pia2CustomOthers.forEach(e => { if (e.value === 'YES') yesCount++; });
  } else if (!othersChecked) {
    state.pia2CustomOthers = [];
  }
  state.isFlagged = yesCount <= 2;

  // New validation: Require at least 3 'YES' decisions in PIA 2
  if (yesCount < 3) {
    showError('At least 3 "YES" decisions are required in the PII Inventory (PIA 2).');
    return;
  }
  persistState();
  show('pia3'); renderPIA3();
}

/*
  Function Name: addCustomOthersField
  LAYMAN: Adds one blank custom-PII row under "Others" and re-renders.
  TECHNICAL: syncs PIA2, pushes {name:'',value:''} to pia2CustomOthers, renderPIA2().
  PARAMS: (none)  RETURNS: undefined.
*/
function addCustomOthersField() {
  syncPIA2State();
  if (!Array.isArray(state.pia2CustomOthers)) state.pia2CustomOthers = [];
  state.pia2CustomOthers.push({ name:'', value:'' });
  renderPIA2();
}
/*
  Function Name: removeCustomOthersField
  LAYMAN: Deletes the custom-PII row at the given position and re-renders.
  TECHNICAL: syncs PIA2, bounds-checks idx, splices pia2CustomOthers, renderPIA2().
  PARAMS: idx — row index to remove.  RETURNS: undefined.
*/
function removeCustomOthersField(idx) {
  syncPIA2State();
  if (Array.isArray(state.pia2CustomOthers) && idx >= 0 && idx < state.pia2CustomOthers.length) {
    state.pia2CustomOthers.splice(idx, 1);
    renderPIA2();
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 📋 PIA 3 – STAKEHOLDERS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
/*
  Function Name: renderPIA3
  LAYMAN: Step 5 — Stakeholder Identification. The user lists who's involved internally and
    externally (name + optional email), up to 5 each. Which sections show depends on the DCS
    access type: an Internal request shows only internal, External shows only external,
    otherwise both.
  TECHNICAL: clearDomCache(); normalizes both stakeholder arrays; reads
    state.dcsData.access to pick internalOnly/externalOnly; builds add/remove rows (capped at
    5) and writes #screen-pia3.
  PARAMS: (none)  RETURNS: undefined.
*/
function renderPIA3() {
  clearDomCache();
  state.pia3.intStakeholders = normalizeStakeholders(state.pia3.intStakeholders);
  state.pia3.extStakeholders = normalizeStakeholders(state.pia3.extStakeholders);

  const stakeholderInputs = (items, prefix, labelPrefix) => {
    return items.map((v, idx) => `
      <div class="stakeholder-row">
        <div class="field" style="margin-bottom:0;">
          <label for="${prefix}-name-${idx}">${labelPrefix} ${idx+1} Name</label>
          <input id="${prefix}-name-${idx}" value="${escapeHtml(v.name)}" placeholder="Name or role" maxlength="180" oninput="state.pia3.${prefix === 'p3-int' ? 'intStakeholders' : 'extStakeholders'}[${idx}].name=sanitizeText(this.value,180); persistState();" onblur="this.value=validatePersonName(this.value, true); state.pia3.${prefix === 'p3-int' ? 'intStakeholders' : 'extStakeholders'}[${idx}].name=this.value; persistState();" />
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="${prefix}-email-${idx}">Email (Optional)</label>
          <input type="email" id="${prefix}-email-${idx}" value="${escapeHtml(v.email)}" placeholder="email@domain.com" maxlength="180" oninput="this.value=this.value.trim().toLowerCase(); state.pia3.${prefix === 'p3-int' ? 'intStakeholders' : 'extStakeholders'}[${idx}].email=this.value; persistState();" />
        </div>
        ${items.length > 1 ? `<button class="btn btn-remove btn-sm" type="button" onclick="removeStakeholderField('${prefix}', ${idx})">Remove</button>` : `<button class="btn btn-remove btn-sm" type="button" style="visibility:hidden">Remove</button>`}
      </div>`).join('');
  };
  
  const intAddBtn = state.pia3.intStakeholders.length < 5 
    ? `<button class="btn btn-sm" type="button" onclick="addStakeholderField('p3-int')" style="margin-top:4px">+ Add Internal Stakeholder</button>` 
    : `<div style="font-size:12px; color:var(--text3); margin-top:4px;">Maximum of 5 internal stakeholders reached.</div>`;
    
  const extAddBtn = state.pia3.extStakeholders.length < 5 
    ? `<button class="btn btn-sm" type="button" onclick="addStakeholderField('p3-ext')" style="margin-top:4px">+ Add External Stakeholder</button>` 
    : `<div style="font-size:12px; color:var(--text3); margin-top:4px;">Maximum of 5 external stakeholders reached.</div>`;

  // Show only the stakeholder section relevant to the DCS request's access type (carried over
  // via state.dcsData.access): Internal request → Internal only; External request → External only.
  const accessType = String((state.dcsData && state.dcsData.access) || '').toLowerCase();
  const internalOnly = accessType === 'internal';
  const externalOnly = accessType === 'external';

  document.getElementById('screen-pia3').innerHTML = `
    <div class="form-layout">

/*
  Function Name: savePIA3
  LAYMAN: "Next" on Step 5. Requires at least one named stakeholder in whichever section
    applies to this request, validates any emails that were entered, then advances to
    Information Flow.
  TECHNICAL: syncPIA3State(); computes internalOnly/externalOnly from dcsData.access;
    requires >=1 named stakeholder accordingly; rejects malformed emails via validateEmail;
    persists; show('pia4')+renderPIA4().
  PARAMS: (none)  RETURNS: undefined (returns early on validation failure).
*/
function savePIA3() {
  syncPIA3State();
  // Require a stakeholder from whichever section is shown for this access type:
  // Internal request → ≥1 internal; External request → ≥1 external; otherwise → ≥1 of either.
  const accessType = String((state.dcsData && state.dcsData.access) || '').toLowerCase();
  const internalOnly = accessType === 'internal';
  const externalOnly = accessType === 'external';
  const hasInternal = state.pia3.intStakeholders.some(s => s.name && s.name.trim());
  const hasExternal = state.pia3.extStakeholders.some(s => s.name && s.name.trim());
  const invalid = internalOnly ? !hasInternal : externalOnly ? !hasExternal : (!hasInternal && !hasExternal);
  if (invalid) {
    showError(internalOnly ? 'Please add at least one internal stakeholder with a name before proceeding.'
            : externalOnly ? 'Please add at least one external stakeholder with a name before proceeding.'
            : 'Please add at least one internal or external stakeholder with a name before proceeding.');
    return;
  }
  // Validate email fields if provided
  const allStakeholders = [...(state.pia3.intStakeholders||[]), ...(state.pia3.extStakeholders||[])];
  const invalidEmails = allStakeholders.filter(s => s.email && s.email.trim() && !validateEmail(s.email));
  if (invalidEmails.length) {
    const names = invalidEmails.map(s => s.name || 'unnamed').join(', ');
    showError('Invalid email format for: ' + names + '. Please provide valid email addresses or leave the field empty.');
    return;
  }
  persistState();
  show('pia4'); renderPIA4();
}

/*
  Function Name: addStakeholderField
  LAYMAN: Adds one blank stakeholder row to the internal or external list (max 5).
  TECHNICAL: syncs PIA3, picks the int/ext array by prefix, pushes {name,email} if <5,
    re-renders and persists.
  PARAMS: prefix — 'p3-int' or 'p3-ext'.  RETURNS: undefined.
*/
function addStakeholderField(prefix) {
  syncPIA3State(true);
  const target = prefix === 'p3-int' ? state.pia3.intStakeholders : state.pia3.extStakeholders;
  if (target.length < 5) {
    target.push({name: '', email: ''});
    renderPIA3();
    persistState();
  }
}

/*
  Function Name: removeStakeholderField
  LAYMAN: Removes a stakeholder row (always keeps at least one).
  TECHNICAL: syncs PIA3, picks the int/ext array by prefix, splices idx if length>1,
    re-renders and persists.
  PARAMS: prefix — 'p3-int'|'p3-ext'; idx — row index.  RETURNS: undefined.
*/
function removeStakeholderField(prefix, idx) {
  syncPIA3State(true);
  const target = prefix === 'p3-int' ? state.pia3.intStakeholders : state.pia3.extStakeholders;
  if (target.length > 1) {
    target.splice(idx, 1);
    renderPIA3();
    persistState();
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 📋 PIA 4 – INFORMATION FLOW
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
/*
  Function Name: renderPIA4
  LAYMAN: Step 6 — Information Flow. Five required text boxes describing how personal data is
    Collected, Used, Retained, Disclosed, and Disposed. Each has a help tooltip.
  TECHNICAL: Maps a flowMeta array to input fields (each writes state.pia4[key] inline and
    toggles .is-invalid live), wires flag highlights, and writes #screen-pia4.
  PARAMS: (none)  RETURNS: undefined.
*/
function renderPIA4() {
  const flowMeta = [
    { key:'collect',  label:'Collect',  hint:'Describe how personal data is collected in this program…', flagKey: 'PIA 4 - COLLECT', tooltip:'Describe how and where personal data is collected from data subjects or other sources.' },
    { key:'use',      label:'Use',      hint:'How is personal data used once collected?', flagKey: 'PIA 4 - USE', tooltip:'Explain what purposes personal data is used for and any authorized processing activities.' },
    { key:'retain',   label:'Retain',   hint:'How long and where is personal data retained?', flagKey: 'PIA 4 - RETAIN', tooltip:'Specify retention periods, storage locations, and conditions for keeping personal data.' },
    { key:'disclose', label:'Disclose', hint:'To whom and how is personal data disclosed?', flagKey: 'PIA 4 - DISCLOSE', tooltip:'List recipients or categories of recipients who receive personal data and under what conditions.' },
    { key:'dispose',  label:'Dispose',  hint:'How is personal data securely disposed of?', flagKey: 'PIA 4 - DISPOSE', tooltip:'Describe secure disposal or destruction methods when data is no longer needed.' },
  ];
  const rows = flowMeta.map(m => `
    <div class="field">
      <label for="p4-${m.key}">${m.label}${infoTip(m.tooltip)}</label>
      <div class="input-wrapper">
        <input id="p4-${m.key}" class="${getFlagClass(m.flagKey)}" value="${escapeHtml(state.pia4[m.key]||'')}" placeholder="${m.hint}" required oninput="this.classList.toggle('is-invalid', !this.value.trim()); state.pia4.${m.key}=sanitizeText(this.value,2500); persistState();" />
        ${getFlagIconHtml(m.flagKey)}
      </div>
    </div>`).join('');
  document.getElementById('screen-pia4').innerHTML = `
    <div class="form-layout">
      ${renderSidebarTracker(6)}
      <div class="page-content">
        <div class="page-header">
          <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px;">
            <span class="step-badge" style="margin-bottom:0;">PIA Section 4</span>
            ${getModeBadge()}
          </div>
          <h1>Information Flow</h1>
          <p>Describe how personal information moves through each stage of your program.</p>
        </div>
        <div class="card">${rows}</div>
        <div class="btn-row spread">
          <button class="btn" onclick="goBack('pia3')">← Back</button>
          <button class="btn btn-primary" onclick="savePIA4()">Next: Review Summary →</button>
        </div>
      </div>
    </div>
  `;
}

/*
  Function Name: savePIA4
  LAYMAN: "Next" on Step 6. All five flow boxes must be filled; empties get highlighted and
    focused. On success it advances to the Summary.
  TECHNICAL: Reads each p4-<key> directly from the DOM (live values), writes state.pia4,
    marks .is-invalid on empties; on any empty shows an error, focuses the first invalid,
    returns. Otherwise persists and show('summary')+renderSummary().
  PARAMS: (none)  RETURNS: undefined (returns early on validation failure).
*/
function savePIA4() {
  // Validate all five information flow fields are filled (read from DOM directly to ensure live values)
  let hasError = false;
  const fieldLabels = { collect:'Collect', use:'Use', retain:'Retain', disclose:'Disclose', dispose:'Dispose' };
  ['collect','use','retain','disclose','dispose'].forEach(k => {
    const el = document.getElementById('p4-'+k);
    const val = el ? sanitizeText(el.value||'', 2500) : '';
    state.pia4[k] = val;
    if (!val) {
      hasError = true;
      if (el) el.classList.add('is-invalid');
    } else {
      if (el) el.classList.remove('is-invalid');
    }
  });
  if (hasError) {
    showError('All Information Flow fields (Collect, Use, Retain, Disclose, Dispose) must be filled in before proceeding to Summary.');
    // Scroll to the first empty field
    const firstEmpty = document.querySelector('#screen-pia4 .is-invalid');
    if (firstEmpty) firstEmpty.focus({ preventScroll: true });
    return;
  }
  persistState();
  show('summary'); renderSummary();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 📋 PIA 5 – COMPLIANCE SURVEY
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
/**
 * Checks whether all PIA5 questions have a selected answer in the DOM.
 * Enables/disables the Continue button accordingly.
 * @returns {boolean} True if all questions are answered.
 */
function validatePIA5Completeness() {
  const allAnswered = pia5Questions.every((_, i) =>
    document.querySelector(`input[name="q5-${i}"]:checked`) !== null
  );
  const btn = document.getElementById('pia5-continue-btn');
  if (btn) btn.disabled = !allAnswered;
  return allAnswered;
}

/*
  Function Name: renderPIA5Survey
  LAYMAN: Step 2 — the Privacy Compliance Checklist. Eight questions, each answered YES / NO
    / N/A. This is the first thing the user fills after the guide.
  TECHNICAL: Maps pia5Questions to radio rows (each writes state.pia5[i] and revalidates the
    Continue button on change), wires flag highlights, and writes #screen-pia5.
  PARAMS: (none)  RETURNS: undefined.
*/
function renderPIA5Survey() {
  const opts = ['YES','NO','N/A'];
  const rows = pia5Questions.map((q, i) => {
    const cells = opts.map(o => 
      `<td class="center"><input type="radio" name="q5-${i}" value="${o}" ${state.pia5[i]===o?'checked':''} onchange="state.pia5[${i}]=this.value; validatePIA5Completeness(); persistState();" aria-label="${q.slice(0,40)}… ${o}" /></td>`
    ).join('');
    return `<tr><td style="line-height:1.6;padding:10px 10px;position:relative;padding-right:36px;" class="${getFlagClass('PIA 5: Q' + (i+1))}">${i+1}. ${q}${getFlagIconHtml('PIA 5: Q' + (i+1))}</td>${cells}</tr>`;
  }).join('');
  document.getElementById('screen-pia5').innerHTML = `
    <div class="form-layout">
      ${renderSidebarTracker(2)}
      <div class="page-content">
        <div class="page-header">
          <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px;">
            <span class="step-badge" style="margin-bottom:0;">Step 2 of 7</span>
            ${getModeBadge()}
          </div>
          <h1>Privacy Compliance Checklist</h1>
          <p>Assess your program's compliance with privacy standards and obligations.</p>
        </div>
        <div class="card" style="padding:0.75rem; position:relative;">
          <table class="check-table">
            <thead><tr><th style="width:60%">Question${infoTip('Answer YES if your program fully complies with the requirement, NO if it does not, or N/A if the question does not apply to your program.')}</th><th class="center" style="width:80px; white-space:nowrap;">YES</th><th class="center" style="width:80px; white-space:nowrap;">NO</th><th class="center" style="width:80px; white-space:nowrap;">N/A</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="btn-row spread">

        </div>
      </div>
    </div>
  `;
  
  // Check initial state (e.g., when restoring a draft with some answers)
  validatePIA5Completeness();
}

/*
  Function Name: savePIA5Survey
  LAYMAN: "Continue" on Step 2. Every question must be answered before moving on to Program
    Info. Uses a belt-and-suspenders check so a stale re-render can't sneak past.
  TECHNICAL: Three layers — (1) read each q5-<i> radio into state.pia5 and flag any missing;
    (2) re-verify against state.pia5 directly; (3) sync the Continue button via
    validatePIA5Completeness. On pass: persist and show('pia1')+renderPIA1().
  PARAMS: (none)  RETURNS: undefined (returns early if incomplete).
*/
function savePIA5Survey() {
  // LAYER 1: Check DOM radio button state
  let allAnswered = true;
  pia5Questions.forEach((q, i) => {
    const selected = document.querySelector(`input[name="q5-${i}"]:checked`);
    state.pia5[i] = sanitizeChoice(selected?.value||'', ['YES','NO','N/A']);
    if (!selected) allAnswered = false;
  });
  
  // LAYER 2: Fallback — validate against state.pia5 object directly
  // This catches edge cases where DOM query might fail (stale re-render, etc.)
  if (allAnswered) {
    allAnswered = pia5Questions.every((_, i) =>
      ['YES', 'NO', 'N/A'].includes(state.pia5[i])
    );
  }
  
  // LAYER 3: Sync button state as a final visual guard
  validatePIA5Completeness();
  
  if (!allAnswered) {
    showError('Please answer ALL questions in the Privacy Compliance Checklist before proceeding.');
    return;
  }
  persistState();
  show('pia1'); renderPIA1();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 📋 SUMMARY
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
/*
  Function Name: renderSummary
  LAYMAN: Step 7 — the final review screen. It lays out everything the user entered (program
    info, the PII types marked YES, stakeholders, the checklist answers) plus a read-only
    card of the linked DCS request details, so they can sanity-check before submitting.
  TECHNICAL: Precomputes escaped/sanitized values for state.pia1, the YES PII tags (standard
    + custom), stakeholder tags, and the pia5 status badges. Parses state.dcsData if it's a
    string, then assembles a DCS-details card (requestor, status, dept, access, the head
    contacts with flag highlights, accountable persons, optional agency metadata). Writes
    #screen-summary with the Confirm & Submit button.
  PARAMS: (none)  RETURNS: undefined.
*/
function renderSummary() {
  // OPTIMIZATION: Precompute and cache sanitized values
  const s = Object.fromEntries(Object.entries(state.pia1).map(([k,v]) => [k, escapeHtmlMemo(sanitizeText(v, 2500))]));
  
  // OPTIMIZATION: Build PII array efficiently
  const piiYesArr = pii2Fields.filter((f,i) => state.pia2[i]==='YES').concat(
    (Array.isArray(state.pia2CustomOthers) ? state.pia2CustomOthers.filter(e=>e.value==='YES').map(e=>sanitizeText(e.name||'',100)) : [])
  );
  const piiYes = piiYesArr.length > 0 ? piiYesArr.map(p => `<span class="pii-tag">${escapeHtmlMemo(p)}</span>`).join('') : '<span style="color:var(--text3)">(none selected)</span>';
  
  // OPTIMIZATION: Precompute stakeholder HTML
  const stakeholderLine = items => {
    if (!Array.isArray(items)) return sanitizeText(items||'',4000);
    const valid = items.filter(v => typeof v === 'string' ? v : (v.name || v.email));
    if (!valid.length) return '<span style="color:var(--text3)">—</span>';
    return valid.map(v => {
      if (typeof v === 'string') return `<span class="stakeholder-tag">${escapeHtmlMemo(v)}</span>`;
      const label = [v.name, v.email].filter(Boolean).join(' - ');
      return `<span class="stakeholder-tag">${escapeHtmlMemo(label)}</span>`;
    }).join('');
  };
  
  // OPTIMIZATION: Precompute PIA5 rows with cached values
  const pia5rows = pia5Questions.map((q,i) => {
    const v = state.pia5[i]||'—';
    const cls = v==='YES'?'status-approved':v==='NO'?'status-denied':'status-pending';
    return `<div class="summary-row" style="grid-template-columns: 4fr 1fr !important;"><div class="summary-label" style="font-size:12px">${i+1}. ${escapeHtmlMemo(q)}</div><div class="summary-value" style="flex:0; margin-left:auto; text-align: right;"><span class="status-badge ${cls}">${v}</span></div></div>`;
  }).join('');

  let dcsCardHtml = '';
  if (typeof state.dcsData === 'string') {
    try { state.dcsData = JSON.parse(state.dcsData); } catch(e) {}
  }
  const dcsReqId = state.dcsData?.reqId || state.parentID;
  
  if (state.dcsData && dcsReqId) {
    // OPTIMIZATION: Precompute expensive values
    const dateStr = state.dcsData.timestamp ? new Date(state.dcsData.timestamp).toLocaleString('en-PH', {dateStyle:'medium', timeStyle:'short'}) : '—';
    const escapedReqId = escapeHtmlMemo(dcsReqId);
    const escapedRequestor = escapeHtmlMemo(state.dcsData.requestor || '—');
    const escapedStatus = escapeHtmlMemo(state.dcsData.status || '—');
    const escapedDept = escapeHtmlMemo(state.dcsData.department || '—');
    const escapedLoc = escapeHtmlMemo(state.dcsData.locations || '—');
    const escapedAccess = escapeHtmlMemo(state.dcsData.access || '—');
    const escapedIhelp = escapeHtmlMemo(state.dcsData.ihelp || '—');
    
    // OPTIMIZATION: Single pass to collect accountable persons
    let accountableHtml = '';
    if (state.dcsData.accountable) {
      const accountablePersons = [];
      for (let i = 1; i <= 5; i++) {
        const name = state.dcsData.accountable[`accountableName${i}`];
        const email = state.dcsData.accountable[`accountableEmail${i}`];
        if (name || email) {
          accountablePersons.push(`${escapeHtmlMemo(name || '—')} (${escapeHtmlMemo(email || '—')})`);
        }
      }
      if (accountablePersons.length > 0) {
        accountableHtml = `<div class="summary-row"><div class="summary-label">Accountable Persons</div><div class="summary-value">${accountablePersons.join(', ')}</div></div>`;
      }
    }

    dcsCardHtml = `
      <div class="card">
        <div class="card-title">DCS Request Details</div>
        <div class="summary-row"><div class="summary-label">Request ID</div><div class="summary-value"><strong>${escapedReqId}</strong></div></div>
        <div class="summary-row"><div class="summary-label">Requestor</div><div class="summary-value">${escapedRequestor}</div></div>
        <div class="summary-row"><div class="summary-label">DCS Status</div><div class="summary-value"><span class="status-badge status-${String(state.dcsData.status).toLowerCase() === 'complete' ? 'complete' : 'pending'}">${escapedStatus}</span></div></div>
        <div class="summary-row"><div class="summary-label">Date Submitted</div><div class="summary-value">${escapeHtmlMemo(dateStr)}</div></div>
        <div class="summary-row"><div class="summary-label">Department</div><div class="summary-value">${escapedDept}</div></div>
        <div class="summary-row"><div class="summary-label">Locations</div><div class="summary-value">${escapedLoc}</div></div>
        <div class="summary-row"><div class="summary-label">Access Needed</div><div class="summary-value">${escapedAccess}</div></div>
        <div class="summary-row"><div class="summary-label">iHelp Reference</div><div class="summary-value">${escapedIhelp}</div></div>
        <div class="summary-row ${getFlagClass('DCS - Immediate Head')}">
          <div class="summary-label" style="position:relative; padding-right:36px;">
            Immediate Head
            ${getFlagIconHtml('DCS - Immediate Head')}
          </div>
          <div class="summary-value">${escapeHtmlMemo(state.dcsData.immHeadName || '—')} (${escapeHtmlMemo(state.dcsData.immediateHeadEmail || '—')})</div>
        </div>
        <div class="summary-row ${getFlagClass('DCS - Department Head')}">
          <div class="summary-label" style="position:relative; padding-right:36px;">
            Department Head
            ${getFlagIconHtml('DCS - Department Head')}
          </div>
          <div class="summary-value">${escapeHtmlMemo(state.dcsData.deptHeadName || '—')} (${escapeHtmlMemo(state.dcsData.deptHeadEmail || '—')})</div>
        </div>
        <div class="summary-row ${getFlagClass('DCS - Division Head')}">
          <div class="summary-label" style="position:relative; padding-right:36px;">
            Division Head
            ${getFlagIconHtml('DCS - Division Head')}
          </div>
          <div class="summary-value">${escapeHtmlMemo(state.dcsData.divHeadName || '—')} (${escapeHtmlMemo(state.dcsData.divHeadEmail || '—')})</div>
        </div>
        ${accountableHtml}

function renderProcessingScreen() {

  `;

/*
  Function Name: submitApplication
  LAYMAN: The "Confirm & Submit" action. Locks the button so you can't double-submit, shows
    the processing spinner, and kicks off the real send. If it hangs for 90 seconds it bails
    you back to the summary with an error so you're never stuck.
  TECHNICAL: Guards on state.isSubmitting; disables the button; show('processing'); persists;
    arms a 90s recovery timeout (stored on window._submitTimeoutId, cleared on success);
    calls submitToBackend() after an 800ms delay (lets the spinner paint).
  PARAMS: (none)  RETURNS: undefined.
*/
function submitApplication() {
  if (state.isSubmitting) return;
  state.isSubmitting = true;
  const btn = document.getElementById('btn-submit-application');
  if (btn) btn.disabled = true;
  show('processing'); renderProcessingScreen();
  persistState();
  
  // Safety timeout: if submission doesn't complete in 90s, force recovery
  const timeoutId = setTimeout(() => {
    if (state.isSubmitting) {
      hideLoading();
      state.isSubmitting = false;
      state.currentScreen = 'summary';
      persistState();
      show('summary'); renderSummary();
      if (btn) btn.disabled = false;
      showError('Submission timed out. Please try again.');
    }
  }, 90000);
  
  // Store timeout ID so we can clear it on success
  window._submitTimeoutId = timeoutId;
  
  setTimeout(() => { submitToBackend(); }, 800);
}

/*
  Function Name: _showToast
  LAYMAN: Shows a small slide-in notification (error or success) that auto-dismisses.
  TECHNICAL: Builds a .toast-<type> element with an inline SVG icon and the escaped message,
    appends it, then animates it out (errors linger ~4.5s, successes ~3s).
  PARAMS: msg — text; type — 'error' | 'success'.  RETURNS: undefined.
*/
function _showToast(msg, type) {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.setAttribute('aria-live', type === 'error' ? 'assertive' : 'polite');
  const icon = type === 'error' ? 
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>' : 
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
  el.innerHTML = `<span class="toast-icon" aria-hidden="true" style="display:flex;">${icon}</span><span>${escapeHtml(msg)}</span>`;
  document.body.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastOut 0.25s cubic-bezier(0.4,0,1,1) both';
    setTimeout(() => el.remove(), 260);
  }, type === 'error' ? 4500 : 3000);
}
/* showError — convenience wrapper: shows an error toast. */
function showError(msg)   { _showToast(msg, 'error'); }
/* showSuccess — convenience wrapper: shows a success toast. */
function showSuccess(msg) { _showToast(msg, 'success'); }
