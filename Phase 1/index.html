  PARAMS:
  - btnEl: the clicked button (for the loading/label state); falls back to the guide primary.

  RETURNS:
  Nothing (async navigation).
*/
function proceedToForm(btnEl) {
  const btn = btnEl || document.querySelector('#screen-guide .btn-primary');
  const originalHtml = btn?.innerHTML || '';

  if (btn) {
    btn.disabled = true;
    btn.innerHTML = 'Checking drafts...';
  }

  if (typeof google !== 'undefined') {
    google.script.run
      .withSuccessHandler(function(result) {
        if (btn) { btn.disabled = false; btn.innerHTML = originalHtml; }
        if (result && result.drafts && result.drafts.length > 0) {
          state.lastDrafts = result.drafts;
          show('drafts');
          renderDrafts(result.drafts, 'guide');
        } else {
          initiateNewSession(btn);
        }
      })
      .withFailureHandler(function() {
        if (btn) { btn.disabled = false; btn.innerHTML = originalHtml; }
        initiateNewSession(btn);
      })
      .apiListUserDrafts();
  } else {
    initiateNewSession(btn);
  }
}

  Function Name: initiateNewSession

  LAYMAN:
  Gets a fresh request id from the server and opens the empty form. If a form session is already
  active it just reopens that form.

  TECHNICAL:
  Short-circuits to the form if state.sessionId && currentScreen==='form'. Otherwise disables the
  button ("Preparing..."), calls apiGenerateNewSessionId(); on success stores the id,
  persistState(), and opens the form. Without google (local dev) it fabricates a 'LOCAL-<ts>' id.

  PARAMS:
  - btnEl: the originating button for loading state (falls back to guide/drafts primary).

  RETURNS:
  Nothing (async navigation).
*/
function initiateNewSession(btnEl) {
  if (state.sessionId && state.currentScreen === 'form') {
    show('form');
    renderForm();
    return;
  }

  const btn = btnEl || document.querySelector('#screen-guide .btn-primary') || document.querySelector('#screen-drafts .btn-primary');
  const originalHtml = btn?.innerHTML || '';
  const successHandler = function(result) {
        const sid = (result && typeof result === 'object') ? result.sessionId : result;
        if (sid) {
          state.sessionId = sid;
          persistState();
          show('form');
          renderForm();
        } else {
          if (btn) { btn.disabled = false; btn.innerHTML = originalHtml; }
          showCustomAlert('Error: Could not generate session ID. Please try again.', 'danger');
        }
      };
  const failureHandler = function(err) {
        if (btn) { btn.disabled = false; btn.innerHTML = originalHtml; }
        showCustomAlert('Server Error: ' + err.message, 'danger');
      };

  if (btn) {
    btn.disabled = true;
    btn.innerHTML = 'Preparing...';
  }

  if (typeof google !== 'undefined') {
    google.script.run
      .withSuccessHandler(successHandler)
      .withFailureHandler(failureHandler)
      .apiGenerateNewSessionId();
  } else {
    state.sessionId = 'LOCAL-' + Date.now();
    persistState();
    show('form');
    renderForm();
  }
}

// Fix 4: Frontend Retry Logic: Exponential backoff for draft restore
let draftRestoreRetries = 0;
const MAX_DRAFT_RETRIES = 2;

/*
  Function Name: attemptDraftRestore

  LAYMAN:
  Fetches a saved draft from the server, retrying a couple of times (with growing delays) if the
  call fails, so a flaky connection doesn't lose the draft.

  TECHNICAL:
  Shows a loading overlay, calls apiRestoreDraft(sid). On success resets the retry counter and
  invokes callback(res). On failure retries up to MAX_DRAFT_RETRIES with 500ms*2^(n-1) backoff;
  when exhausted, invokes callback({found:false, error}) or shows an alert.

  PARAMS:
  - sid: the draft/session id to restore.
  - callback: receives the restore response (or a {found:false} fallback).

  RETURNS:
  Nothing (delivers result via callback).
*/
function attemptDraftRestore(sid, callback) {
  showLoading('Loading application...');
  
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      draftRestoreRetries = 0; // Reset counter on success
      if (typeof callback === 'function') {
        callback(res);
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      
      if (draftRestoreRetries < MAX_DRAFT_RETRIES) {
        draftRestoreRetries++;
        const delayMs = 500 * Math.pow(2, draftRestoreRetries - 1);
        console.warn(`Draft restore failed, retrying in ${delayMs}ms...`, err);
        setTimeout(function() {
          showLoading('Retrying...');
          attemptDraftRestore(sid, callback);
        }, delayMs);
      } else {
        console.warn('Draft restore failed after retries, falling back');
        if (typeof callback === 'function') {
          callback({ found: false, error: 'Max retries exceeded' });
        } else {
          showCustomAlert('Failed to restore draft after retries.', 'danger');
        }
      }
    })
    .apiRestoreDraft(sid);
}

/*
  Function Name: resumeDraft

  LAYMAN:
  Loads a chosen draft back into the form. Because uploaded files are never saved in drafts, if
  the draft had any, their filenames are cleared and a "please re-upload" flag is set.

  TECHNICAL:
  Calls attemptDraftRestore(sid). On a found draft: adopts res.state.dcs + isEditing, computes
  hasFiles from the stored filenames or the saved _hadFiles flag, sets state.dcs._hadFiles, clears
  the nda/dsa/endorsement filenames when files existed, persistState(), then opens the form.

  PARAMS:
  - sid: the draft/session id to resume.

  RETURNS:
  Nothing (async navigation; alerts on not-found/error).
*/
function resumeDraft(sid) {
  try {
    if (typeof google !== 'undefined') {
      attemptDraftRestore(sid, function(res) {
        if (res.found && res.state) {
          state.sessionId = sid;
          state.dcs = res.state.dcs;
          state.isEditing = res.state.isEditing || false;
          // Check if restored draft had files that need re-upload
          // Also check the saved _hadFiles flag (otherwise empty filenames from Fix 1 would be missed)
          const d = state.dcs;
          // Round-4 fix: supplementary docs get the same honest treatment as the required files.
          // Files are never stored in drafts, so a resumed draft's supplementaryNames are stale;
          // showing them as "selected" made users submit without re-attaching (files silently lost).
          const suppCount = Array.isArray(d.supplementaryNames) ? d.supplementaryNames.length : 0;
          const hasFiles = !!(d.nda || d.dsa || (d.agency && d.agency.endorsementLetter) || suppCount > 0 || d._hadFiles);
          state.dcs._hadFiles = hasFiles;
          // Clear stored filenames so they don't appear as already uploaded
          if (hasFiles) {
            state.dcs.nda = '';
            state.dcs.dsa = '';
            if (state.dcs.agency) state.dcs.agency.endorsementLetter = '';
            // Carry the count across repeated resumes (names are already cleared on the 2nd resume,
            // but the saved _suppReuploadCount still marks the pending re-attach).
            state.dcs._suppReuploadCount = suppCount || d._suppReuploadCount || 0;
            state.dcs.supplementaryNames = [];
          }
          persistState();
          show('form');
          renderForm();
        } else { showCustomAlert('Draft not found on server.', 'danger'); }
      });
    }
  } catch(e) { showCustomAlert('Failed to resume draft', 'danger'); }
}

/*
  Function Name: deleteDraftAndRefresh
  LAYMAN: Asks to confirm, deletes the chosen draft on the server, then refreshes the flow.
  TECHNICAL: showCustomConfirm; on confirm calls apiDeleteDraft(sid) and, on success, proceedToForm()
             (which re-checks remaining drafts).
  PARAMS:
  - sid: the draft/session id to delete.
  RETURNS: Nothing.
*/
function deleteDraftAndRefresh(sid) {
  showCustomConfirm('Are you sure you want to delete this draft?', () => {
    if (typeof google !== 'undefined') {
      showLoading('Disregarding draft…');
      google.script.run
        .withSuccessHandler(() => { hideLoading(); proceedToForm(); })
        .withFailureHandler((err) => { hideLoading(); showCustomAlert('Could not disregard the draft: ' + ((err && err.message) ? err.message : err), 'danger'); })
        .apiDeleteDraft(sid);
    }
  }, 'warn');
}

/*
  Function Name: openTCModal

  LAYMAN:
  Opens the Terms & Conditions in a modal iframe and enforces a 5-second read gate, the "I Have
  Read and Agree" button stays disabled while a visible countdown ticks down.

  TECHNICAL:
  Sets #tc-iframe.src = url, reveals #tc-modal-overlay, disables #tc-accept-btn, then runs a 1s
  setInterval countdown from 5; at 0 it clears the interval, updates the message, and enables the
  accept button.

  PARAMS:
  - url: the T&C page URL to load in the iframe.

  RETURNS:
  Nothing (DOM/timer side-effect).
*/
function openTCModal(url) {
  const overlay = document.getElementById('tc-modal-overlay');
  const iframe = document.getElementById('tc-iframe');
  const acceptBtn = document.getElementById('tc-accept-btn');
  const countdownEl = document.getElementById('tc-countdown');
  
  iframe.src = url;
  acceptBtn.disabled = true;
  overlay.classList.remove('hidden');

  // Visual countdown timer
  let seconds = 5;
  countdownEl.textContent = `Please wait ${seconds}s…`;

  const interval = setInterval(function() {
    seconds--;
    if (seconds > 0) {
      countdownEl.textContent = `Please wait ${seconds}s…`;
    } else {
      clearInterval(interval);
      countdownEl.textContent = 'You may now agree to the Terms & Conditions.';
      acceptBtn.disabled = false;
    }
  }, 1000);
}

/*
  Function Name: acceptTC
  LAYMAN: Confirms the Terms & Conditions, ticks (and locks) the agree checkbox, enables the
          Proceed button, and closes the modal.
  TECHNICAL: Sets #terms-agree-checkbox checked+disabled, calls checkGuideRequirements(), hides
             the overlay, and clears the iframe src.
  PARAMS: (none)
  RETURNS: Nothing.
*/
function acceptTC() {
  const checkbox = document.getElementById('terms-agree-checkbox');
  if (checkbox) {
    checkbox.checked = true;
    // Keep disabled so user cannot uncheck, permanent until leaving the guide
    checkbox.disabled = true;
    checkGuideRequirements();
  }
  document.getElementById('tc-modal-overlay').classList.add('hidden');
  document.getElementById('tc-iframe').src = '';
}

    const wasCU = state.dcs.isAgency || state.dcs.isOJT;
    state.dcs.isAgency = (val === 'agency');
    state.dcs.isOJT = (val === 'ojt');
    const nowCU = state.dcs.isAgency || state.dcs.isOJT;
    if (val !== 'agency') {
      // OJT keeps the endorsement letter; None clears everything. Agency detail fields are dropped.
      const keepEndo = (val === 'ojt' && state.dcs.agency) ? (state.dcs.agency.endorsementLetter || '') : '';

    }
    // OJT requires External access \u2014 force + lock the Access Type; re-enable it otherwise.
    const accessEl = document.getElementById('dcs-access');
    const dsaWrap = document.getElementById('dsa-wrapper');
    if (val === 'ojt') {
      state.dcs.access = 'External';

      if (dsaWrap) dsaWrap.style.display = 'block';

      accessEl.disabled = false;
    }
    if (nextBtn) nextBtn.textContent = (val === 'agency') ? 'Agency Details \u2192' : 'Review Summary \u2192';
    // The required main document changed category (CU <-> NDA/DPA) \u2014 clear any stale upload.
    if (wasCU !== nowCU) clearUpload('dcs-main', 'main-upload-success', 'nda');
    updateMainUploadLabel();
    persistState();
  }

  if (involvementSel) {
    let prevInvolvement = involvementSel.value;
    involvementSel.addEventListener('change', function() {
      const newVal = this.value;
      // Confirm before discarding entered Agency details when switching away from Agency.
      const hasAgencyData = state.dcs.agency && (state.dcs.agency.agencyName || state.dcs.agency.agencyPersonnel || state.dcs.agency.networkDrive);
      if (prevInvolvement === 'agency' && newVal !== 'agency' && hasAgencyData) {
        showCustomConfirm(
          'Changing this will clear all Agency details and uploaded files you\'ve entered. Proceed?',
          function() {
            if (typeof google !== 'undefined' && state.sessionId) {
              google.script.run.apiDeleteDraft(state.sessionId);
            }
            prevInvolvement = newVal;
            applyInvolvement(newVal);
          },
          'warn'
        );
        this.value = prevInvolvement; // revert until confirmed
        return;
      }
      prevInvolvement = newVal;
      applyInvolvement(newVal);
    });
  }

  /*
    Helper: updateMainUploadLabel, keeps the main upload label correct for the current selection
    (CU for Agency/OJT, DPA for Internal, else NDA) and shows/hides the endorsement upload wrapper.
  */
  // Update upload label text + endorsement wrapper visibility dynamically
  function updateMainUploadLabel() {
    const labelEl = document.getElementById('dcs-main-upload-label');
    const involve = document.getElementById('dcs-involvement')?.value || '';
    const isCU = (involve === 'agency' || involve === 'ojt');
    const accVal = document.getElementById('dcs-access')?.value || '';
    if (labelEl) {
      if (isCU) labelEl.textContent = 'Upload Confidentiality Undertaking';
      else if (accVal === 'Internal') labelEl.textContent = 'Upload Data Protection Agreement (DPA)';
      else labelEl.textContent = 'Upload NDA';
    }
    // Toggle endorsement wrapper visibility (shown for Agency and OJT)
    const endorseWrapper = document.getElementById('agency-endorsement-wrapper');
    if (endorseWrapper) {
      endorseWrapper.style.display = isCU ? 'block' : 'none';
    }
    // Endorsement label scope: "School" for OJT, "Agency" otherwise (re-render on change)
    const endorseWord = document.getElementById('endorse-scope-word');
    if (endorseWord) endorseWord.textContent = (involve === 'ojt') ? 'School' : 'Agency';
  }

  // DSA visibility toggle + label update on access dropdown change
  const accessSel = document.getElementById('dcs-access');
  const dsaWrapper = document.getElementById('dsa-wrapper');
  if (accessSel && dsaWrapper) {
    accessSel.addEventListener('change', function() {
      const isExternal = this.value === 'External';
      dsaWrapper.style.display = isExternal ? 'block' : 'none';
      // DSA is External-only, drop it when switching to Internal.
      if (!isExternal) clearUpload('dcs-dsa', 'dsa-success', 'dsa');
      // For standard requests the main doc flips DPA <-> NDA on access change, clear the stale file.
      const involve = document.getElementById('dcs-involvement')?.value || '';
      if (involve !== 'agency' && involve !== 'ojt') clearUpload('dcs-main', 'main-upload-success', 'nda');
      updateMainUploadLabel();
    });
  }

  // Ensure correct initial state for label + endorsement wrapper after DOM is built
  updateMainUploadLabel();

  // Enforce OJT → External lock on initial render too (e.g. a restored OJT draft).
  if (state.dcs.isOJT) {
    const acc0 = document.getElementById('dcs-access');
    if (acc0) { acc0.value = 'External'; acc0.disabled = true; }
    const dsa0 = document.getElementById('dsa-wrapper');
    if (dsa0) dsa0.style.display = 'block';
    state.dcs.access = 'External';
  }

  // Restore previously uploaded file reference if coming back from summary
  if (state._savedFiles) {
    // We cannot programmatically set input.files, but we can show the filename
    // by setting a data attribute that handleFileChange will read
    if (state._savedFiles.nda) {
      const ndaInput = document.getElementById('dcs-main');
      const dt = new DataTransfer();
      dt.items.add(state._savedFiles.nda);
      ndaInput.files = dt.files;
      handleFileChange(ndaInput, 'main-upload-success');
    }
    if (state._savedFiles.dsa) {
      const dsaInput = document.getElementById('dcs-dsa');
      const dt = new DataTransfer();
      dt.items.add(state._savedFiles.dsa);
      dsaInput.files = dt.files;
      handleFileChange(dsaInput, 'dsa-success');
    }
    if (state._savedFiles.endorsement) {
      const endorseInput = document.getElementById('dcs-agency-endorsement');
      const dt = new DataTransfer();
      dt.items.add(state._savedFiles.endorsement);
      endorseInput.files = dt.files;
      handleFileChange(endorseInput, 'agency-endorsement-success');
    }
    if (state._savedFiles.supplementary && state._savedFiles.supplementary.length) {
      const suppInput = document.getElementById('dcs-supplementary');
      if (suppInput) {
        const dt = new DataTransfer();
        state._savedFiles.supplementary.forEach(function (f) { dt.items.add(f); });
        suppInput.files = dt.files;
        handleSupplementaryChange(suppInput);
      }
    }
    // Clear saved files after restoring so they don't re-apply on subsequent renders
    delete state._savedFiles;
  }

  if (state.dcs.accountable) {
    for (let i = 1; i <= 5; i++) {
      const n = state.dcs.accountable[`accountableName${i}`];
      const e = state.dcs.accountable[`accountableEmail${i}`];
      if (n || e) addAccountableRow(n, e);
    }
  }
}

/*
  Function Name: handleFileChange
  LAYMAN: When you pick a file, shows a "Selected: filename" confirmation and clears the
          "needs re-upload" warning.
  TECHNICAL: Reads input.files[0]; toggles the #successId element's text/visibility and resets
             state.dcs._hadFiles once any file is chosen.
  PARAMS:
  - input: the <input type=file> element that changed.
  - successId: id of the element that shows the selected-file confirmation.
  RETURNS: Nothing.
*/
function handleFileChange(input, successId) {
  const successEl = document.getElementById(successId);
  if (input.files && input.files[0]) {
    successEl.textContent = `Selected: ${input.files[0].name}`;
    successEl.removeAttribute('style'); // #5: clear any "re-upload required" warning styling
    successEl.classList.remove('hidden');
    // If we were forcing re-upload, clear _hadFiles once any file is selected
    if (state.dcs._hadFiles) {
      state.dcs._hadFiles = false;
    }
  } else {
    successEl.classList.add('hidden');
  }
}

/*
  Function Name: handleSupplementaryChange
  LAYMAN: For the optional "Additional Supporting Documents" picker (which allows several files at
          once), shows a "N files selected: a.pdf, b.pdf" confirmation and remembers the names so they
          still show on the Review Summary.
  TECHNICAL: Reads every input.files entry (multi-file input). Stores the names in
             state.dcs.supplementaryNames for summary rendering and updates the #supplementary-success
             element. Files themselves are read at submit time (readFileAsBase64) and preserved across
             re-renders via state._savedFiles.supplementary.
  PARAMS:
  - input: the multi-file <input type=file> element that changed.
  RETURNS: Nothing.
*/
function handleSupplementaryChange(input) {
  const successEl = document.getElementById('supplementary-success');
  const names = (input.files && input.files.length) ? Array.from(input.files).map(f => f.name) : [];
  state.dcs.supplementaryNames = names;
  // Round-4 fix: once the user re-attaches after a draft resume, the "please re-attach" state is over.
  if (names.length > 0 && state.dcs._suppReuploadCount) {
    state.dcs._suppReuploadCount = 0;
    const notice = document.getElementById('supplementary-reupload-notice');
    if (notice) notice.remove();
  }
  if (!successEl) return;
  if (names.length > 0) {
    successEl.innerHTML = '&#10003; ' + names.length + ' file' + (names.length > 1 ? 's' : '') + ' selected: ' + names.map(escapeHtml).join(', ');
    successEl.classList.remove('hidden');
  } else {
    successEl.classList.add('hidden');
  }
}

/*
  Function Name: clearUpload
  LAYMAN: Clears a file picker + its "Selected:" line when the required document changes
          (e.g. Internal→External, or standard→agency), so no stale file lingers.
  TECHNICAL: Resets the input value, hides the success element, and drops the saved File
             reference so it isn't re-applied on the next render.
  PARAMS:
  - inputId: the <input type=file> id.  - successId: its success element id.
  - savedKey: key in state._savedFiles to drop (e.g. 'nda','dsa').
  RETURNS: Nothing.
*/
function clearUpload(inputId, successId, savedKey) {
  const inp = document.getElementById(inputId);
  if (inp) inp.value = '';
  const succ = document.getElementById(successId);
  if (succ) succ.classList.add('hidden');
  if (savedKey && state._savedFiles) delete state._savedFiles[savedKey];
}

/*
  Function Name: syncDCSState

  LAYMAN:
  Reads everything currently typed into the Section 2 form and copies it into state.dcs, so the
  data is captured before navigating, autosaving, or submitting.

  TECHNICAL:
  Combines the location dropdown + "Others" text, copies the mapped text inputs (via idMap) through
  sanitizeText, forces iHelp to digits, rebuilds the accountable map from .accountable-row inputs,
  derives isAgency/isOJT from the involvement dropdown, and records selected filenames. Also clears
  _hadFiles if files were actually re-attached.

  PARAMS:
  - (none), reads live DOM, mutates state.dcs.

  RETURNS:
  Nothing (mutates state.dcs).
*/
function syncDCSState() {
  // Only clear _hadFiles if user actually re-uploaded files
  const ndaInput = document.getElementById('dcs-main');
  const dsaInput = document.getElementById('dcs-dsa');
  const endorseInput = document.getElementById('dcs-agency-endorsement');
  if (state.dcs._hadFiles && (ndaInput?.files?.length || dsaInput?.files?.length || endorseInput?.files?.length)) {
    state.dcs._hadFiles = false;
  }
  // Location: read the site dropdown directly (Others option removed, site is now a required known value)
  const locSel = document.getElementById('dcs-location-select');
  if (locSel) {
    state.dcs.location = locSel.value;
    state.dcs.locationOther = '';
  }

  const idMap = {
    name: 'dcs-name', dept: 'dcs-dept',
    access: 'dcs-access', ihelp: 'dcs-ihelp',
    immHeadName: 'dcs-imm-head-name', immHeadEmail: 'dcs-imm-head-email',
    deptHeadName: 'dcs-dept-head-name', deptHeadEmail: 'dcs-dept-head-email',
    divHeadName: 'dcs-div-head-name', divHeadEmail: 'dcs-div-head-email'
  };
  Object.entries(idMap).forEach(([k, id]) => {
    const el = document.getElementById(id);
    if (el) {
      state.dcs[k] = sanitizeText((el.value || '').trim(), CONFIG.MAX_TEXTAREA_LENGTH);
    }
  });

  // iHelp: numbers only
  if (state.dcs.ihelp && !/^\d+$/.test(state.dcs.ihelp)) {
    state.dcs.ihelp = state.dcs.ihelp.replace(/\D/g, '');
  }

  const accRows = document.querySelectorAll('.accountable-row');
  state.dcs.accountable = {};
  accRows.forEach((row, i) => {
    state.dcs.accountable[`accountableName${i+1}`] = (row.querySelector('.acc-name').value || '').trim();
    state.dcs.accountable[`accountableEmail${i+1}`] = (row.querySelector('.acc-email').value || '').trim();
  });

  // Involvement dropdown (None / Agency / OJT)
  const involvementSel = document.getElementById('dcs-involvement');
  const involveVal = involvementSel ? involvementSel.value : '';
  state.dcs.isAgency = (involveVal === 'agency');
  state.dcs.isOJT = (involveVal === 'ojt');

  // Use variables already declared above for _hadFiles check
  if (ndaInput?.files?.length) state.dcs.nda = sanitizeText(ndaInput.files[0].name, CONFIG.MAX_NAME_LENGTH);
  if (dsaInput?.files?.length) state.dcs.dsa = sanitizeText(dsaInput.files[0].name, CONFIG.MAX_NAME_LENGTH);
  if (endorseInput?.files?.length && state.dcs.agency) {
    state.dcs.agency.endorsementLetter = sanitizeText(endorseInput.files[0].name, CONFIG.MAX_NAME_LENGTH);
  }
}

// Map file extensions to proper MIME types.
// Using this is more reliable than the browser's file.type detection,
// which often falls back to 'application/octet-stream' for certain files.
const MIME_MAP = {
  pdf: 'application/pdf',
  doc: 'application/msword',
  docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
};

/*
  Function Name: readFileAsBase64

  LAYMAN:
  Turns a chosen file into base64 text so it can be sent to the server, but first rejects empty
  files, oversized files (>10MB), and disallowed types (only PDF/DOC/DOCX).

  TECHNICAL:
  Returns a Promise. Validates size (0 and MAX_FILE_SIZE_MB) and extension whitelist, then uses a
  FileReader (readAsDataURL) and resolves { base64, fileName, mimeType }. MIME prefers MIME_MAP
  over the browser's file.type. Rejects on read error/abort.

  PARAMS:
  - file: a File object from a file input.

  RETURNS:
  Promise resolving to { base64, fileName, mimeType }, or rejecting with a descriptive Error.
*/
function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    // CRITICAL: File size validation (prevents DoS attack)
    if (file.size === 0) {
      reject(new Error('File is empty. Please select a valid file.'));
      return;
    }
    
    const maxBytes = CONFIG.MAX_FILE_SIZE_MB * 1024 * 1024;
    if (file.size > maxBytes) {
      const sizeMB = (file.size / 1024 / 1024).toFixed(2);
      reject(new Error(`File too large. Maximum size is ${CONFIG.MAX_FILE_SIZE_MB}MB, got ${sizeMB}MB`));
      return;
    }
    
    // File extension whitelist
    const allowedExtensions = ['pdf', 'doc', 'docx'];
    const fileExt = file.name.split('.').pop().toLowerCase();
    if (!allowedExtensions.includes(fileExt)) {
      reject(new Error(`Invalid file type. Allowed: ${allowedExtensions.join(', ')}`));
      return;
    }
    
    const reader = new FileReader();
    reader.onload = () => {
      resolve({
        base64: reader.result.split(',')[1],
        fileName: file.name,
        // Prefer extension-based MIME mapping over browser's file.type,
        // since some browsers return 'application/octet-stream' for valid PDFs/DOCs.
        mimeType: MIME_MAP[fileExt] || file.type || 'application/octet-stream'
      });
    };
    reader.onerror = () => {
      reject(new Error('Failed to read file. Please try again.'));
    };
    reader.onabort = () => {
      reject(new Error('File read was aborted.'));
    };
    reader.readAsDataURL(file);
  });
}


/*
  Function Name: saveDCSForm

  LAYMAN:
  The "Next" action on Section 2. Validates the form, saves the draft, makes sure required files
  are attached, then moves on, to the Agency screen if it's an agency request, otherwise straight
  to the summary.

  TECHNICAL:
  validateDCSForm() -> syncDCSState() -> persistState(). Blocks if (draft mode) _hadFiles still
  pending, then validateFileUploads(). preserveFiles(), then branches to renderAgency() or
  renderSummary().

  PARAMS:
  - (none)

  RETURNS:
  Nothing (navigates on success; shows a toast and returns on failure).
*/
function saveDCSForm() {
  if (!validateDCSForm()) return;
  syncDCSState();
  persistState();

  // Prevent proceeding if files need to be re-uploaded (draft mode only, revision mode uses per-file flags)
  if (!state.isEditing && state.dcs._hadFiles) {
    showCustomAlert('Files need to be re-uploaded before proceeding. Please re-attach your document(s).', 'danger');
    return;
  }

  // Validate if all *currently required* files are selected
  if (!validateFileUploads()) {
    return;
  }


  // Save file references so they can be restored if user comes back
  preserveFiles();

  if (state.dcs.isAgency) {
    show('agency');
    renderAgency();
  } else {
    show('summary');
    renderSummary();
  }
}

/*
  Function Name: validateFileUploads

  LAYMAN:
  Checks that the documents you need are actually attached. In revision mode it only insists on
  re-uploading files the approver flagged; in normal/draft mode every currently-required file must
  be present.

  TECHNICAL:
  Revision branch (state.isEditing): require re-upload only for flagged dcs-nda, dcs-dsa (External),
  dcs-agency-endorsement (Agency/OJT). Normal branch: main document always required; DSA required for
  External access; Endorsement required for Agency or OJT. Shows a toast + focuses the card on failure.

  PARAMS:
  - (none), inspects the live upload inputs.

  RETURNS:
  true if all required files are present, else false.
*/
function validateFileUploads() {
  const ndaInput = document.getElementById('dcs-main');
  const dsaInput = document.getElementById('dcs-dsa');
  const endorseInput = document.getElementById('dcs-agency-endorsement');

  // --- Revision mode: only require re-upload for flagged files ---
  // Non-flagged files are retained from the previous submission (stored in Drive).
  if (state.isEditing) {
    // Main document: required only if flagged by approver
    if (isFileFlaggedForRevision('dcs-nda')) {
      if (!ndaInput || !ndaInput.files || ndaInput.files.length === 0) {
        showCustomAlert('This file was flagged by the approver. Please re-upload a corrected version.', 'danger');
        ndaInput?.closest('.upload-card')?.focus();
        return false;
      }
    }
    // DSA: required only if flagged AND access is External
    if (state.dcs.access === 'External' && isFileFlaggedForRevision('dcs-dsa')) {
      if (!dsaInput || !dsaInput.files || dsaInput.files.length === 0) {
        showCustomAlert('The DSA was flagged by the approver. Please re-upload a corrected version.', 'danger');
        dsaInput?.closest('.upload-card')?.focus();
        return false;
      }
    }
    // Endorsement: required only if flagged AND is Agency or OJT
    if ((state.dcs.isAgency || state.dcs.isOJT) && isFileFlaggedForRevision('dcs-agency-endorsement')) {
      if (!endorseInput || !endorseInput.files || endorseInput.files.length === 0) {
        showCustomAlert('The Endorsement Letter was flagged by the approver. Please re-upload a corrected version.', 'danger');
        endorseInput?.closest('.upload-card')?.focus();
        return false;
      }
    }
    // Round-4: supplementary docs required only if the approver flagged one; re-attaching the full
    // set replaces the old versions (server archives them as superseded).
    if (getFlaggedSupplementaryFiles().length > 0) {
      const suppInput = document.getElementById('dcs-supplementary');
      if (!suppInput || !suppInput.files || suppInput.files.length === 0) {
        showCustomAlert('The approver flagged your supporting document(s). Please re-attach all supporting documents, including corrected versions.', 'danger');
        suppInput?.closest('.upload-card')?.focus();
        return false;
      }
    }
    return true;
  }

  // --- Normal / Draft mode: all files are required as before ---
  // Main document (NDA/DPA/CU) is always required
  if (!ndaInput || !ndaInput.files || ndaInput.files.length === 0) {
    showCustomAlert('Please upload your main document (NDA, DPA, or Confidentiality Undertaking).', 'danger');
    ndaInput?.closest('.upload-card')?.focus();
    return false;
  }

  // DSA is required if access type is External
  if (state.dcs.access === 'External') {
    if (!dsaInput || !dsaInput.files || dsaInput.files.length === 0) {
      showCustomAlert('Please upload the Data Sharing Agreement (DSA) for external access.', 'danger');
      dsaInput?.closest('.upload-card')?.focus();
      return false;
    }
  }

  // Endorsement Letter is required for Agency or OJT requests
  if (state.dcs.isAgency || state.dcs.isOJT) {
    if (!endorseInput || !endorseInput.files || endorseInput.files.length === 0) {
      showCustomAlert('Please upload the Endorsement Letter for ' + (state.dcs.isOJT ? 'OJT' : 'agency') + ' requests.', 'danger');
      endorseInput?.closest('.upload-card')?.focus();
      return false;
    }
  }

  return true;
}

/*
  Function Name: validateAgencyForm

  LAYMAN:
  Validates the extra Agency screen: Agency Name and Personnel are required, recovery email/number
  must be well-formed, and the contract start date can't be more than 10 years in the past.

  TECHNICAL:
  Reads state.dcs.agency. Requires agencyName + agencyPersonnel (non-blank), rejects whitespace-only
  text fields, validates immHeadRecoveryEmail (isValidEmail) and immHeadRecoveryNumber (digits), and
  bounds contractStartDate (parseable; >= now-10y). Returns on first failure with a toast.

  PARAMS:
  - (none), reads state.dcs.agency.

  RETURNS:
  true if valid, else false.
*/
function validateAgencyForm() {
  const ag = state.dcs.agency || {};
  if (!ag.agencyName || ag.agencyName.trim() === '') {
    showCustomAlert('Agency Name is required.', 'danger');
    return false;
  }
  if (!ag.agencyPersonnel || ag.agencyPersonnel.trim() === '') {
    showCustomAlert('Agency Personnel is required.', 'danger');
    return false;
  }
  // Request type is required; a Replacement must name the person being replaced (for DCOPS).
  if (!ag.agencyRequestType) {
    showCustomAlert('Please select whether this is a New or Replacement agency request.', 'danger');
    return false;
  }
  if (ag.agencyRequestType === 'Replacement') {
    if (!ag.replacementFullName || ag.replacementFullName.trim() === '') {
      showCustomAlert('Full name of the person being replaced is required.', 'danger');
      return false;
    }
    if (!ag.replacementEmail || ag.replacementEmail.trim() === '') {
      showCustomAlert('Email of the person being replaced is required (or tick "No email available").', 'danger');
      return false;
    }
    if (ag.replacementEmail.trim() !== 'N/A' && !isValidEmail(ag.replacementEmail)) {
      showCustomAlert('Replaced person email must be a valid email address.', 'danger');
      return false;
    }
  }
  // Network Drive is required for agency requests (defines what the agency will access).
  if (!ag.networkDrive || ag.networkDrive.trim() === '') {
    showCustomAlert('Network Drive to Access is required for agency requests.', 'danger');
    return false;
  }
  // Reject whitespace-only in agency text fields
  const agencyTextFields = ['agencyName', 'agencyPersonnel', 'networkDrive'];
  for (const key of agencyTextFields) {
    if (ag[key] && ag[key].trim() === '') {
      showCustomAlert(`${key.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase())} cannot be only spaces.`, 'danger');
      return false;
    }
  }

  if (ag.immHeadRecoveryEmail && !isValidEmail(ag.immHeadRecoveryEmail)) {
    showCustomAlert('Invalid Immediate Head Recovery Email.', 'danger');
    return false;
  }
  // Validate Immediate Head Recovery Number (numbers only)
  if (ag.immHeadRecoveryNumber && !/^\d+$/.test(ag.immHeadRecoveryNumber)) {
    showCustomAlert('Immediate Head Recovery Number must contain only numbers.', 'danger');
    return false;
  }
  // Validate contract start date: accepts future dates, but no more than 10 years in the past
  if (ag.contractStartDate) {
    const contractDate = new Date(ag.contractStartDate);
    if (isNaN(contractDate.getTime())) {
      showCustomAlert('Contract Start Date is invalid.', 'danger');
      return false;
    }
    const minDate = new Date();
    minDate.setFullYear(minDate.getFullYear() - 10);
    minDate.setHours(0, 0, 0, 0);
    if (contractDate < minDate) {
      showCustomAlert('Contract Start Date cannot be more than 10 years in the past.', 'danger');
      return false;
    }
  }
  return true;
}

/*
  Function Name: syncAgencyState
  LAYMAN: Reads the Agency screen inputs into state.dcs.agency.
  TECHNICAL: Maps each agency input id to its state key, sanitizes with per-field max lengths, and
             records the endorsement filename if a file is selected.
  PARAMS: (none), reads live DOM, mutates state.dcs.agency.
  RETURNS: Nothing.
*/
function syncAgencyState() {
  if (!state.dcs.agency) state.dcs.agency = {};
  const map = {
    agencyRequestType: 'dcs-agency-request-type',
    replacementFullName: 'dcs-agency-replacement-name',
    replacementEmail: 'dcs-agency-replacement-email',
    agencyName: 'dcs-agency-name',
    agencyPersonnel: 'dcs-agency-personnel',
    contractStartDate: 'dcs-agency-contract-start',
    networkDrive: 'dcs-agency-network-drive',
    immHeadRecoveryEmail: 'dcs-agency-recovery-email',
    immHeadRecoveryNumber: 'dcs-agency-recovery-number'
  };
  const AGENCY_MAX_LENGTHS = {
    agencyRequestType: 20,
    replacementFullName: CONFIG.MAX_NAME_LENGTH,
    replacementEmail: CONFIG.MAX_EMAIL_LENGTH,
    agencyName: CONFIG.MAX_NAME_LENGTH,
    agencyPersonnel: CONFIG.MAX_NAME_LENGTH,
    contractStartDate: 10,
    networkDrive: CONFIG.MAX_NAME_LENGTH,
    immHeadRecoveryEmail: CONFIG.MAX_EMAIL_LENGTH,
    immHeadRecoveryNumber: 12
  };
  Object.entries(map).forEach(([k, id]) => {
    // Round-4 fix: when "No email available (N/A)" is ticked, the email input is disabled and
    // emptied, so reading it here would overwrite the stored 'N/A' with '' and validation would
    // then wrongly demand an email. Keep the sentinel instead.
    if (k === 'replacementEmail') {
      const naCb = document.getElementById('dcs-agency-replacement-email-na');
      if (naCb && naCb.checked) {
        state.dcs.agency.replacementEmail = 'N/A';
        return;
      }
    }
    const el = document.getElementById(id);
    if (el) state.dcs.agency[k] = sanitizeText((el.value || '').trim(), AGENCY_MAX_LENGTHS[k] || CONFIG.MAX_NAME_LENGTH);
  });
  const endorseInput = document.getElementById('dcs-agency-endorsement');
  if (endorseInput?.files?.length) {
    state.dcs.agency.endorsementLetter = sanitizeText(endorseInput.files[0].name, CONFIG.MAX_NAME_LENGTH);
  }
}

/*
  Function Name: saveAgencyForm

/*
  Function Name: summaryRow
  LAYMAN: Builds one "Label: Value" row used throughout the summary/details cards.
  TECHNICAL: Returns a .summary-row with escaped label and value (value falls back to 'N/A').
  PARAMS:
  - label: the row label.
  - value: the row value (empty -> 'N/A').
  RETURNS: HTML string.
*/
/*
  Function Name: icon

  LAYMAN (Tropang Ex):
  Dati, emoji ang ginagamit na icon (⚠ ✓ ✗). Mukhang iba-iba yun depende sa OS at browser,
  hindi masusunod ang kulay ng text, at labag sa sariling rule natin sa frontend ("no emoji
  as interface icons"). Ito yung kapalit: totoong SVG na sumusunod sa kulay ng nakapaligid
  na text, at walang kinukuhang file sa internet.

  TECHNICAL:
  Returns an inline SVG string for a small named icon set (Lucide-derived paths), stroked
  with `currentColor` so it inherits the surrounding colour and needs no per-variant CSS.
  Zero network requests, which matters here: Apps Script serves the page from a sandboxed
  iframe and an external icon font would be a third-party fetch on every load.

  🚩 Returns HTML, so only use it where the sink is innerHTML / a template literal that
  becomes markup. It will render as literal text through `textContent` or through
  summaryRow(), which escapes its value. In those places drop the glyph instead of
  substituting one, a tick mark inside a sentence is punctuation, not an icon.

  PARAMS:
  - name: 'warn' | 'check' | 'x'. An unknown name returns '' rather than throwing.
  - size: pixel box, default 14.

  RETURNS:
  An `<svg>` string, or '' for an unknown name.

  EXAMPLE
    el.innerHTML = icon('check') + ' Saved';
    → '<svg …><path d="M20 6 9 17l-5-5"/></svg> Saved'
*/
function icon(name, size) {
  const s = size || 14;
  const paths = {
    warn:  '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    x:     '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'
  };
  if (!paths[name]) return '';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + s + '" height="' + s + '"'
       + ' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
       + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"'
       + ' style="vertical-align:-2px;flex-shrink:0;">' + paths[name] + '</svg>';
}

function summaryRow(label, value) {
  const safeLabel = escapeHtml(label || '');
  const display = escapeHtml(value || 'N/A');
  return `<div class="summary-row"><div class="summary-label">${safeLabel}</div><div class="summary-value">${display}</div></div>`;
}

// #2: like summaryRow but the value is pre-built trusted HTML (e.g. a document link); label still escaped.
function summaryRowRaw(label, rawValue) {
  const safeLabel = escapeHtml(label || '');
  return `<div class="summary-row"><div class="summary-label">${safeLabel}</div><div class="summary-value">${rawValue || 'N/A'}</div></div>`;
}

  everything (form data, files, agency/OJT info, revision flag) and sends it to the server. On
  success it clears the draft and shows the success screen with your new request id and a Phase 2 link.

  TECHNICAL:
  async. Sets state.isSubmitting and disables the button. Blocks if draft-mode _hadFiles is pending.
  Re-runs validateFileUploads(), reads files via readFileAsBase64 (Internal non-agency main file ->
  dpaFile, else ndaFile; DSA for External; endorsement for Agency/OJT). agencyData is {type:'OJT'} or
  the full agency object with type:'AGENCY'. Calls submitDCS(payload, sessionId); success ->
  resetDraftState() + renderSuccess(reqId, date, phase2Url). Always restores button/loading state.

  PARAMS:
  - (none), reads state + the live upload inputs.

  RETURNS:
  Promise<void> (navigates on success; toasts on failure).

  STEPS
    Step 1: Guard double-submit + pending re-upload; show loading; disable button.
    Step 2: Validate files, then base64-encode each present file into the right payload slot.
    Step 3: Attach agency/OJT data (+ endorsement file) when applicable.
    Step 4: submitDCS to backend; on success reset draft + show success, else show error.
*/
async function submitRequest() {
  // CRITICAL: Double-submit prevention
  if (state.isSubmitting) {
    showCustomAlert('Request is already being submitted. Please wait.', 'warn');
    return;
  }

  state.isSubmitting = true;

  const s = sanitizeDCSData(state.dcs);

  const btn = document.querySelector('#screen-summary .btn-primary');
  const originalText = btn?.textContent || 'Submit Request';
  if (btn) {
    btn.textContent = 'Submitting...';
    btn.disabled = true;
  }

  // Block submission if files need re-upload from draft restore (draft mode only, revision mode uses per-file flags)
  if (!state.isEditing && state.dcs._hadFiles) {
    showCustomAlert('Files need to be re-uploaded before submission. Please go back and re-attach your document(s).', 'danger');
    state.isSubmitting = false;
    if (btn) { btn.textContent = originalText; btn.disabled = false; }
    return;
  }

  // Validate required files BEFORE the loading overlay so a validation failure doesn't flash a frozen UI.
  if (!validateFileUploads()) {
    state.isSubmitting = false;
    if (btn) { btn.textContent = originalText; btn.disabled = false; }
    return;
  }

  // Round-4 guard: the resumed draft had supporting documents that were never re-attached.
  // They are optional, so confirm (not block) before submitting without them.
  const suppGuardInput = document.getElementById('dcs-supplementary');
  if (state.dcs._suppReuploadCount > 0 && !(suppGuardInput?.files?.length)) {
    state.isSubmitting = false;
    if (btn) { btn.textContent = originalText; btn.disabled = false; }
    showCustomConfirm(
      'Your draft originally had ' + state.dcs._suppReuploadCount + ' supporting document(s) that were not re-attached. Submit without them?',
      function () {
        state.dcs._suppReuploadCount = 0;
        submitRequest();
      }
    );
    return;
  }

  try {
    showLoading('Uploading files and submitting request...');

    const ndaInput = document.getElementById('dcs-main');
    const dsaInput = document.getElementById('dcs-dsa');

    const payload = {
      formData: s,
      ndaFile: null, // Will be populated below if file exists
      dpaFile: null, // Will be populated below if file exists
      dsaFile: null, // Will be populated below if file exists
      supplementaryFiles: [], // Commit 5: optional additional supporting documents (multi-file)
      isEditing: state.isEditing,
      agencyData: null
    };


    // Read files and map them to the correct payload properties
    if (ndaInput?.files?.length) {
      try {
        const fileData = await readFileAsBase64(ndaInput.files[0]);
        // Logic to match Code.gs expectations: CU vs NDA vs DPA
        if (state.dcs.access === 'Internal' && !state.dcs.isAgency) payload.dpaFile = fileData;
        else payload.ndaFile = fileData;
      } catch (e) {
        throw new Error('Main document file error: ' + e.message);
      }
    }
    if (state.dcs.access === 'External' && dsaInput?.files?.length) {
      try {
        payload.dsaFile = await readFileAsBase64(dsaInput.files[0]);
      } catch (e) {
        throw new Error('DSA file error: ' + e.message);
      }
    }

    // Include agency/OJT data. Agency → full detail fields; OJT → only the type marker.
    if (state.dcs.isAgency || state.dcs.isOJT) {
      payload.agencyData = state.dcs.isOJT
        ? { type: 'OJT' }
        : { ...state.dcs.agency, type: 'AGENCY' };
      const endorseInput = document.getElementById('dcs-agency-endorsement');
      if (endorseInput?.files?.length) {
        try {
          payload.agencyData.endorsementLetterFile = await readFileAsBase64(endorseInput.files[0]);
        } catch (e) {
          throw new Error('Endorsement letter error: ' + e.message);
        }
      }
    }

    // Commit 5: read every selected Additional Supporting Document (optional, multi-file).
    const suppInput = document.getElementById('dcs-supplementary');
    if (suppInput?.files?.length) {
      for (let i = 0; i < suppInput.files.length; i++) {
        try {
          payload.supplementaryFiles.push(await readFileAsBase64(suppInput.files[i]));
        } catch (e) {
          throw new Error('Additional supporting document error: ' + e.message);
        }
      }
    }

    if (typeof google !== 'undefined') {
      google.script.run
        .withSuccessHandler((response) => {
          state.isSubmitting = false;
          hideLoading();
          if (btn) { btn.textContent = originalText; btn.disabled = false; }
          
          if (response.ok) {
            const submittedAt = new Date().toLocaleDateString('en-PH', { year:'numeric', month:'short', day:'numeric' });
            const finalReqId = response.reqId;
            const phase2Url = response.phase2Url;
            
            // Clear the draft state
            resetDraftState(); 

            show('success');
            renderSuccess(finalReqId, submittedAt, phase2Url);
          } else {
            showCustomAlert('Submission failed: ' + response.message, 'danger');
          }
        })
        .withFailureHandler((err) => {
          state.isSubmitting = false;
          hideLoading();
          if (btn) {
            btn.textContent = originalText;
            btn.disabled = false;
          }
          showCustomAlert('Server connection error: ' + err.message, 'danger');
        })
        .submitDCS(payload, state.sessionId);
    }
  } catch (err) {
    state.isSubmitting = false;
    hideLoading();
    if (btn) {
      btn.textContent = originalText;
      btn.disabled = false;
    }
    showCustomAlert('Error: ' + err.message, 'danger');
  }
}

/*
  Function Name: getStatusKey
  LAYMAN: Collapses a request's DCS+PIA status into one keyword the status filter dropdown uses
          (pending, ready, in-progress, escalated, returned, certified, denied, other).
  TECHNICAL: Mirrors getCombinedStatusBadge's precedence but returns a filter key string instead of HTML.
  PARAMS:
  - dcsStatus: DCS phase status.
  - piaStatus: PIA phase status.
  RETURNS: A filter-key string.
*/
// Maps a request's DCS+PIA status to a single filter key (mirrors getCombinedStatusBadge).
function getStatusKey(dcsStatus, piaStatus) {
  const dcs = String(dcsStatus || '').toLowerCase().trim();
  const pia = String(piaStatus || '').toLowerCase().trim();
  if (dcs === 'pending') return 'pending';
  if (dcs === 'returned') return 'returned';
  if (dcs === 'denied') return 'denied';
  if (dcs === 'escalated to division head') return 'escalated';
  if (dcs === 'approved by ism') return 'certified';
  if (dcs === 'rejected by ism') return 'denied';
  if (dcs === 'approved' || dcs === 'complete') {
    if (!pia) return 'ready';
    if (pia === 'pending') return 'in-progress';
    if (pia === 'returned') return 'returned';
    if (pia === 'denied' || pia === 'rejected by ism') return 'denied';
    if (pia === 'approved') return 'in-progress';
    if (pia === 'approved by ism' || pia === 'complete') return 'certified';
    if (pia === 'escalated to division head') return 'escalated';
    return 'in-progress';
  }
  return 'other';
}

/*
  Function Name: renderRequestRow
  LAYMAN: Builds one clickable row in the requests list, name, id, submit date, status badge, and
          (for returned/rejected) the approver's note.
  TECHNICAL: Returns an .app-row (keyboard-activatable) wired to viewRequestDetails(req.reqId). Shows
             a remarks strip only when status/piaStatus is RETURNED/REJECTED. All fields escaped.
  PARAMS:
  - req: a request summary object.
  RETURNS: HTML string for the row.
*/
function renderRequestRow(req) {
  const badgesHtml = getCombinedStatusBadge(req.status, req.piaStatus);
  let remarksHtml = '';
  if (req.remarks && (req.status === 'RETURNED' || String(req.piaStatus).toUpperCase() === 'RETURNED' || String(req.piaStatus).toUpperCase() === 'REJECTED')) {
    remarksHtml = `<div style="font-size: 11.5px; color: var(--warn-text); margin-top: 8px; background: rgba(180, 109, 20, 0.1); padding: 6px 10px; border-radius: 4px; border-left: 2px solid var(--warn-text); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"><strong>Note:</strong> ${escapeHtml(req.remarks)}</div>`;
  }
  return `
    <div class="app-row" role="listitem" tabindex="0" onclick="viewRequestDetails('${escapeHtml(req.reqId)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();viewRequestDetails('${escapeHtml(req.reqId)}');}">
      <div class="app-info">
        <div class="app-name">${escapeHtml(req.name)}</div>
        <div class="app-id" style="margin-top: 4px; margin-bottom: 4px;">${escapeHtml(req.reqId)}</div>
        <div class="app-date">Submitted: ${new Date(req.timestamp).toLocaleDateString()}</div>
        ${remarksHtml}
      </div>
      <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap;">
        ${badgesHtml}
      </div>
    </div>
  `;
}

/*
  Function Name: applyRequestFilters

  LAYMAN:
  Re-filters the requests list whenever you type in the search box or change the status dropdown,
  showing only matching rows (or a "no matches" message).

  TECHNICAL:
  Reads #req-search + #req-status-filter, filters _requestsCache by name/reqId substring and
  getStatusKey() equality, then renders rows via renderRequestRow() into #requests-list-content,
  toggling the empty-filter message.

  PARAMS:
  - (none), reads the live filter controls and _requestsCache.

  RETURNS:
  Nothing (updates the list DOM).
*/
function applyRequestFilters() {
  const listEl = document.getElementById('requests-list-content');
  if (!listEl) return;
  const searchEl = document.getElementById('req-search');
  const statusEl = document.getElementById('req-status-filter');
  const emptyEl = document.getElementById('requests-empty-filter');
  const q = (searchEl ? searchEl.value : '').toLowerCase().trim();
  const statusKey = statusEl ? statusEl.value : '';
  const filtered = (_requestsCache || []).filter(req => {
    const matchesSearch = !q || String(req.name || '').toLowerCase().includes(q) || String(req.reqId || '').toLowerCase().includes(q);
    const matchesStatus = !statusKey || getStatusKey(req.status, req.piaStatus) === statusKey;
    return matchesSearch && matchesStatus;
  });
  if (filtered.length === 0) {
    listEl.innerHTML = '';
    listEl.classList.add('hidden');
    if (emptyEl) emptyEl.classList.remove('hidden');
    return;
  }
  if (emptyEl) emptyEl.classList.add('hidden');
  listEl.classList.remove('hidden');
  listEl.innerHTML = filtered.map(renderRequestRow).join('');
}

/*
  Function Name: renderRequestDetails

  LAYMAN:
  Assembles the full detail page for a request: a revision banner (if the approver returned it with
  feedback), the optional Agency card, the detailed DCS summary, the approval/ISM/DivHead trackers,
  the overall progress timeline, and the right action button (Edit & Resubmit / Proceed to Phase 2 /
  status badge).

  TECHNICAL:
  Reads data.metadata, data.files (resolves NDA/CU/DPA and DSA names), and various status fields.
  canEditDcs is true only when DCS status === 'RETURNED'. Picks actionButtonHtml from the
  status/PIA-completion/Phase2-URL combination, builds the DCS revision banner, then writes the whole
  page into #screen-request-details, delegating sub-sections to getDetailedDcsSummaryCardHtml,
  renderApprovalTracker, renderISMAndDivHeadTracker, and renderPiaTimeline.

  PARAMS:
  - data: the full request object returned by apiGetRequestData.

  RETURNS:
  Nothing (writes into #screen-request-details).
*/
function renderRequestDetails(data) {
  const container = document.getElementById('screen-request-details');
  const s = data.metadata || {};
  const files = data.files || [];
  // #2: render uploaded documents as download buttons (files carry {type,name,id}).
  // SECURITY: these used to be raw https://drive.google.com/file/d/<id>/view links, which only
  // worked because uploadProxy_ published every document with ANYONE_WITH_LINK. Documents are now
  // PRIVATE in Drive and are served exclusively through apiDownloadDcsFile, which re-checks
  // ownership and that the fileId really belongs to this request. No Drive URL reaches the browser.
  // NOTE: built with plain string concatenation (no template literal) on purpose, keep it ASCII.
  // (See CLAUDE.md §8: a backtick template in a string helper here corrupted the whole page at GAS
  //  serve time. Do not "modernize" this into a template literal.)
  const reqIdAttr = safeIdAttr(data.reqId);
  const fileLinkHtml = function (obj) {
    if (!obj || !obj.id) return 'Not attached';
    var fid = safeIdAttr(obj.id);
    var name = escapeHtml(obj.name || 'View file');
    // Missing ids would produce a dead button, show the plain name instead.
    if (!fid || !reqIdAttr) return name;
    return '<button type="button" class="doc-link" title="View ' + name + '"' +
           ' onclick="viewDcsFile(\'' + reqIdAttr + '\',\'' + fid + '\',this)">' +
           name + '</button>';
  };
  const ndaFile = fileLinkHtml(files.find(f => f.type === 'NDA' || f.type === 'CU' || f.type === 'DPA'));
  const dsaFile = fileLinkHtml(files.find(f => f.type === 'DSA'));
  const endorsementObj = files.find(f => f.type === 'ENDORSEMENT');
  const endorsementFile = endorsementObj ? fileLinkHtml(endorsementObj) : '';
  // Commit 5: additional supporting documents, multiple SUPPLEMENTARY entries, listed together.
  const supplementaryDocs = files.filter(f => f.type === 'SUPPLEMENTARY');
  const supplementaryHtml = supplementaryDocs.length
    ? supplementaryDocs.map(function (f) { return fileLinkHtml(f); }).join('<br>')
    : '';
  // Commit 4 (requestor view): previous document versions kept viewable via the Archive folder, not trashed.
  const supersededDocs = Array.isArray(s.supersededFiles) ? s.supersededFiles : [];
  const supersededHtml = supersededDocs.length
    ? supersededDocs.map(function (f) {
        const roundLabel = f.supersededRound ? ' <span style="color:var(--text3);">(replaced in round ' + escapeHtml(String(f.supersededRound)) + ')</span>' : '';
        return fileLinkHtml(f) + roundLabel;
      }).join('<br>')
    : '';

  let actionButtonHtml = '';
  const hasPhase2Url = data.phase2Url && data.phase2Url.trim() !== '';
  
  const dcsStatus = String(data.status || '').toUpperCase();
  const piaStatusLower = String(data.piaStatus || '').toLowerCase();
  const piaDecisionLower = String(data.piaDecision || '').toLowerCase().replace(/\s+/g, '');
  const isPiaCompleted = ['approved', 'complete', 'closed', 'pending'].includes(piaStatusLower);
  const isPiaReturned = (piaStatusLower === 'rejected' || piaStatusLower === 'returned');
  const isPiaRejected = piaStatusLower === 'rejected' || piaStatusLower === 'returned';

  // Determine if PIA revision is required for the comment banner
  const isPiaRevisionRequired = data.isPiaRevisionRequired || false;
  const approverComments = data.approverComments || '';

  let hasDcsFlags = false;
  if (data.approverFlags !== null && Object.keys(data.approverFlags).length > 0) {
    hasDcsFlags = true;
  }
  
  const isDcsReturned = dcsStatus === 'RETURNED';
  const canEditDcs = isDcsReturned;
    
  if (canEditDcs) {
  actionButtonHtml = `
      <div style="display: flex; align-items: center; gap: 10px;">
        <button class="btn btn-primary" type="button" onclick="editReturnedApplication('${escapeHtml(data.reqId)}')">Edit & Resubmit</button>
      </div>
    `;
  } else if (data.status === 'READY_FOR_PIA' || data.status === 'COMPLETE' || isPiaReturned || dcsStatus === 'RETURNED') {
    if (isPiaCompleted) {
      actionButtonHtml = `<button class="btn btn-primary" type="button" disabled title="The Privacy Impact Assessment for this request has been completed.">Phase 2 Completed</button>`;
    } else {
      // Otherwise, show the regular "Proceed to Phase 2" button.
      actionButtonHtml = `
        ${hasPhase2Url ?
          `<button class="btn btn-primary" type="button" onclick="window.open('${escapeHtml(data.phase2Url)}', '_blank'); show('landing');">Proceed to Phase 2</button>` :
          `<button class="btn btn-primary" type="button" disabled title="Phase 2 URL not available or configured. Please contact support.">Proceed to Phase 2</button>`
        }
      `;
    }
  } else {
    actionButtonHtml = getCombinedStatusBadge(data.status, data.piaStatus);
  }

      // Round-4: show the requestor the exact flagged items + per-flag reasons here in the details
      // view, not only inside Edit & Resubmit mode (they were previously reduced to an unused boolean).
      const flaggedItemsListHtml = (() => {
        const flags = data.approverFlags || {};
        const keys = Object.keys(flags);
        if (!keys.length) return '';
        const rows = keys.map(function (k) {
          const label = k.indexOf('DCS - ') === 0 ? k.slice(6) : k;
          const reason = flags[k];
          return '<li style="margin-bottom:4px;"><strong>' + escapeHtml(label) + '</strong>' +
            (reason && reason !== true ? ': ' + escapeHtml(String(reason)) : '') + '</li>';
        }).join('');
        return `
      <div style="margin-top:12px; padding:10px 12px; background:var(--bg2); border-radius:var(--radius); border-left:3px solid var(--warn-text); font-size:13px; color:var(--text2);">
        <strong style="color:var(--warn-text);">Flagged Items:</strong>
        <ul style="margin:6px 0 0 18px; padding:0;">${rows}</ul>
      </div>`;
      })();

      // Build DCS revision comment banner
      const dcsRevisionBannerHtml = canEditDcs ? `
    <div class="card" style="background:var(--warn);border-color:rgba(180, 109, 20, 0.2);">
      <p style="font-size:13px;color:var(--warn-text);line-height:1.6;margin:0;">
            <strong>Revision Required.</strong> The approver has requested changes to your DCS application. Please review the feedback below and click "Edit & Resubmit" to make the necessary updates.
      </p>
      ${approverComments ? `
      <div style="margin-top:12px; padding:10px 12px; background:var(--bg2); border-radius:var(--radius); border-left:3px solid var(--warn-text); font-size:13px; color:var(--text2);">
        <strong style="color:var(--warn-text);">Approver Feedback:</strong><br>${escapeHtml(approverComments)}
      </div>` : ''}
      ${flaggedItemsListHtml}
    </div>
  ` : '';

  container.innerHTML = `
    <div class="page-content">
    <div class="page-header">
      <div class="app-id" style="margin-top: 10px;">${escapeHtml(data.reqId)}</div>
      <h1>${escapeHtml(s.name || 'Request Details')}</h1>
      <p>Submitted on ${new Date(data.timestamp).toLocaleString()}</p>
    </div>

        ${dcsRevisionBannerHtml}

    ${(() => {
      const ag = data.metadataAgency || {};
      if (!ag.agencyName) return '';
      return `
    <div class="card" style="border-color: var(--warn-text); background:var(--navy-tint);">
      <div style="margin-bottom:12px; display:flex; align-items:center; gap:8px;">
        <span class="step-badge" style="background:var(--warn);color:var(--warn-text);border-color:rgba(180,109,20,0.2);">Agency Request</span>
      </div>
      <div class="summary-section">
        <h3>Agency Information</h3>
        ${summaryRow('Request Type', ag.agencyRequestType)}
        ${ag.agencyRequestType==='Replacement' ? summaryRow('Replaced Person', ag.replacementFullName) : ''}
        ${ag.agencyRequestType==='Replacement' ? summaryRow('Replaced Person Email', ag.replacementEmail) : ''}
        ${getContainerFlagHtml('dcs-agency-name')}
        ${summaryRow('Agency Name', ag.agencyName)}
        ${getContainerFlagHtml('dcs-agency-personnel')}
        ${summaryRow('Agency Personnel', ag.agencyPersonnel)}
        ${getContainerFlagHtml('dcs-agency-contract-start')}
        ${summaryRow('Contract Start Date', ag.contractStartDate)}
        ${getContainerFlagHtml('dcs-agency-network-drive')}
        ${summaryRow('Network Drive', ag.networkDrive)}
        ${getContainerFlagHtml('dcs-agency-recovery-email')}
        ${summaryRow('Recovery Email', ag.immHeadRecoveryEmail)}
        ${getContainerFlagHtml('dcs-agency-recovery-number')}
        ${summaryRow('Recovery Number', ag.immHeadRecoveryNumber)}
      </div>
    </div>
      `;
    })()}

    ${getDetailedDcsSummaryCardHtml(s, data.reqId, ndaFile, dsaFile, endorsementFile, data.remarks, supplementaryHtml, supersededHtml)}

    ${renderUnifiedApprovalHistory(data)}

    ${renderPiaTimeline(data)}

    <div class="btn-row" style="justify-content: space-between;">
      <button class="btn" type="button" onclick="renderRequests()">&larr; Back to My Requests</button>
      <div style="display: flex; align-items: center; gap: 10px;">
        ${actionButtonHtml}
      </div>
    </div>
    </div>
  `;
}

/*
  Function Name: editReturnedApplication

  LAYMAN:
  Starts fixing a returned application. It loads the saved revision draft if one exists, turns on
  revision mode, pulls in the approver's flags so the right fields/files get highlighted, and opens
  the form.

  TECHNICAL:
  Calls apiRestoreDraft(reqId). If a draft with state.isEditing exists, adopts its dcs/agency, sets
  isEditing + approverFlags + _piaRevisionBanner, clears filenames only for flagged files (non-flagged
  retained), and, if flags are missing, defers to fetchApproverFlagsForRevision(). If no editing
  draft, falls back to fetchReturnedApplicationFromDB(reqId).

  PARAMS:
  - reqId: the returned request's id.

  RETURNS:
  Nothing (async navigation into the form in revision mode).
*/
function editReturnedApplication(reqId) {
  showLoading('Loading application for revision...');
  
  if (typeof google !== 'undefined') {
    google.script.run
      .withSuccessHandler(function(draftRes) {
        if (draftRes && draftRes.found && draftRes.state && draftRes.state.isEditing) {
          hideLoading();
          state.sessionId = reqId;
          state.isEditing = true;
          state.dcs = draftRes.state.dcs;
          if (!state.dcs.agency) state.dcs.agency = { agencyName: '', agencyPersonnel: '', contractStartDate: '', endorsementLetter: '', networkDrive: '', immHeadRecoveryEmail: '', immHeadRecoveryNumber: '' };
          if (state.dcs.isAgency === undefined) state.dcs.isAgency = !!(state.dcs.agency && state.dcs.agency.agencyName);
          if (state.dcs.isOJT === undefined) state.dcs.isOJT = !!(state.dcs.agency && state.dcs.agency.type === 'OJT');
          
          // Load approver flags FIRST: needed for per-file revision checks below
          state.approverFlags = draftRes.state.approverFlags || {};
          state._piaRevisionBanner = draftRes.state.approverComments || '';

          // Revision mode: don't use global _hadFiles; only clear filenames for flagged files.
          // Non-flagged files are retained, the backend keeps the existing Drive file.
          state.dcs._hadFiles = false;
          if (isFileFlaggedForRevision('dcs-nda')) {
            state.dcs.nda = '';
          }
          if (isFileFlaggedForRevision('dcs-dsa')) {
            state.dcs.dsa = '';
          }
          if (isFileFlaggedForRevision('dcs-agency-endorsement') && state.dcs.agency) {
            state.dcs.agency.endorsementLetter = '';
          }
          
          // If approver flags are missing from draft, fetch them from the server
          if (!draftRes.state.approverFlags || Object.keys(draftRes.state.approverFlags).length === 0) {
            fetchApproverFlagsForRevision(reqId);
            return;
          }
                  
          show('form');
          renderForm();
        } else {
          fetchReturnedApplicationFromDB(reqId);
        }
      })
      .withFailureHandler(function() { fetchReturnedApplicationFromDB(reqId); })
      .apiRestoreDraft(reqId);
  } else { fetchReturnedApplicationFromDB(reqId); }
}

/*
  Function Name: fetchApproverFlagsForRevision
  LAYMAN: Fallback that fetches the approver's field flags from the server when they weren't saved in
          the draft, so revision highlighting still works, then opens the form.
  TECHNICAL: Calls apiGetRequestData(reqId); on found, keeps only flag keys containing 'DCS' into
             state.approverFlags. Always ends by show('form') + renderForm() (even on failure/no flags).
  PARAMS:
  - reqId: the request id.
  RETURNS: Nothing (async).
*/
function fetchApproverFlagsForRevision(reqId) {
  showLoading('Loading approver notes...');
  if (typeof google !== 'undefined') {
    google.script.run
      .withSuccessHandler(function(res) {
        hideLoading();
        if (res && res.found) {
          // Extract DCS-specific flags from the response
          let rawFlags = res.approverFlags || {};
          let flags = {};
          for (const key in rawFlags) {
            if (key.toUpperCase().includes('DCS')) {
              flags[key] = rawFlags[key];
            }
          }
          state.approverFlags = flags;
          show('form');
          renderForm();
        } else {
          show('form');
          renderForm();
        }
      })
      .withFailureHandler(function() {
        hideLoading();
        show('form');
        renderForm();
      })
      .apiGetRequestData(reqId);
  } else {
    show('form');
    renderForm();
  }
}

/*
  Function Name: fetchReturnedApplicationFromDB

  LAYMAN:
  The deeper fallback when there's no revision draft at all, rebuilds the whole form from the
  original submission stored in the database, marks it as a revision, and opens it.

  TECHNICAL:
  Calls apiGetReturnedApplication(reqId). On success sets isEditing + sessionId, reconstructs state.dcs
  from res.application.metadata/metadataAgency/files (detecting Agency vs OJT), preserves existing
  filenames as "retained" but clears only the flagged ones, sets _piaRevisionBanner from approver
  comments, then opens the form. Alerts on failure.

  PARAMS:
  - reqId: the returned request's id.

  RETURNS:
  Nothing (async navigation).
*/
function fetchReturnedApplicationFromDB(reqId) {
  google.script.run
    .withSuccessHandler(res => {
      hideLoading();
      if (res.ok) {
        state.isEditing = true;
        state.sessionId = reqId;
        
        const s = res.application.metadata || {};
        state.approverFlags = res.application.approverFlags || {};

        // Detect existing files from previous submission.
        // In revision mode: preserve filenames so they display as "retained".
        // Only clear filenames for files that are flagged by the approver.
        const filesList = res.application.files || [];
        const mainFileName  = filesList.find(f => f.type === 'NDA' || f.type === 'CU' || f.type === 'DPA')?.name || '';
        const dsaFileName   = filesList.find(f => f.type === 'DSA')?.name || '';
        const endorseFileName = filesList.find(f => f.type === 'ENDORSEMENT')?.name || '';

        state.dcs = {
          name: s.name || '',
          location: s.location || '',
          dept: s.dept || '',
          access: s.access || '',
          ihelp: s.ihelp || '',
          immHeadName: s.immHeadName || '',
          immHeadEmail: s.immHeadEmail || '',
          deptHeadName: s.deptHeadName || '',
          deptHeadEmail: s.deptHeadEmail || '',
          divHeadName: s.divHeadName || '',
          divHeadEmail: s.divHeadEmail || '',
          accountable: s.accountable || {},
          isAgency: !!(res.application.metadataAgency && res.application.metadataAgency.agencyName),
          isOJT: !!(res.application.metadataAgency && res.application.metadataAgency.type === 'OJT'),
          _hadFiles: false, // Revision mode: no global re-upload block; per-file flags handle this
          nda: mainFileName,   // Preserved, will be cleared below only if flagged
          dsa: dsaFileName,
          agency: (res.application.metadataAgency && (res.application.metadataAgency.agencyName || res.application.metadataAgency.type === 'OJT')) ? res.application.metadataAgency : {
            agencyName: '', agencyPersonnel: '', contractStartDate: '',
            endorsementLetter: endorseFileName, // Preserved, will be cleared below only if flagged
            networkDrive: '',
            immHeadRecoveryEmail: '', immHeadRecoveryNumber: ''
          }
        };

        // In revision mode, only clear filenames for files that are flagged by the approver.
        // Non-flagged files are retained, the backend will keep the existing Drive file.
        if (isFileFlaggedForRevision('dcs-nda')) {
          state.dcs.nda = '';
        }
        if (isFileFlaggedForRevision('dcs-dsa')) {
          state.dcs.dsa = '';
        }
        if (isFileFlaggedForRevision('dcs-agency-endorsement') && state.dcs.agency) {
          state.dcs.agency.endorsementLetter = '';
        }

        const approverComments = res.application.approverComments || '';

        state._piaRevisionBanner = approverComments;
        show('form');
        renderForm();
      } else {
        showCustomAlert('Failed to load application: ' + res.message, 'danger');
      }
    })
    .withFailureHandler(err => {
      hideLoading();
      showCustomAlert('Error loading application: ' + err.message, 'danger');
    })
    .apiGetReturnedApplication(reqId);
}

// ===================================================
// BOOT
// ===================================================
/*
  Function Name: boot

  LAYMAN:
  Runs once when the page loads. It pulls the system config (template links, domain) and the
  signed-in user's email from the server, then shows the landing screen. The greeting appears as
  soon as the identity comes back.

  TECHNICAL:
  Calls apiGetSystemConfig() -> state.config (re-renders guide if active) and getUserIdentity() ->
  state.userEmail (re-renders form/landing so greetingLine() populates). Then sets currentScreen to
  'landing' and renders/shows it. Invoked from the window 'load' listener, which also wires the
  global input/change autosave handlers.

  PARAMS:
  - (none)

  RETURNS:
  Nothing (async boot side-effects).
*/
function boot() {
  // Initialize at Landing screen.
  // Drafts are retrieved from the server via the "Proceed to Form" flow.
  if (typeof google !== 'undefined') {
    google.script.run.withSuccessHandler(res => {
      if (res.ok) {
        state.config = res.config;
        if (state.currentScreen === 'guide') renderGuide();
      }
    }).apiGetSystemConfig();

    // Fetch the signed-in user's identity (email only) to personalize the greeting.
    google.script.run.withSuccessHandler(res => {
      if (res && res.email) {
        state.userEmail = res.email;
        // Re-render the active screen so the greeting appears once identity loads.
        if (state.currentScreen === 'form') renderForm();
        else if (state.currentScreen === 'landing') renderLanding();
      }
    }).getUserIdentity();
  }
  state.currentScreen = 'landing';
  renderLanding();
  show('landing');

  // Deep-link: an email "View DCS Submission" link opens this app with ?parentID=<DCS ReqID>.
  // Read it the sandbox-safe way (google.script.url.getLocation, no server-side templating needed)
  // and jump straight to that request's details instead of leaving the user on the landing screen.
  if (typeof google !== 'undefined' && google.script && google.script.url) {
    google.script.url.getLocation(function(location) {
      var reqId = (location && location.parameter && location.parameter.parentID)
        ? String(location.parameter.parentID).trim() : '';
      if (reqId && /^DCS-\d+$/i.test(reqId)) {
        viewRequestDetails(reqId);
      }
    });
  }
}

window.addEventListener('load', () => {
  boot();
  document.addEventListener('input', triggerAutoSave);
  document.addEventListener('change', triggerAutoSave);
});
</script>
