// --- Revision Mode: File Flag Helpers -----------------------------------
/*
  Function Name: isFileFlaggedForRevision
  LAYMAN: Was this uploaded file (NDA/DSA/Endorsement) flagged by the approver during a
          return? Only meaningful when the user is revising a returned application.
  TECHNICAL: Returns false unless state.isEditing; otherwise !!getFlagMessage(fileKey).
  PARAMS:
  - fileKey: the file's flag key (e.g. 'dcs-nda', 'dcs-dsa', 'dcs-agency-endorsement').
  RETURNS: boolean.
*/
function isFileFlaggedForRevision(fileKey) {
  if (!state.isEditing) return false;
  return !!getFlagMessage(fileKey);
}

/*
  Function Name: getFileFlagMessage
  LAYMAN: The approver's note about a flagged file, shown above its upload card.
  TECHNICAL: '' unless state.isEditing; otherwise getFlagMessage(fileKey).
  PARAMS:
  - fileKey: the file's flag key.
  RETURNS: The note string, or ''.
*/
function getFileFlagMessage(fileKey) {
  if (!state.isEditing) return '';
  return getFlagMessage(fileKey);
}

/*
  Function Name: getFlaggedSupplementaryFiles
  LAYMAN: During a revision, which of the extra "Additional Supporting Documents" did the approver
          flag, and why? Returns each flagged file's name plus the approver's note.
  TECHNICAL: Scans state.approverFlags for keys with the 'DCS - Additional Supporting Document: '
             prefix (one key per flagged file, filename embedded in the key). Only meaningful in
             revision mode; returns [] otherwise.
  PARAMS: (none)
  RETURNS: Array of { filename, reason } (possibly empty).
*/
function getFlaggedSupplementaryFiles() {
  if (!state.isEditing || !state.approverFlags) return [];
  const PREFIX = 'DCS - Additional Supporting Document: ';
  const out = [];
  for (const key in state.approverFlags) {
    if (key.indexOf(PREFIX) === 0) {
      out.push({ filename: key.slice(PREFIX.length), reason: String(state.approverFlags[key] || '') });
    }
  }
  return out;
}

/*
  Function Name: isFileRetainedInRevision
  LAYMAN: During a revision, should we keep the previously uploaded file as-is (no re-upload
          needed)? Yes when the file existed before AND the approver did not flag it.
  TECHNICAL: false unless state.isEditing; otherwise fileExists && !isFileFlaggedForRevision(fileKey).
  PARAMS:
  - fileKey: the file's flag key.
  - fileExists: whether a file of this type existed in the prior submission.
  RETURNS: boolean.
*/
function isFileRetainedInRevision(fileKey, fileExists) {
  if (!state.isEditing) return false;
  return fileExists && !isFileFlaggedForRevision(fileKey);
}

/*
  Function Name: hasPendingFlaggedFiles

  LAYMAN:
  In revision mode, checks whether any file the approver flagged still hasn't been re-uploaded.
  If true, the user can't submit yet.

  TECHNICAL:
  false unless state.isEditing. Inspects the three upload inputs (#dcs-main, #dcs-dsa,
  #dcs-agency-endorsement) and returns true if a flagged file has no file selected. DSA is
  only checked when access === 'External'; endorsement only when state.dcs.isAgency.

  PARAMS:
  - (none)

  RETURNS:
  true if at least one flagged file is still missing its re-upload, else false.
*/
function hasPendingFlaggedFiles() {
  if (!state.isEditing) return false;
  
  // Check main document (NDA/DPA/CU)
  const ndaInput = document.getElementById('dcs-main');
  if (isFileFlaggedForRevision('dcs-nda') && (!ndaInput || !ndaInput.files || ndaInput.files.length === 0)) {
    return true;
  }
  
  // Check DSA
  if (state.dcs.access === 'External') {
    const dsaInput = document.getElementById('dcs-dsa');
    if (isFileFlaggedForRevision('dcs-dsa') && (!dsaInput || !dsaInput.files || dsaInput.files.length === 0)) {
      return true;
    }
  }
  
  // Check endorsement letter
  if (state.dcs.isAgency) {
    const endorseInput = document.getElementById('dcs-agency-endorsement');
    if (isFileFlaggedForRevision('dcs-agency-endorsement') && (!endorseInput || !endorseInput.files || endorseInput.files.length === 0)) {
      return true;
    }
  }
  
  return false;
}

// --- Person Name Validation -----------------------------------
/*
  Function Name: validatePersonName

  LAYMAN:
  Cleans up what someone types into a name field as they type, drops symbols that never
  belong in a name and pulls out any pasted email address. Keeps spaces so typing feels natural.

  TECHNICAL:
  Used inline on name inputs' oninput. Strips a fixed set of special characters, optionally
  strips digits (alphaOnly), and removes any email-like substring. Does NOT trim, so the caret
  doesn't jump while typing.

  PARAMS:
  - value: the raw input value.
  - alphaOnly: if true, also remove all digits (default false).

  RETURNS:
  The cleaned name string (whitespace preserved).
*/
function validatePersonName(value, alphaOnly = false) {
  if (!value) return '';
  // Remove characters that are never valid in person names
  let cleaned = String(value).replace(/[@#$%^&*()_+={}|\[\]\\:;"'<>,~`]/g, '');
  // If alphaOnly mode, strip all digits
  if (alphaOnly) {
    cleaned = cleaned.replace(/[0-9]/g, '');
  }
  // Detect and reject email addresses in name fields
  if (/[^\s@]+@[^\s@]+\.[^\s@]+/.test(cleaned)) {
    // Strip the email-like portion
    cleaned = cleaned.replace(/[^\s@]+@[^\s@]+\.[^\s@]+\s*/g, '');
  }
  // Preserve whitespace (don't trim) so the user can type naturally
  return cleaned;
}

/*
  Function Name: charLimit
  LAYMAN: Renders a faint "≤75" style hint appended to a field label.
  TECHNICAL: Returns a styled <span> showing the max length.
  PARAMS:
  - max: the maximum character count to display.
  RETURNS: HTML string.
*/
// Subtle character limit hint (appended to labels)
function charLimit(max) {
  return `<span style="font-weight:400;color:var(--text3);font-size:10px;margin-left:6px;">≤${max}</span>`;
}

/*
  Function Name: reqMark
  LAYMAN: Renders the small red "*" that marks a field as required (same element used in PIA/Admin).
  TECHNICAL: Returns an aria-hidden red asterisk span; the input keeps its own validation.
  PARAMS: (none)  RETURNS: HTML string.
*/
function reqMark() {
  return '<span aria-hidden="true" style="color:var(--danger-text)" title="Required">*</span>';
}

// --- Sanitization -----------------------------------
/*
  Function Name: sanitizeText
  LAYMAN: Light cleanup of free text before we store/send it, removes angle brackets and
          obvious script-injection bits, then caps the length. Deliberately gentle so names
          like "O'Connor" survive intact (escaping happens at render time via escapeHtml).
  TECHNICAL: Returns '' for non-strings. Strips < >, NUL, "javascript:" and inline "on*="
             handlers, trims, then slices to maxLength.
  PARAMS:
  - value: the input string.
  - maxLength: max length cap (default 5000).
  RETURNS: The cleaned, length-capped string.
*/
function sanitizeText(value, maxLength = 5000) {
  if (typeof value !== 'string') return '';
  // Keep sanitization minimal to avoid corrupting text inputs like "O'Connor". 
  // Rely on `escapeHtml()` during rendering rather than stripping characters at inputs.
  return value.replace(/[<>]/g, '').replace(/\u0000/g, '')
    .replace(/javascript:/gi, '').replace(/on\w+\s*=/gi, '')
    .trim().slice(0, maxLength);
}

/*
  Function Name: isValidEmail
  LAYMAN: True if the text looks like a real email and isn't absurdly long.
  TECHNICAL: Tests local@domain.tld with a simple regex and enforces MAX_EMAIL_LENGTH.
  PARAMS:
  - email: the candidate email string.
  RETURNS: boolean.
*/
// Email validation helper (RFC-ish compliant)
function isValidEmail(email) {
  if (!email || typeof email !== 'string') return false;
  const trimmed = email.trim();
  // Basic RFC pattern: local@domain.tld
  const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  return pattern.test(trimmed) && trimmed.length <= CONFIG.MAX_EMAIL_LENGTH;
}

/*
  Function Name: getCorporateDomain
  LAYMAN: The company email domain that head emails must use.
  TECHNICAL: Reads state.config.DOMAIN, falling back to 'megaworldcorp.com'.
  PARAMS: (none)
  RETURNS: The domain string.
*/
// Returns the corporate domain from server config, with a fallback
function getCorporateDomain() {
  return (state.config && state.config['DOMAIN']) || 'megaworldcorp.com';
}

/*
  Function Name: isValidHeadEmail
  LAYMAN: Approver (head) emails must be company addresses, this checks the domain.
  TECHNICAL: Lowercases/trims and requires the address to end with '@' + getCorporateDomain().
             Always enforced for Immediate/Dept/Division head emails.
  PARAMS:
  - email: the head's email.
  RETURNS: boolean.
*/
// Head email domain check (Immediate, Dept, Div Heads only)
// Always enforced. Domain is fetched from the server config (DOMAIN key)
// for consistency with the rest of the system.
function isValidHeadEmail(email) {
  if (!email || typeof email !== 'string') return false;
  const trimmed = email.trim().toLowerCase();
  const domain = getCorporateDomain();
  return trimmed.endsWith('@' + domain);
}

/*
  Function Name: validateDCSForm

  LAYMAN:
  The gatekeeper for Section 2. Before you can move on, this walks every field and complains
  (with a red toast) about the first problem it finds, missing required field, bad email,
  non-company head email, numbers-only iHelp, too-long values, no accountable person, etc.,
  and focuses that field so you can fix it.

  TECHNICAL:
  Reads inputs straight from the DOM by FORM_FIELDS ids. Validates required fields, email
  format (isValidEmail), head-email domain (isValidHeadEmail), whitespace-only input, and
  length caps. Then validates the accountable rows (>=1, both name+email, valid emails) and
  the optional Division Head email's format/domain. Returns on the FIRST failure.

  PARAMS:
  - (none), reads live DOM values.

  RETURNS:
  true if every check passes; false (after showing a toast + focusing the field) on the first
  failure.

  STEPS
    Step 1: Required core fields: presence, no-spaces, email format, head domain, iHelp digits, length.
    Step 2: Accountable rows: at least one, each with valid name + email.
    Step 3: Optional fields (location-other, div head name/email): reject spaces-only; validate div email if given.
*/
// Form validation
function validateDCSForm() {
  const requiredFields = [
    ['name', 'Full name'],
    ['location', 'Office Location / Site'],
    ['dept', 'Department'],
    ['access', 'Access type'],
    ['ihelp', 'iHelp Reference'],
    ['immHeadName', 'Immediate Head name'],
    ['immHeadEmail', 'Immediate Head email'],
    ['deptHeadName', 'Department Head name'],
    ['deptHeadEmail', 'Department Head email']
  ];
  
  for (const [field, label] of requiredFields) {
    const el = document.getElementById(FORM_FIELDS[field].id);
    const value = el?.value?.trim() || '';
    
    if (!value) {
      showCustomAlert(`${label} is required.`, 'danger');
      el?.focus();
      return false;
    }
    
    // Reject whitespace-only input (non-empty after trim check already caught empty)
    if (el?.value && el.value.trim() === '' && el.value.length > 0) {
      showCustomAlert(`${label} cannot be only spaces.`, 'danger');
      el?.focus();
      return false;
    }
    
    // Special validation for email fields
    if (field.includes('Email')) {
      if (!isValidEmail(value)) {
        showCustomAlert(`${label} must be a valid email address.`, 'danger');
        el?.focus();
        return false;
      }
    }
    
    // Head domain check for Immediate Head, Dept Head, Div Head emails
    if (field.includes('HeadEmail')) {
      if (!isValidHeadEmail(value)) {
        showCustomAlert(`${label} must be an @${getCorporateDomain()} email address.`, 'danger');
        el?.focus();
        return false;
      }
    }
    
    // Validate iHelp Reference (numbers only)
    if (field === 'ihelp' && value && !/^\d+$/.test(value)) {
      showCustomAlert(`${label} must contain only numbers.`, 'danger');
      el?.focus();
      return false;
    }


    // Length checks
    if (field.includes('Email') && value.length > CONFIG.MAX_EMAIL_LENGTH) {
      showCustomAlert(`${label} is too long (max ${CONFIG.MAX_EMAIL_LENGTH} characters).`, 'danger');
      return false;
    }
    if (!field.includes('Email') && value.length > CONFIG.MAX_NAME_LENGTH) {
      showCustomAlert(`${label} is too long (max ${CONFIG.MAX_NAME_LENGTH} characters).`, 'danger');
      return false;
    }
  }
  
  const accRows = document.querySelectorAll('.accountable-row');
  if (accRows.length === 0) {
    showCustomAlert('Please add at least 1 Accountable Person/Entity.', 'danger');
    document.getElementById('add-accountable-btn')?.focus();
    return false;
  }
  for (let i = 0; i < accRows.length; i++) {
    const nameInput = accRows[i].querySelector('.acc-name');
    const emailInput = accRows[i].querySelector('.acc-email');
    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    if (!name || !email) {
      showCustomAlert('Please fill in both name and email for all accountable persons.', 'danger');
      (name ? emailInput : nameInput).focus();
      return false;
    }
    if (!isValidEmail(email)) {
      showCustomAlert(`Invalid email address for accountable person: ${name}`, 'danger');
      emailInput.focus();
      return false;
    }
  }

  // Validate whitespace-only optional fields (divHeadName, divHeadEmail)
  const optionalTextIds = ['dcs-div-head-name', 'dcs-div-head-email'];
  for (const id of optionalTextIds) {
    const el = document.getElementById(id);
    if (el && el.value && el.value.trim() === '') {
      showCustomAlert(`${el.labels?.[0]?.textContent?.trim() || 'This field'} cannot be only spaces.`, 'danger');
      el.focus();
      return false;
    }
  }
  
  // Validate optional Division Head email domain if provided
  const divEmailEl = document.getElementById(FORM_FIELDS.divHeadEmail.id);
  const divEmailValue = divEmailEl?.value?.trim() || '';
  if (divEmailValue) {
    if (!isValidEmail(divEmailValue)) {
      showCustomAlert('Division Head email must be a valid email address.', 'danger');
      divEmailEl?.focus();
      return false;
    }
    if (!isValidHeadEmail(divEmailValue)) {
      showCustomAlert(`Division Head email must be an @${getCorporateDomain()} email address.`, 'danger');
      divEmailEl?.focus();
      return false;
    }
  }

  return true;
}

/*
  Function Name: checkGuideRequirements
  LAYMAN: Enables the "Proceed to Form" button only once the Terms & Conditions box is ticked.
  TECHNICAL: Sets #proceed-btn.disabled based on the #terms-agree-checkbox checked state.
  PARAMS: (none)
  RETURNS: Nothing (toggles button state).
*/
// Guide validation
function checkGuideRequirements() {
  const termsCb = document.getElementById('terms-agree-checkbox');
  const proceedBtn = document.getElementById('proceed-btn');
  if (!proceedBtn) return;
  
  proceedBtn.disabled = !(termsCb && termsCb.checked);
}

/*
  Function Name: formatStatusLabel
  LAYMAN: Turns a raw status code (e.g. "approved by ism") into a nicely cased display label.
  TECHNICAL: Lowercase/trim, then map known literal statuses to friendly strings; unknown
             values pass through unchanged.
  PARAMS:
  - status: the raw status string.
  RETURNS: A display-ready label string.
*/
function formatStatusLabel(status) {
  const s = String(status || '').toLowerCase().trim();
  // Using EXACT literal strings from the system
  if (s === 'pending') return 'Pending';
  if (s === 'approved') return 'Approved';
  if (s === 'returned') return 'Returned';
  if (s === 'denied') return 'Denied';
  if (s === 'escalated to division head') return 'Escalated to Division Head';
  if (s === 'approved by ism') return 'Approved by ISM';
  if (s === 'rejected by ism') return 'Rejected by ISM';
  if (s === 'draft') return 'Draft';
  if (s === 'editing') return 'Editing';
  if (s === 'complete') return 'Complete';
  // Fallback
  return String(status || '');
}

/*
  Function Name: getCombinedStatusBadge

  LAYMAN:
  A request lives across two phases (DCS, then PIA). This decides the single badge + short
  description that best sums up where it stands right now, e.g. "Pending Immediate Head",
  "Ready for Phase 2 (PIA)", "Fully Certified", "Rejected by ISM".

  TECHNICAL:
  Lowercases both statuses and resolves precedence: terminal/early DCS states first
  (pending/returned/denied/escalated/approved-by-ism/rejected-by-ism); once DCS is
  approved/complete it switches to interpreting piaStatus. Each branch calls the local
  makeBadge() helper to emit a .status-badge + description block.

  PARAMS:
  - dcsStatus: the DCS phase status string.
  - piaStatus: the PIA phase status string (may be blank if PIA hasn't started).

  RETURNS:
  HTML string: a status badge paired with a one-line description.
*/
function getCombinedStatusBadge(dcsStatus, piaStatus) {
  const dcs = String(dcsStatus || '').toLowerCase().trim();
  const pia = String(piaStatus || '').toLowerCase().trim();

  const makeBadge = (className, label, desc, inlineStyle = '') => {
    const style = inlineStyle ? `style="${inlineStyle}"` : '';
    const classes = className ? `class="status-badge ${className}"` : 'class="status-badge"';
    return `<div class="combined-badge-container">
              <span ${classes} ${style}>${label}</span>
              <span>${desc}</span>
            </div>`;
  };

  // Exact literal status checks
  if (dcs === 'pending') return makeBadge('status-pending', 'Pending Immediate Head', 'Awaiting initial review');
  if (dcs === 'returned') return makeBadge('status-returned', 'DCS Returned', 'Requires revision in Phase 1');
  if (dcs === 'denied') return makeBadge('status-denied', 'DCS Denied', 'Application was rejected');
  if (dcs === 'escalated to division head') return makeBadge('status-escalated', 'Escalated to Division Head', 'Requires Division Head approval');
  if (dcs === 'approved by ism') return makeBadge('status-approved', 'Fully Certified', 'Application process is complete');
  if (dcs === 'rejected by ism') return makeBadge('status-denied', 'Rejected by ISM', 'Application rejected by InfoSec');

  // Handle progression to PIA
  if (dcs === 'approved' || dcs === 'complete') {
    if (!pia || pia === '') {
      return makeBadge('status-processing', 'Ready for Phase 2 (PIA)', 'Please proceed to PIA assessment');
    }
    if (pia === 'pending') {
      return makeBadge('status-pending', 'PIA In Progress', 'Awaiting Phase 2 approval');
    }
    if (pia === 'returned') {
      return makeBadge('status-returned', 'PIA Returned', 'Requires revision in Phase 2');
    }
    if (pia === 'denied') {
      return makeBadge('status-denied', 'PIA Denied', 'Application was rejected in PIA');
    }
    if (pia === 'approved') {
      return makeBadge('status-submitted', 'PIA Heads Approved', 'Awaiting ISM review');
    }
    if (pia === 'approved by ism' || pia === 'complete') {
      return makeBadge('status-approved', 'Fully Certified', 'Application process is complete');
    }
    if (pia === 'rejected by ism') {
      return makeBadge('status-denied', 'Rejected by ISM', 'Application rejected by InfoSec');
    }
    if (pia === 'escalated to division head') {
      return makeBadge('status-escalated', 'Escalated to Division Head', 'Requires Division Head approval');
    }
    
    return makeBadge('status-info', `PIA: ${formatStatusLabel(piaStatus)}`, 'In Progress');
  }

  return makeBadge('status-info', formatStatusLabel(dcsStatus), 'In Progress');
}

/*
  Function Name: getDetailedDcsSummaryCardHtml

  LAYMAN:
  Builds the collapsible "DCS Request: <Name> (<id>)" card on the request-details screen that
  lists everything submitted, profile, accountables, approvers, documents, and remarks.

  TECHNICAL:
  Returns a <details open> card composed of summaryRow() rows. Accountables are read from
  s.accountable[`accountableName/Email${i}`] (1..5). All values are escaped by summaryRow().

  PARAMS:
  - s: the request metadata object.
  - reqId: the request id (shown in the header).
  - ndaFile: display name for the NDA/DPA/CU file.
  - dsaFile: display name for the DSA file.
  - remarks: approver remarks (falls back to "No remarks.").

  RETURNS:
  HTML string for the collapsible summary card.
*/
// Helper function for the detailed DCS Submission Summary card
function getDetailedDcsSummaryCardHtml(s, reqId, ndaFile, dsaFile, endorsementFile, remarks, supplementaryHtml, supersededHtml) {
  return `
    <details open class="card" style="padding: 0; border: none; background: transparent;">
      <summary style="font-weight: 600; color: var(--text); cursor: pointer; padding: 1rem 1.25rem; border: 1px solid var(--border); border-radius: var(--radius-lg); list-style: none; display: flex; justify-content: space-between; align-items: center; background: var(--bg);">
        <span>DCS Request: ${escapeHtml(s.name || 'Untitled')} (${escapeHtml(reqId)})</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text3);">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </summary>
      <div class="card" style="margin-top: -1px; border-top-left-radius: 0; border-top-right-radius: 0; border-top-color: transparent; display: grid; gap: 1.25rem;">
        <div class="summary-section">
          <h3>Profile &amp; Access</h3>
          ${summaryRow('Name', s.name)}
          ${summaryRow('Office/Site', s.location)}
          ${summaryRow('Department', s.dept)}
          ${summaryRow('Access Type', s.access)}
          ${summaryRow('iHelp Ref', s.ihelp)}
        </div>
        <div class="summary-section">
          <h3>Accountable Person/Entities</h3>
          ${(() => {
            let rows = '';
            for (let i = 1; i <= 5; i++) {
              const n = s.accountable[`accountableName${i}`];
              const e = s.accountable[`accountableEmail${i}`];
              if (n || e) rows += summaryRow(n || 'N/A', e || 'N/A');
            }
            return rows || '<div style="font-size:12px;color:var(--text3);padding:8px 0;">None specified.</div>';
          })()}
        </div>
        <div class="summary-section">
          <h3>Approver Information</h3>
          ${summaryRow('Immediate Head Name', s.immHeadName)}
          ${summaryRow('Immediate Head Email', s.immHeadEmail)}
          ${summaryRow('Department Head Name', s.deptHeadName)}
          ${summaryRow('Department Head Email', s.deptHeadEmail)}
          ${s.divHeadName ? summaryRow('Division Head Name', s.divHeadName) : ''}
          ${s.divHeadEmail ? summaryRow('Division Head Email', s.divHeadEmail) : ''}
        </div>
        <div class="summary-section">
          <h3>Documents</h3>
          ${summaryRowRaw('NDA/DPA/CU File', ndaFile)}
          ${summaryRowRaw('DSA File', dsaFile)}
          ${endorsementFile ? summaryRowRaw('Endorsement Letter', endorsementFile) : ''}
          ${supplementaryHtml ? summaryRowRaw('Additional Supporting Documents', supplementaryHtml) : ''}
          ${supersededHtml ? summaryRowRaw('Previous Versions (superseded)', supersededHtml) : ''}
        </div>
        <div class="summary-section">
          <h3>Remarks</h3>
          ${summaryRow('Approver Remarks', remarks || 'No remarks.')}
        </div>
      </div>
    </details>
  `;
}

/*
  Function Name: renderPiaTimeline

  LAYMAN:
  The big horizontal "Overall Progress Timeline" with 4 stops: DCS Request → PIA Assessment →
  ISM Approval → Certification. Each stop lights up (upcoming / in-progress / done / returned /
  denied) based on the request's DCS and PIA status, with a short explanation under each.

  TECHNICAL:
  Derives lowercase dcs/pia statuses. Step 1 reflects the DCS state. The request is treated as
  "DCS cleared" for a fixed set of statuses; only then do steps 2–4 advance. Returned/denied
  states surface the approver comment. Emits a <details open> card containing the
  .horizontal-timeline (which collapses to vertical on mobile via CSS).

  PARAMS:
  - data: request object: { status, piaStatus, approverComments|remarks, ... }.

  RETURNS:
  HTML string for the progress timeline card.

  STEPS
    Step 1: DCS Request stop: done/returned/denied/active from the DCS status.
    Step 2: PIA Assessment: action-required / in-progress / returned / denied / done, gated on DCS cleared.
    Step 3: ISM Approval: advances only once PIA heads are done (approved/escalated/ism states).
    Step 4: Certification: marked certified once ISM approves/completes.
*/
function renderPiaTimeline(data) {
  const dcsLower = String(data.status || '').toLowerCase().trim();
  const piaLower = String(data.piaStatus || '').toLowerCase().trim();
  const comments = data.approverComments || data.remarks || '';

  // Step 1: DCS Request
  let step1Class = 'done';
  let step1Sub = '<span class="status-badge status-approved">Completed</span>';
  let step1Comment = 'The Privacy Impact Assessment request has been completed.';

  if (dcsLower === 'returned') {
     step1Class = 'rejected';
     step1Sub = '<span class="status-badge status-returned">Returned</span>';
     step1Comment = comments ? `Requires revision: "${escapeHtml(comments)}"` : 'The application was returned and requires revision.';
  } else if (dcsLower === 'denied') {
     step1Class = 'denied';
     step1Sub = '<span class="status-badge status-denied">Denied</span>';
     step1Comment = comments ? `Denied: "${escapeHtml(comments)}"` : 'The application was denied by the Immediate Head.';
  } else if (dcsLower === 'pending') {
     step1Class = 'active';
     step1Sub = '<span class="status-badge status-pending">In Progress</span>';
     step1Comment = 'Awaiting Immediate Head approval.';
  }

  // Step 2: PIA Assessment (the requester submits the PIA)
  let step2Class = '';
  let step2Sub = '<span class="status-badge" style="background: var(--bg3); color: var(--text2);">Upcoming</span>';
  let step2Comment = 'Complete DCS Phase 1 to unlock Phase 2.';

  // Step 3: Heads Approval (Immediate / Department Head)  [#11, distinct stage]
  let stepHClass = '';
  let stepHSub = '<span class="status-badge" style="background: var(--bg3); color: var(--text2);">Upcoming</span>';
  let stepHComment = 'Awaiting Immediate Head / Department Head approval.';

  // Step 4: ISM Approval
  let step3Class = '';
  let step3Sub = '<span class="status-badge" style="background: var(--bg3); color: var(--text2);">Upcoming</span>';
  let step3Comment = 'The request will undergo review by InfoSec (ISM).';

  // Step 5: Certification
  let step4Class = '';
  let step4Sub = '<span class="status-badge" style="background: var(--bg3); color: var(--text2);">Upcoming</span>';
  let step4Comment = 'Final certification and approval.';

  const isDcsCleared = ['approved', 'complete', 'approved by ism', 'rejected by ism', 'escalated to division head'].includes(dcsLower);

  if (isDcsCleared) {
    if (!piaLower || piaLower === '') {
      // PIA not yet started
      step2Class = 'active';
      step2Sub = '<span class="status-badge status-pending">Action Required</span>';
      step2Comment = 'Please proceed to Phase 2 (PIA) to continue your application.';
    } else {
      // PIA has been submitted
      step2Class = 'done';
      step2Sub = '<span class="status-badge status-submitted">Submitted</span>';
      step2Comment = 'Your Privacy Impact Assessment has been submitted.';

      // Heads Approval stage
      if (piaLower === 'pending') {
        stepHClass = 'active';
        stepHSub = '<span class="status-badge status-pending">In Progress</span>';
        stepHComment = 'Awaiting approvals from your Immediate Head / Department Head.';
      } else if (piaLower === 'returned') {
        stepHClass = 'rejected';
        stepHSub = '<span class="status-badge status-returned">Returned</span>';
        stepHComment = comments ? `Returned: "${escapeHtml(comments)}"` : 'The application was returned and requires revision.';
      } else if (piaLower === 'denied') {
        stepHClass = 'denied';
        stepHSub = '<span class="status-badge status-denied">Denied</span>';
        stepHComment = comments ? `Denied: "${escapeHtml(comments)}"` : 'The application was denied.';
      } else {
        // approved, escalated to division head, approved by ism, rejected by ism, complete → heads done
        stepHClass = 'done';
        stepHSub = '<span class="status-badge status-approved">Approved</span>';
        stepHComment = 'Immediate Head / Department Head approvals are complete.';

        // ISM Approval stage
        if (piaLower === 'approved') {
          step3Class = 'active';
          step3Sub = '<span class="status-badge status-pending">In Progress</span>';
          step3Comment = 'Awaiting review by the InfoSec (ISM) team.';
        } else if (piaLower === 'escalated to division head') {
          step3Class = 'active';
          step3Sub = '<span class="status-badge" style="background:#eff6ff;color:#1e40af;border:none;">Escalated</span>';
          step3Comment = 'Escalated to Division Head for review.';
        } else if (piaLower === 'rejected by ism') {
          step3Class = 'denied';
          step3Sub = '<span class="status-badge status-denied">Rejected</span>';
          step3Comment = comments ? `Rejected by InfoSec: "${escapeHtml(comments)}"` : 'Rejected by the InfoSec team.';
        } else if (piaLower === 'approved by ism' || piaLower === 'complete') {
          step3Class = 'done';
          step3Sub = '<span class="status-badge status-approved">Approved</span>';
          step3Comment = 'The application has been approved by InfoSec.';

          // Certification stage
          step4Class = 'done';
          step4Sub = '<span class="status-badge status-approved">Certified</span>';
          step4Comment = '<strong>Please check your email</strong> for your generated certification.';
        }
      }
    }
  }

  return `
    <div class="card">
      <details open>
        <summary style="font-weight: 600; color: var(--text); cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;">
          <span class="card-title" style="margin-bottom: 0; color: var(--text);">Overall Progress Timeline</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text3);">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </summary>
        <div class="horizontal-timeline" role="list">
          <div class="horizontal-timeline-item">
            <div class="horizontal-timeline-dot ${step1Class}" aria-hidden="true"></div>
            <div class="horizontal-timeline-content">
              <div class="horizontal-timeline-title">DCS Request</div>
              <div class="horizontal-timeline-sub">${step1Sub}</div>
              <div class="horizontal-timeline-comment">${step1Comment}</div>
            </div>
          </div>
          <div class="horizontal-timeline-item">
            <div class="horizontal-timeline-dot ${step2Class}" aria-hidden="true"></div>
            <div class="horizontal-timeline-content">
              <div class="horizontal-timeline-title">PIA Assessment</div>
              <div class="horizontal-timeline-sub">${step2Sub}</div>
              <div class="horizontal-timeline-comment">${step2Comment}</div>
            </div>
          </div>
          <div class="horizontal-timeline-item">
            <div class="horizontal-timeline-dot ${stepHClass}" aria-hidden="true"></div>
            <div class="horizontal-timeline-content">
              <div class="horizontal-timeline-title">Heads Approval</div>
              <div class="horizontal-timeline-sub">${stepHSub}</div>
              <div class="horizontal-timeline-comment">${stepHComment}</div>
            </div>
          </div>
          <div class="horizontal-timeline-item">
            <div class="horizontal-timeline-dot ${step3Class}" aria-hidden="true"></div>
            <div class="horizontal-timeline-content">
              <div class="horizontal-timeline-title">ISM Approval</div>
              <div class="horizontal-timeline-sub">${step3Sub}</div>
              <div class="horizontal-timeline-comment">${step3Comment}</div>
            </div>
          </div>
          <div class="horizontal-timeline-item">
            <div class="horizontal-timeline-dot ${step4Class}" aria-hidden="true"></div>
            <div class="horizontal-timeline-content">
              <div class="horizontal-timeline-title">Certification</div>
              <div class="horizontal-timeline-sub">${step4Sub}</div>
              <div class="horizontal-timeline-comment">${step4Comment}</div>
            </div>
          </div>
        </div>
      </details>
    </div>
  `;
}

/*
  Function Name: renderISMAndDivHeadTracker

  LAYMAN:
  The vertical "ISM & DivHead Approval Tracker" card listing each InfoSec (ISM) reviewer and,
  if the request was escalated, each Division Head, with their decision badge, date, and any
  comment. If escalation never happened it shows "Not required for this application."

  TECHNICAL:
  Returns '' when there are no ISM or DivHead approvers. Uses a local buildItem() to render
  each row, computing an "effective status" (e.g. a pending row with a comment becomes
  'commented' or 'returned'; a pending row under overall-ISM-approval becomes 'approved').
  Escalation is detected from an ISM 'escalated to division head' decision or any DivHead rows.

  PARAMS:
  - data: request object with ismApprovers[], divHeadApprovers[], status, piaStatus, approverFlags.

  RETURNS:
  HTML string for the ISM/DivHead tracker card, or '' if there's nothing to show.
*/
function renderISMAndDivHeadTracker(data, innerOnly) {
  const ismApprovers = data.ismApprovers || [];
  const divHeadApprovers = data.divHeadApprovers || [];

  if (ismApprovers.length === 0 && divHeadApprovers.length === 0) return '';
  
  const dcsStatus = String(data.status || '').toUpperCase();
  const piaStatusLower = String(data.piaStatus || '').toLowerCase().trim();
  const isOverallIsmApproved = ['approved by ism', 'complete'].includes(piaStatusLower);

  let hasDcsFlags = false;
  if (data.approverFlags !== null && Object.keys(data.approverFlags).length > 0) {
    hasDcsFlags = true;
  }
  const isDcsReturned = dcsStatus === 'RETURNED';

  const buildItem = (a) => {
    const safeName = escapeHtml(a.name || a.email || a.role || 'Approver');
    const safeRole = escapeHtml(a.role || '');
    const safeComment = escapeHtml(a.comment || '');
    
    let cls = 'vertical-timeline-dot', badge = '';
    const statusOrDecision = String(a.status || a.decision || '').toLowerCase().trim();
    
    let effectiveStatus = statusOrDecision;
    if ((statusOrDecision === 'pending' || statusOrDecision === '') && safeComment !== '') {
        effectiveStatus = isDcsReturned ? 'returned' : 'commented';
    } else if ((statusOrDecision === 'pending' || statusOrDecision === '') && isOverallIsmApproved) {
        effectiveStatus = 'approved';
    }
    
    if (effectiveStatus === 'approved') {
      cls += ' done';     
      badge = '<span class="status-badge status-approved">Approved</span>'; 
    } else if (effectiveStatus === 'approved by ism') {
      cls += ' done';     
      badge = '<span class="status-badge status-approved">Approved by ISM</span>'; 
    } else if (effectiveStatus === 'denied') {
      cls += ' denied'; 
      badge = '<span class="status-badge status-denied">Denied</span>'; 
    } else if (effectiveStatus === 'rejected by ism') {
      cls += ' denied'; 
      badge = '<span class="status-badge status-denied">Rejected by ISM</span>'; 
    } else if (effectiveStatus === 'returned') {
      cls += ' rejected'; 
      badge = '<span class="status-badge status-returned">Returned</span>'; 
    } else if (effectiveStatus === 'escalated to division head') {
      cls += ' done';
      badge = '<span class="status-badge" style="background:#eff6ff;color:#1e40af;border:none;">Escalated to Division Head</span>';
    } else if (effectiveStatus === 'commented') {
      cls += ' active';
      badge = '<span class="status-badge status-pending">Commented</span>';
    } else if (effectiveStatus === 'pending' || effectiveStatus === '') {
      cls += ' active';   
      badge = '<span class="status-badge status-pending">Awaiting decision</span>'; 
    } else {
      cls += ' done';
      badge = '<span class="status-badge" style="background: var(--bg3); color: var(--text2);">' + escapeHtml(a.status || a.decision || 'Pending') + '</span>';
    }
    
    const safeDate = a.date ? formatTimestampDisplay(a.date) : '';
    return `<div class="vertical-timeline-item">
      <div class="${cls}" aria-hidden="true"></div>
      <div class="vertical-timeline-title">${safeName} <span style="font-weight:400;color:var(--text3);font-size:11px;">(${safeRole})</span></div>
      <div class="vertical-timeline-sub">${badge}${safeDate ? ` <span style="font-size:10px;color:var(--text3);margin-left:6px;">${safeDate}</span>` : ''}</div>
      ${safeComment ? `<div class="vertical-timeline-comment">"${safeComment}"</div>` : ''}
    </div>`;
  };

  const ismTimeline = ismApprovers.map(buildItem).join('');
  const isEscalated = ismApprovers.some(a => (a.status || a.decision || '').toLowerCase().trim() === 'escalated to division head') || divHeadApprovers.length > 0;
  
  let divHeadHtml = '';
  if (isEscalated) {
    if (divHeadApprovers.length > 0) {
      const divHeadTimeline = divHeadApprovers.map(a => buildItem(a)).join('');
      divHeadHtml = `
        <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px dashed var(--border);">
          <div class="card-title" style="margin-bottom: 12px; color: var(--navy-mid);">Division Head Escalation</div>
          <div class="vertical-timeline" role="list" style="margin-top: 0;">
            ${divHeadTimeline}
          </div>
        </div>
      `;
    } else {
      divHeadHtml = `
        <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px dashed var(--border);">
          <div class="card-title" style="margin-bottom: 8px; color: var(--navy-mid);">Division Head Escalation</div>
          <span class="status-badge status-pending">Awaiting Division Head assignment</span>
        </div>
      `;
    }
  } else {
    divHeadHtml = `
      <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px dashed var(--border);">
        <div class="card-title" style="margin-bottom: 8px; opacity: 0.6;">Division Head Escalation</div>
        <div style="font-size: 12px; color: var(--text3);">Not required for this application.</div>
      </div>
    `;
  }

  // Round-4: innerOnly returns the timeline content without its own card, so
  // renderUnifiedApprovalHistory can merge it with the heads chain into ONE card.
  if (innerOnly) {
    return `
        <div class="card-title" style="margin-bottom: 12px; color: var(--navy-mid);">ISM InfoSec Review</div>
        <div class="vertical-timeline" role="list" style="margin-top: 0;">
          ${ismTimeline}
        </div>
        ${divHeadHtml}
    `;
  }

  return `
    <div class="card">
      <details open>
        <summary style="font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;">
          <span class="card-title" style="margin-bottom: 0; color: #000000;">ISM & DivHead Approval Tracker</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text3);">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </summary>
        <div class="vertical-timeline" role="list">
          ${ismTimeline}
        </div>
        ${divHeadHtml}
      </details>
    </div>
  `;
}

/*
  Function Name: renderApprovalTracker

  LAYMAN:
  The vertical "Approval Workflow Tracker" showing the head-approval chain (Immediate Head →
  Dept Head → ...). Each person shows a badge (Approved / Returned / Denied / Escalated /
  Commented / Awaiting decision), the date, and any note. The current pending approver is
  highlighted as "Awaiting decision".

  TECHNICAL:
  Returns '' if there are no approvers. Computes overall denied/returned/approved flags from
  DCS+PIA status, finds the first still-pending approver (the active step), then maps each
  approver's decision to a badge + dot class, applying the same effective-status logic as the
  ISM tracker (pending+comment -> commented/returned; pending+overallApproved -> approved).

  PARAMS:
  - data: request object: { approvers[], status, piaStatus, piaDecision, timestamp, approverFlags }.

  RETURNS:
  HTML string for the approval tracker card, or '' if there are no approvers.
*/
function renderApprovalTracker(data, innerOnly) {
  const approvers = data.approvers || [];
  if (approvers.length === 0) return '';
  
  let hasDcsFlags = false;
  if (data.approverFlags !== null && Object.keys(data.approverFlags).length > 0) {
    hasDcsFlags = true;
  }

  const dcsStatusLower = String(data.status || '').toLowerCase().trim();
  const piaDecisionLower = String(data.piaDecision || '').toLowerCase().trim();
  const piaStatusLower = String(data.piaStatus || '').toLowerCase().trim();
  const isDenied = dcsStatusLower === 'denied' || (piaDecisionLower === 'deny');
  const isDcsReturned = dcsStatusLower === 'returned';
  const isRejected = isDcsReturned || (piaStatusLower === 'denied') || (piaStatusLower === 'returned');
  
  const isOverallApproved = ['approved', 'escalated to division head', 'approved by ism', 'rejected by ism', 'complete'].includes(piaStatusLower);
  
  let step = approvers.findIndex(a => {
    const dec = String(a.decision || '').toLowerCase().trim();
    const hasComment = (a.comment || '').trim() !== '';
    return (dec === 'pending' || dec === '') && !hasComment;
  });
  if (step === -1) step = approvers.length;
  
  const timeline = approvers.map((a, i) => {
    const safeName = escapeHtml(a.name || a.role || 'Approver');
    const safeRole = escapeHtml(a.role || '');
    const safeComment = escapeHtml(a.comment || '');
    
    let cls = 'vertical-timeline-dot', badge = '';
    const dec = String(a.decision || '').toLowerCase().trim();
    
    let effectiveDec = dec;
    if ((dec === 'pending' || dec === '') && safeComment !== '') {
        effectiveDec = isRejected ? 'returned' : 'commented';
    } else if ((dec === 'pending' || dec === '') && isOverallApproved) {
        effectiveDec = 'approved';
    }
    
    switch (effectiveDec) {
      case 'approved':
        cls += ' done';
        badge = '<span class="status-badge status-approved">Approved</span>';
        break;
      case 'approved by ism':
        cls += ' done';
        badge = '<span class="status-badge status-approved">Approved by ISM</span>';
        break;
      case 'denied':
        cls += ' denied';
        badge = '<span class="status-badge status-denied">Denied</span>';
        break;
      case 'rejected by ism':
        cls += ' denied';
        badge = '<span class="status-badge status-denied">Rejected by ISM</span>';
        break;
      case 'returned':
        cls += ' rejected';
        badge = '<span class="status-badge status-returned">Returned</span>';
        break;
      case 'escalated to division head':
        cls += ' done';
        badge = '<span class="status-badge" style="background:#eff6ff;color:#1e40af;border:none;">Escalated to Division Head</span>';
        break;
      case 'commented':
        cls += ' active';
        badge = '<span class="status-badge status-pending">Commented</span>';
        break;
      default:
        if (i === step && !isDenied && !isRejected && !isOverallApproved) {
          cls += ' active';
          badge = '<span class="status-badge status-pending">Awaiting decision</span>';
        } else if (effectiveDec !== 'pending' && effectiveDec !== '') {
          // Round-4: unknown decision strings render NEUTRAL, not approved-green (a stray value
          // must never read as an approval).
          cls += ' done';
          badge = `<span class="status-badge status-info">${escapeHtml(a.decision)}</span>`;
        } else {
          badge = '<span class="status-badge" style="background: var(--bg3); color: var(--text2);">Pending</span>';
        }
    }
    
    const safeDate = a.date ? formatTimestampDisplay(a.date) : '';
    return `<div class="vertical-timeline-item">
      <div class="${cls}" aria-hidden="true"></div>
      <div class="vertical-timeline-title">${safeName} <span style="font-weight:400;color:var(--text3);font-size:11px;">(${safeRole})</span></div>
      <div class="vertical-timeline-sub">${badge}${safeDate ? ` <span style="font-size:10px;color:var(--text3);margin-left:6px;">${safeDate}</span>` : ''}</div>
      ${safeComment ? `<div class="vertical-timeline-comment">"${safeComment}"</div>` : ''}
    </div>`;
  }).join('');

  const dcsTimestamp = data.timestamp ? formatTimestampDisplay(data.timestamp) : '';

  // Round-4: innerOnly returns the timeline content without its own card, so
  // renderUnifiedApprovalHistory can merge it with the ISM chain into ONE card.
  if (innerOnly) {
    return `
        <div class="card-title" style="margin-bottom: 12px; color: var(--navy-mid);">Heads Approval</div>
        <div class="vertical-timeline" role="list" style="margin-top: 0;">
          ${timeline}
        </div>
    `;
  }

  return `
    <div class="card">
      <details open>
        <summary style="font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;">
          <span class="card-title" style="margin-bottom: 0; color: #000000;">Approval Workflow Tracker${dcsTimestamp ? ` <span style="font-weight:400;font-size:11px;color:var(--text3);">· Submitted ${dcsTimestamp}</span>` : ''}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text3);">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </summary>
        <div class="vertical-timeline" role="list">
          ${timeline}
        </div>
      </details>
    </div>
  `;
}

/*
  Function Name: renderUnifiedApprovalHistory

  LAYMAN:
  The single "Approval History" card on the request-details page. One list, grouped by round:
  earlier rounds (the ones that ended in a Return, read from the permanent logbook) come first,
  then the current round with the live heads + ISM/Division Head chains. Replaces the two
  separate tracker cards that made the history feel scattered.

  TECHNICAL:
  Prior rounds come from data.revisionHistory (additive apiGetRequestData field read from PIA's
  Revision_History sheet; guarded with || [] for a stale backend). Current round reuses the two
  existing tracker builders in innerOnly mode (their effective-status logic is untouched).
  Statuses follow the unified color matrix; legacy boilerplate comments are hidden.

  PARAMS:
  - data: the apiGetRequestData response.

  RETURNS:
  HTML string for the unified card, or '' when there is nothing to show.
*/
function renderUnifiedApprovalHistory(data) {
  const headsInner = renderApprovalTracker(data, true);
  const ismInner = renderISMAndDivHeadTracker(data, true);
  const priorRounds = data.revisionHistory || [];
  if (!headsInner && !ismInner && priorRounds.length === 0) return '';

  const roundHeader = function (label, isCurrent) {
    return '<div style="font-size:11px;font-weight:700;color:' + (isCurrent ? 'var(--navy-text)' : 'var(--text3)') +
      ';text-transform:uppercase;letter-spacing:0.05em;margin:14px 0 10px;border-bottom:1px solid var(--border);padding-bottom:4px;">' +
      escapeHtml(label) + '</div>';
  };

  // Prior rounds: compact timeline items from the logbook rows.
  let priorHtml = '';
  priorRounds.forEach(function (r) {
    const items = (r.decisions || []).map(function (d) {
      const st = String(d.status || d.decision || '').toLowerCase();
      let dotCls = 'vertical-timeline-dot', badge = '';
      if (/approved/.test(st)) { dotCls += ' done'; badge = '<span class="status-badge status-approved">Approved</span>'; }
      else if (/return|reject/.test(st)) { dotCls += ' rejected'; badge = '<span class="status-badge status-returned">Returned</span>'; }
      else if (/deny|denied/.test(st)) { dotCls += ' denied'; badge = '<span class="status-badge status-denied">Denied</span>'; }
      else if (/escalat/.test(st)) { dotCls += ' done'; badge = '<span class="status-badge" style="background:#eff6ff;color:#1e40af;border:none;">Escalated to Division Head</span>'; }
      else { badge = '<span class="status-badge status-info">' + escapeHtml(d.status || d.decision || '') + '</span>'; }
      const name = escapeHtml(d.approverName || d.approverEmail || 'Approver');
      const role = escapeHtml(d.role || '');
      const dateStr = d.decisionDate ? escapeHtml(String(d.decisionDate)) : '';
      const comment = d.comments ? escapeHtml(String(d.comments)) : '';
      const flagKeys = (d.flaggedFields && typeof d.flaggedFields === 'object') ? Object.keys(d.flaggedFields) : [];
      const flagsHtml = flagKeys.length
        ? '<div style="font-size:11px;color:var(--warn-text);margin-top:3px;">Flagged: ' + flagKeys.map(function (k) {
            const reason = d.flaggedFields[k];
            const label = k.indexOf('DCS - ') === 0 ? k.slice(6) : k;
            return escapeHtml(label) + (reason && reason !== true ? ' (' + escapeHtml(String(reason)) + ')' : '');
          }).join(', ') + '</div>'
        : '';
      return '<div class="vertical-timeline-item">' +
        '<div class="' + dotCls + '" aria-hidden="true"></div>' +
        '<div class="vertical-timeline-title">' + name + ' <span style="font-weight:400;color:var(--text3);font-size:11px;">(' + role + ')</span></div>' +
        '<div class="vertical-timeline-sub">' + badge + (dateStr ? ' <span style="font-size:10px;color:var(--text3);margin-left:6px;">' + dateStr + '</span>' : '') + '</div>' +
        (comment ? '<div class="vertical-timeline-comment">"' + comment + '"</div>' : '') +
        flagsHtml +
        '</div>';
    }).join('');
    priorHtml += roundHeader('Round ' + r.round + ' (returned and revised)', false) +
      '<div class="vertical-timeline" role="list" style="margin-top:0;opacity:0.85;">' + items + '</div>';
  });

  const currentRoundNo = priorRounds.length ? (priorRounds[priorRounds.length - 1].round + 1) : 1;
  const currentHeaderHtml = priorRounds.length ? roundHeader('Round ' + currentRoundNo + ' (Current)', true) : '';
  const dcsTimestamp = data.timestamp ? formatTimestampDisplay(data.timestamp) : '';

  return `
    <div class="card">
      <details open>
        <summary style="font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;">
          <span class="card-title" style="margin-bottom: 0; color: #000000;">Approval History${dcsTimestamp ? ` <span style="font-weight:400;font-size:11px;color:var(--text3);">· Submitted ${dcsTimestamp}</span>` : ''}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text3);">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </summary>
        ${priorHtml}
        ${currentHeaderHtml}
        ${headsInner}
        ${ismInner ? `<div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px dashed var(--border);">${ismInner}</div>` : ''}
      </details>
    </div>
  `;
}

/*
  Function Name: escapeHtml
  LAYMAN: Makes a string safe to drop into HTML so user text can't break the page or inject markup.
  TECHNICAL: Replaces & < > " ' with their HTML entities. The primary XSS defense for all
             template-literal interpolation in this file.

             The & replacement MUST stay first: escaping it after the others would
             double-escape the entities they just produced (&lt; becomes &amp;lt;).

             Do not let an editor, a docs pass, or an entity-decoding sweep "simplify"
             the right-hand sides back to bare characters. Until 2026-08-12 this read
             .replace(/&/g,'&').replace(/</g,'<')... , four identity no-ops, so only the
             apostrophe was ever escaped. It is the sole XSS defense for 71 interpolation
             sites in this file, including approver comments rendered into innerHTML.
  PARAMS:
  - str: the raw string (falsy -> '').
  RETURNS: The HTML-escaped string.
*/
function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/*
  Function Name: formatTimestampDisplay
  LAYMAN: Formats a date/time into a friendly "Jun 16, 2026 3:45 PM" string.
  TECHNICAL: Parses raw with new Date(); returns '' on invalid/empty. Uses en-US locale
             date + 12-hour time.
  PARAMS:
  - raw: a Date-parseable value.
  RETURNS: Formatted string, or '' if unparseable.
*/
function formatTimestampDisplay(raw) {
  if (!raw) return '';
  try {
    const d = new Date(raw);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' +
           d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  } catch (e) {
    return '';
  }
}
/*
  Function Name: showLoading
  LAYMAN: Drops a full-screen "Processing..." spinner overlay that blocks the UI during async work.
  TECHNICAL: Appends a #loader-overlay div (role=dialog, aria-busy) with a spinner + escaped message.
  PARAMS:
  - message: text under the spinner (default 'Processing...').
  RETURNS: Nothing.
*/
function showLoading(message = 'Processing...') {
  const el = document.createElement('div');
  el.id = 'loader-overlay';
  el.className = 'loader-overlay';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-live', 'assertive');
  el.setAttribute('aria-busy', 'true');
  el.innerHTML = `<div class="loader-box"><div class="spinner" aria-hidden="true"></div><p>${escapeHtml(message)}</p></div>`;
  document.body.appendChild(el);
}
/*
  Function Name: hideLoading
  LAYMAN: Removes the loading spinner overlay.
  TECHNICAL: Removes #loader-overlay if present.
  PARAMS: (none)
  RETURNS: Nothing.
*/
function hideLoading() {
  document.getElementById('loader-overlay')?.remove();
}

/*
  Function Name: safeIdAttr
  LAYMAN: Cleans an ID so it is safe to drop inside an onclick="..." attribute. Request IDs and
          Drive file IDs are only ever letters, numbers, dashes and underscores, so anything else
          is stripped rather than escaped.
  TECHNICAL: Whitelist filter (not a blacklist), returns '' for null/undefined. Used instead of
             escapeHtml for values that land inside a JS string literal inside an HTML attribute,
             where HTML-entity escaping alone would not prevent quote breakout.
  PARAMS:
  - v: the raw id.
  RETURNS: The filtered id string.
*/
function safeIdAttr(v) {
  return String(v == null ? '' : v).replace(/[^A-Za-z0-9_-]/g, '');
}

/* ── Secure document viewer ──────────────────────────────────────────────────────────
   Files live PRIVATELY in the company Drive vault (they used to be shared with anyone
   holding the link, so one forwarded link leaked a signed NDA publicly). Nothing here
   ever exposes a Drive URL: the server hands back the raw bytes, and we render them
   from a same-document blob.

   🚩 WHY A MODAL AND NOT window.open(blobUrl). This app is served inside Apps Script's
   sandboxed iframe. Popups are blocked there, and a blob: URL minted inside that frame
   is not reliably navigable as a top-level document. Rendering into the CURRENT document
   is the only approach that works consistently, so the preview is an in-page overlay.

   🚩 THE BLOB URL MUST OUTLIVE THE CALL. The old download-only path revoked immediately
   after the synthetic click; a preview cannot, because the <iframe>/<img> reads the URL
   for as long as it is on screen. It is revoked in closeFilePreview() instead, which is
   why every exit route (X, backdrop, Esc, opening a second file) funnels through there.
   Miss one and the blob leaks for the life of the page.
────────────────────────────────────────────────────────────────────────────────────── */

// Live blob URL while the preview is open. Exactly one at a time; see closeFilePreview.
var __filePreviewUrl = null;

/*
  Function Name: filePreviewEscHandler
  LAYMAN: Closes the document preview when you press Esc.
  TECHNICAL: Named (not anonymous) so removeEventListener can actually detach it, an
             anonymous handler here would stack one listener per preview opened.
  PARAMS: - e: the keydown event.   RETURNS: Nothing.
*/
function filePreviewEscHandler(e) {
  if (e.key === 'Escape') closeFilePreview();
}

/*
  Function Name: closeFilePreview
  LAYMAN: Closes the preview window and frees the memory the document was using.
  TECHNICAL: Removes the overlay, revokes the object URL, and detaches the Esc listener.
             Safe to call when nothing is open, which is why showFilePreview calls it first
             to guarantee only one preview (and one live blob) exists at a time.
  PARAMS: (none)   RETURNS: Nothing.
*/
function closeFilePreview() {
  var host = document.getElementById('filePreviewOverlay');
  if (host && host.parentNode) host.parentNode.removeChild(host);
  if (__filePreviewUrl) { URL.revokeObjectURL(__filePreviewUrl); __filePreviewUrl = null; }
  document.removeEventListener('keydown', filePreviewEscHandler);
}

/*
  Function Name: showFilePreview
  LAYMAN: Shows the document right here on the page instead of downloading it, because the
          point of "View" is to check what was submitted, not to collect files on your laptop.
          PDFs and images show inline; anything else (Word, Excel) can't be displayed by a
          browser, so those get a Download button and an honest explanation.
  TECHNICAL: Decodes base64 -> Blob -> object URL, then builds the overlay with createElement
             and sets the filename via textContent. Deliberately NOT innerHTML with the name
             interpolated: the filename is user-supplied and this file's escapeHtml is not in
             scope inside every copy of this block, so textContent is the portable safe choice.
             A Download button is ALWAYS offered even when the inline render succeeds, as the
             escape hatch if a given browser refuses to display the type.
  PARAMS:
  - data: { base64, mimeType, filename } exactly as apiDownloadDcsFile returns it.
  RETURNS: Nothing (mutates the DOM).
*/
function showFilePreview(data) {
  closeFilePreview();   // never stack two previews, never leak the previous blob

  var mime = String((data && data.mimeType) || 'application/octet-stream');
  var name = String((data && data.filename) || 'document');

  var byteChars = atob(data.base64);
  var byteNums = new Array(byteChars.length);
  for (var i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
  __filePreviewUrl = URL.createObjectURL(new Blob([new Uint8Array(byteNums)], { type: mime }));

  var isPdf = mime.indexOf('pdf') !== -1;
  var isImg = mime.indexOf('image/') === 0;

  var ov = document.createElement('div');
  ov.id = 'filePreviewOverlay';
  ov.setAttribute('role', 'dialog');
  ov.setAttribute('aria-modal', 'true');
  ov.setAttribute('aria-label', 'Document preview');
  ov.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(17,24,39,0.6);' +
    'z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;';

  var box = document.createElement('div');
  box.style.cssText = 'background:#fff;border-radius:9px;width:100%;max-width:900px;height:90vh;' +
    'display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25);';

  var head = document.createElement('div');
  head.style.cssText = 'display:flex;align-items:center;gap:10px;padding:11px 14px;' +
    'border-bottom:1px solid #e5e7eb;flex-shrink:0;';

  var title = document.createElement('div');
  title.textContent = name;   // user-supplied, never parsed as HTML
  title.style.cssText = 'font-weight:600;font-size:13.5px;color:#111827;flex:1;min-width:0;' +
    'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';

  var dl = document.createElement('button');
  dl.type = 'button';
  dl.textContent = 'Download';
  dl.style.cssText = 'padding:6px 14px;font-size:12.5px;font-weight:500;cursor:pointer;' +
    'border:1px solid #d1d5db;border-radius:4px;background:#fff;color:#111827;flex-shrink:0;';
  dl.onclick = function () {
    var a = document.createElement('a');
    a.href = __filePreviewUrl;      // reuse the open blob, no second server round trip
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  var x = document.createElement('button');
  x.type = 'button';
  x.setAttribute('aria-label', 'Close preview');
  x.innerHTML = '&times;';
  x.style.cssText = 'border:none;background:none;font-size:22px;line-height:1;cursor:pointer;' +
    'color:#6b7280;padding:0 4px;flex-shrink:0;';
  x.onclick = closeFilePreview;

  head.appendChild(title);
  head.appendChild(dl);
  head.appendChild(x);

  var pane = document.createElement('div');
  pane.style.cssText = 'flex:1;min-height:0;background:#f7f8fa;' +
    (isImg ? 'display:flex;align-items:center;justify-content:center;padding:12px;' : '');

  if (isPdf) {
    var frame = document.createElement('iframe');
    frame.src = __filePreviewUrl;
    frame.title = name;
    frame.style.cssText = 'width:100%;height:100%;border:0;display:block;';
    pane.appendChild(frame);
  } else if (isImg) {
    var img = document.createElement('img');
    img.src = __filePreviewUrl;
    img.alt = name;
    img.style.cssText = 'max-width:100%;max-height:100%;display:block;';
    pane.appendChild(img);
  } else {
    var note = document.createElement('div');
    note.style.cssText = 'padding:36px 24px;text-align:center;color:#4b5563;font-size:13px;line-height:1.7;';
    note.textContent = 'This file type cannot be displayed in the browser. ' +
      'Use Download to open it in the right application.';
    pane.appendChild(note);
  }

  box.appendChild(head);
  box.appendChild(pane);
  ov.appendChild(box);
  ov.addEventListener('click', function (e) { if (e.target === ov) closeFilePreview(); });
  document.body.appendChild(ov);
  document.addEventListener('keydown', filePreviewEscHandler);
}

/*
  Function Name: viewDcsFile
  LAYMAN: Opens one of the uploaded documents so you can look at it. The server first checks
          the document really belongs to this request before handing anything over.
  TECHNICAL: Calls apiDownloadDcsFile(reqId, fileId), the server endpoint keeps its name, it
             genuinely returns the bytes; only the client presentation changed from a forced
             download to an inline preview. Disables the button for the round trip and restores
             it on every branch.
  PARAMS:
  - reqId: the DCS Request ID that owns the document.
  - fileId: the Drive file ID (validated server-side against reqId).
  - btn: the clicked element, so we can show a per-button loading state.
  RETURNS: Nothing (async; opens the preview overlay or shows an alert).
*/
function viewDcsFile(reqId, fileId, btn) {
  var originalHtml = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; btn.innerHTML = 'Opening...'; }

  var restore = function () {
    if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.innerHTML = originalHtml; }
  };

  google.script.run
    .withSuccessHandler(function (res) {
      restore();
      if (!res || !res.ok) {
        showCustomAlert((res && res.message) ? res.message : 'Could not open this document.', 'danger');
        return;
      }
      try {
        showFilePreview(res.data);
      } catch (err) {
        showCustomAlert('Could not display this document. Please try again.', 'danger');
      }
    })
    .withFailureHandler(function (err) {
      restore();
      showCustomAlert('Could not open this document. Please try again or contact ISM.', 'danger');
    })
    .apiDownloadDcsFile(reqId, fileId);
}

/*
  Function Name: renderWithErrorBoundary
  LAYMAN: Runs a screen's render function but, if it throws, shows a friendly "An Error
          Occurred" panel with a Return to Home button instead of a blank/broken screen.
  TECHNICAL: try/catch wrapper around renderFn(); on error logs it and writes a fallback
             into the given screen container.
  PARAMS:
  - screenId: id of the screen container to write the fallback into.
  - renderFn: the render function to invoke.
  RETURNS: Nothing.
*/
// Error boundary wrapper (MEDIUM: prevents render crashes)
function renderWithErrorBoundary(screenId, renderFn) {
  try {
    renderFn();
  } catch (err) {
    console.error('Render error:', err);
    document.getElementById(screenId).innerHTML = `
      <div style="padding: 2rem; text-align: center;">
        <h2 style="color: #991b1b; margin-bottom: 1rem;">An Error Occurred</h2>
        <p style="color: #666; margin-bottom: 1rem;">Something went wrong while loading this screen.</p>
        <button class="btn btn-primary" type="button" onclick="show('landing'); renderLanding();" style="margin-top: 1rem;">
          Return to Home
        </button>
      </div>
    `  }
}

// --- State persistence ------------------------------
/*
  Function Name: getStateSnapshot

  LAYMAN:
  Bundles up the parts of the in-progress request worth saving as a draft, so it can be
  restored later. Deliberately leaves out the cached list of drafts (to avoid bloating the
  saved blob).

  TECHNICAL:
  Returns a plain object: currentScreen (success collapses to 'landing'), sessionId, draftId,
  submittedAt, dcs, isEditing, approverFlags, and approverComments (from _piaRevisionBanner so
  the revision banner survives save/restore). Excludes lastDrafts to stay under Sheet cell limits.

  PARAMS:
  - (none)

  RETURNS:
  The serializable snapshot object persisted via apiSaveDraft.
*/
function getStateSnapshot() {
  return {
    currentScreen: state.currentScreen === 'success' ? 'landing' : state.currentScreen,
    sessionId: state.sessionId,
    draftId: state.draftId,
    submittedAt: state.submittedAt,
    // EXCLUDE lastDrafts to prevent recursive JSON bloat and hitting Google Sheets cell limits
    dcs: state.dcs,
    isEditing: state.isEditing,
    approverFlags: state.approverFlags,
    // Preserve approver comments so the revision banner survives draft save/restore
    approverComments: state._piaRevisionBanner || ''
  };
}

/*
  Function Name: persistState

  LAYMAN:
  Saves the current draft to the server (the Drafts sheet), but only if a session is active.
  For autosaves it also updates the little "Saved / Save failed" pill.

  TECHNICAL:
  No-op without state.sessionId. Sends getStateSnapshot() via google.script.run.apiSaveDraft
  with success/failure handlers; when isAutoSave it reflects status through showDraftStatus().
  Intentionally does NOT use localStorage (avoids client/server state mismatch).

  PARAMS:
  - isAutoSave: when true, surface save status in the autosave pill (default false).

  RETURNS:
  Nothing (async backend write).
*/
function persistState(isAutoSave = false) {
  // State is no longer stored in localStorage to prevent mismatch bugs.
  // We only sync to the backend Drafts sheet if a sessionId is active.
  if (state.sessionId) {
    const snapshot = getStateSnapshot();
    if (typeof google !== 'undefined') {
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.ok) {
            if (isAutoSave) showDraftStatus('Saved', false);
          } else {
            console.warn('Draft save failed:', res?.message || 'Unknown error');
            if (isAutoSave) showDraftStatus('Save failed', true);
          }
        })
        .withFailureHandler((err) => {
          console.error('Draft save error:', err.message);
          if (isAutoSave) showDraftStatus('Save error', true);
        })
        .apiSaveDraft(state.sessionId, snapshot);
    }
  }
}

/*
  Function Name: triggerAutoSave
  LAYMAN: Debounced autosave, waits ~1.2s after you stop typing on the form, then syncs and
          saves the draft. Wired to global input/change events.
  TECHNICAL: No-op unless on the 'form' screen with a session. Clears the prior timeout, shows
             "Saving...", then after 1200ms runs syncDCSState() + persistState(true).
  PARAMS: (none)
  RETURNS: Nothing.
*/
function triggerAutoSave() {
  if (!state.sessionId || state.currentScreen !== 'form') return;
  clearTimeout(autoSaveTimeout);
  showDraftStatus('Saving...', false);
  autoSaveTimeout = setTimeout(() => {
    syncDCSState();
    persistState(true);
  }, 1200); // Wait for 1.2s of inactivity before saving
}

/*
  Function Name: restoreState
  LAYMAN: Intentionally does nothing, localStorage restoration was disabled on purpose.
  TECHNICAL: Always returns false. Kept as a stub so call sites don't break.
  PARAMS: (none)
  RETURNS: false.
*/
function restoreState() {
  return false; // LocalStorage restoration disabled per user request.
}

/*
  Function Name: deleteDraft
  LAYMAN: If the draft being deleted is the one you're currently working on, clear the form.
  TECHNICAL: Calls resetDraftState() only when sid matches state.sessionId.
  PARAMS:
  - sid: the session id of the deleted draft.
  RETURNS: Nothing.
*/
function deleteDraft(sid) {
  if (state.sessionId === sid) resetDraftState();
}

/*
  Function Name: cancelRevision
  LAYMAN: Bails out of revising a returned application, asks to confirm, discards the working
          draft, and returns to the requests list.
  TECHNICAL: showCustomConfirm; on confirm, apiDeleteDraft(sessionId), resetDraftState(),
             then renderRequests().
  PARAMS: (none)
  RETURNS: Nothing.
*/
function cancelRevision() {
  showCustomConfirm('Are you sure you want to cancel your revision? Unsaved changes will be lost.', () => {
    if (typeof google !== 'undefined' && state.sessionId) {
      google.script.run.apiDeleteDraft(state.sessionId);
    }
    resetDraftState();
    renderRequests();
  }, 'warn');
}

/*
  Function Name: resetDraftState
  LAYMAN: Wipes the form back to a clean slate, clears session/draft ids, revision flags,
          approver flags, and every DCS/agency field.
  TECHNICAL: Resets state.sessionId/draftId/submittedAt/lastDrafts/isEditing/approverFlags and
             rebuilds state.dcs (including the nested agency object) to empty defaults.
  PARAMS: (none)
  RETURNS: Nothing.
*/
function resetDraftState() {
  state.sessionId = '';
  state.draftId = '';
  state.submittedAt = '';
  state.lastDrafts = [];
  state.isEditing = false;
  state.approverFlags = {};
  state.dcs = {
    name: '', location: '', locationOther: '', dept: '', access: '', ihelp: '',
    isAgency: false, isOJT: false, _hadFiles: false,
    immHeadName: '', immHeadEmail: '',
    deptHeadName: '', deptHeadEmail: '',
    divHeadName: '', divHeadEmail: '',
    nda: '', dsa: '',
    accountable: {},
    agency: {
      agencyName: '', agencyPersonnel: '', contractStartDate: '',
      endorsementLetter: '', networkDrive: '',
      immHeadRecoveryEmail: '', immHeadRecoveryNumber: ''
    }
  };
}

/*
  Function Name: logout
  LAYMAN: Clears the current session/draft and returns to the home screen.
  TECHNICAL: resetDraftState(), persistState() (clears the server draft), then show+render landing.
  PARAMS: (none)
  RETURNS: Nothing.
*/
// MEDIUM/LOW: Logout function to clear session (25. No logout/session cleanup)
function logout() {
  resetDraftState();
  persistState();
  show('landing');
  renderLanding();
}

/*
  Function Name: addAccountableRow

  LAYMAN:
  Adds another "Accountable Person" name+email row to the form (with a red delete button).
  Caps at 5 rows and warns if you try to add more.

  TECHNICAL:
  No-op without #accountable-container; warns and returns at 5 existing .accountable-row nodes.
  Builds a row with .acc-name/.acc-email inputs (name input runs validatePersonName on input),
  appends it, then calls updateAddAccountableBtn() to refresh the disabled state.

  PARAMS:
  - name: prefill for the name input (default '').
  - email: prefill for the email input (default '').

  RETURNS:
  Nothing (DOM side-effect).
*/
function addAccountableRow(name = '', email = '') {

  if (!container) return;

  if (rows.length >= 5) {

    return;
  }

      <input class="acc-email" type="email" value="${escapeHtml(email)}" placeholder="email@company.com" maxlength="${CONFIG.MAX_EMAIL_LENGTH}" style="flex: 1;">
      <button type="button" class="btn" style="width:32px; height:32px; padding:0; background:#dc2626; color:white; border:none; flex-shrink:0; display:flex; align-items:center; justify-content:center;" onclick="this.closest('.accountable-row').remove(); updateAddAccountableBtn();" title="Remove">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>

/*
  Function Name: updateAddAccountableBtn
  LAYMAN: Greys out the "Add Accountable Person" button once there are 5 rows.

/*
  Function Name: sanitizeDCSData

  LAYMAN:
  Produces a clean copy of the DCS form data, every field trimmed, escaped of dangerous bits,
  and length-capped, ready to show in the summary or send to the server.

  TECHNICAL:
  Runs each known field through sanitizeText() with the appropriate cap (names, emails,
  ihelp=10, nda/dsa=200). Rebuilds the accountable map for indices 1..5, keeping only rows that
  have a name or email.

  PARAMS:
  - data: the raw state.dcs object (non-object -> treated as {}).

  RETURNS:
  A new sanitized DCS data object (does not mutate the input).
*/
function sanitizeDCSData(data) {
  const clean = data && typeof data === 'object' ? data : {};
  return {
    name: sanitizeText(clean.name, CONFIG.MAX_NAME_LENGTH),
    location: sanitizeText(clean.location, CONFIG.MAX_NAME_LENGTH),
    dept: sanitizeText(clean.dept, CONFIG.MAX_NAME_LENGTH),
    access: sanitizeText(clean.access, CONFIG.MAX_NAME_LENGTH),
    ihelp: sanitizeText(clean.ihelp, 10),
    immHeadName: sanitizeText(clean.immHeadName, CONFIG.MAX_NAME_LENGTH),
    immHeadEmail: sanitizeText(clean.immHeadEmail, CONFIG.MAX_EMAIL_LENGTH),
    deptHeadName: sanitizeText(clean.deptHeadName, CONFIG.MAX_NAME_LENGTH),
    deptHeadEmail: sanitizeText(clean.deptHeadEmail, CONFIG.MAX_EMAIL_LENGTH),
    divHeadName: sanitizeText(clean.divHeadName, CONFIG.MAX_NAME_LENGTH),
    divHeadEmail: sanitizeText(clean.divHeadEmail, CONFIG.MAX_EMAIL_LENGTH),
    nda: sanitizeText(clean.nda, 200),
    dsa: sanitizeText(clean.dsa, 200),
    accountable: (() => {
      const acc = {};
      const raw = clean.accountable || {};
      for (let i = 1; i <= 5; i++) {
        if (raw[`accountableName${i}`] || raw[`accountableEmail${i}`]) {
          acc[`accountableName${i}`] = sanitizeText(raw[`accountableName${i}`], CONFIG.MAX_NAME_LENGTH);
          acc[`accountableEmail${i}`] = sanitizeText(raw[`accountableEmail${i}`], CONFIG.MAX_EMAIL_LENGTH);
        }
      }
      return acc;
    })()
  };
}

/*
  Function Name: show

  LAYMAN:
  The router. Hides every screen, reveals the one named, shows/hides the top nav (hidden on
  landing), re-triggers the entrance animation, and moves keyboard focus to its heading.

  TECHNICAL:
  Adds .hidden to all #app > div (except .top-nav), un-hides #screen-<name>, force-reflows to
  restart the CSS animation, toggles #app-top-nav, sets state.currentScreen, then (next frame)
  focuses the screen's first h1/h2 for accessibility. Note: this only toggles visibility, the
  caller is responsible for rendering the screen's content.

  PARAMS:
  - name: screen key (e.g. 'form', 'summary', 'request-details').

  RETURNS:
  Nothing (DOM side-effect).
*/
function show(name) {
  document.querySelectorAll('#app > div:not(.top-nav)').forEach(d => d.classList.add('hidden'));
  const el = document.getElementById('screen-' + name);
  if (el) {
    el.classList.remove('hidden');
    el.removeAttribute('style');
    void el.offsetWidth;
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  }

  const topNav = document.getElementById('app-top-nav');
  if (topNav) {
    name === 'landing' ? topNav.classList.add('hidden') : topNav.classList.remove('hidden');
  }

  state.currentScreen = name;
  requestAnimationFrame(() => {
    const h = el?.querySelector('h1, h2');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus(); }
  });
}

  Function Name: renderCurrentScreen

  TECHNICAL: Switches on state.currentScreen to the matching render*(); defaults to renderLanding().

  RETURNS: Nothing.
*/

  switch (state.currentScreen) {
    case 'guide': renderGuide(); break;

/*
  Function Name: renderSidebarTracker

  LAYMAN:
  Builds the 3-step progress indicator (Guidelines → Details → Review), a labelled sidebar on
  desktop and a thin dotted bar on mobile. Steps before the current one show a check, except a
  completed "Details" step shows a "?" when optional fields are still blank.

  TECHNICAL:
  Returns desktop (.form-sidebar) + mobile (.progress-bar) HTML. A nested
  hasUnfilledOptionalFields() inspects state.dcs to decide whether step 2 renders as 'pending'
  (with '?') instead of 'done' (with a check icon).

  PARAMS:
  - activeStep: the current step number (1-3).

  RETURNS:
  HTML string for both the desktop and mobile trackers.
*/
function renderSidebarTracker(activeStep) {
  const steps = [
    { num: 1, label: 'Guidelines' },
    { num: 2, label: 'Details' },
    { num: 3, label: 'Review' }
  ];

  let desktopHtml = `<aside class="form-sidebar desktop-tracker"><div class="form-sidebar-title">Application Progress</div><div class="sidebar-steps">`;
  steps.forEach(step => {
    let cls = '';
    let numHtml = step.num;
    if (step.num < activeStep) {
      cls = 'done';
      numHtml = icon('check', 13);
    } else if (step.num === activeStep) {
      cls = 'active';
    }
    desktopHtml += `
      <div class="sidebar-step ${cls}">
        <div class="sidebar-step-num">${numHtml}</div>
        <div class="sidebar-step-text">Section ${step.num} <span style="font-weight:${step.num === activeStep ? '600' : '400'};">${step.label}</span></div>
      </div>
    `;
  });
  desktopHtml += `</div></aside>`;

  let mobileHtml = '<nav class="progress-bar mobile-tracker" aria-label="Form progress">';
  for (let i = 1; i <= 3; i++) {
    const cls = i < activeStep ? 'done' : i === activeStep ? 'active' : '';
    const label = i < activeStep ? 'Completed' : i === activeStep ? 'Current' : 'Upcoming';
    mobileHtml += `<div class="progress-step ${cls}" role="progressbar" aria-label="Step ${i}: ${label}" aria-valuenow="${i}" aria-valuemin="1" aria-valuemax="3"></div>`;
  }
  mobileHtml += '</nav>';

  return desktopHtml + mobileHtml;
}

/*

  drafts: if some exist it shows the drafts screen so you can resume; otherwise it starts a
  fresh session and opens the form.

  TECHNICAL:
  Disables the button with a "Checking drafts..." label, calls apiListUserDrafts(); on results
